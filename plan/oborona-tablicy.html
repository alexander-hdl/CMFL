<title>Оборона таблицы</title>

<style>
/* 1. Токены. Игра держит один яркий дневной вид, тёмной темы нет. */
:root {
  --bg:#17324a; --grass:#8fcf6a; --grass-2:#79bb57; --path:#ecd29b; --path-edge:#c9a66b;
  --stone:#a7b0bb; --stone-2:#7d8792; --castle:#d9dee5; --roof:#d65a4a; --wood:#a8703f;
  --ink:#1b2333; --paper:#fffaf0; --gold:#ffc83d; --gold-ink:#2a1d00;
  --beam:#ffd23f; --beam-core:#fff6c8; --miss:#8e949c; --hint:#3b6fd8;
  --enemy:#8a63d2; --enemy-2:#6c48b3; --boss:#59606d; --rivet:#c8ced6;
  --heart:#e8445a; --good:#2fa36b;
  --panel:#1f3b4d; --panel-ink:#f2f6ee;
  --b0:#cfd6de; --b1:#ff6f61; --b2:#ff9f4a; --b3:#ffd24a; --b4:#9be27a; --b5:#43c97a;
  --f-num:"Russo One","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:30px; /* базовый текст в лп; крупный шрифт = 37.5px */
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--f-body); font-size: var(--fs); color: var(--panel-ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* 2. Сцена: логическое поле 1600x900, масштаб и letterbox ставит JS (Render.resize). */
#app { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--grass); }
#field { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; display: block; touch-action: none; }

/* 3. HUD: сердца, лента волны, номер волны, пауза. Сам слой не ловит касания. */

#hearts { position: absolute; left: 18px; top: 38px; display: flex; gap: 3px; }
#hearts svg { width: 30px; height: 28px; fill: var(--heart); stroke: #7d1626; stroke-width: 1.4; }
#hearts svg.lost { fill: none; stroke: #6f8797; opacity: .8; }
#ribbon-cap { position: absolute; left: 350px; top: 3px; width: 890px; height: 32px; line-height: 32px; text-align: center; font-weight: 800; font-size: 26px; opacity: .9; }
#ribbon { position: absolute; left: 350px; top: 38px; width: 890px; height: 64px; display: flex; gap: 6px; justify-content: center; }
.rc { position: relative; flex: none; width: 66px; height: 60px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 4px solid #c9b88a; font: 400 32px/52px var(--f-num); text-align: center; }
.rc.l3 { font-size: 26px; }
.rc.boss { background: #dfe3e8; border-color: var(--boss); border-width: 5px; }
.rc.walk { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.55); }
.rc.killed { opacity: .5; }
.rc.castle { background: #f5d7d3; border-color: var(--roof); }
.rc svg { position: absolute; right: -6px; bottom: -8px; width: 26px; height: 26px; }
.rc.killed svg { fill: var(--good); }
.rc.castle svg { fill: var(--roof); }
#wave-info { position: absolute; left: 1246px; top: 34px; width: 154px; text-align: center; font: 400 28px/1.2 var(--f-num); }
.btn { border-radius: 22px; background: linear-gradient(#ffd75e,#ffc83d); color: var(--gold-ink); font-weight: 800; font-size: 34px; box-shadow: 0 6px 0 #b9861a; pointer-events: auto; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b9861a; }
.btn.alt { background: linear-gradient(#e9f0f4,#cfdbe3); color: var(--ink); box-shadow: 0 6px 0 #8aa0ae; }
#btn-pause { position: absolute; left: 1410px; top: 12px; width: 176px; height: 84px; }

/* 4. Рука с цифрами и «В бой!». */
#hand { position: absolute; left: 0; top: 790px; width: 1600px; height: 110px; background: var(--panel); border-top: 4px solid #2b4f66; display: flex; align-items: center; gap: 10px; padding: 0 24px; touch-action: none; }
#hand .hd { flex: none; width: 88px; height: 88px; border-radius: 24px; background: var(--paper); border: 6px solid var(--wood); color: var(--ink); font: 400 50px/1 var(--f-num); box-shadow: 0 5px 0 #6f4524; touch-action: none; }
#hand .hd.armed { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(255,200,61,.6), 0 5px 0 #6f4524; transform: translateY(-6px); }
#hand .hd.off { opacity: .5; }
#btn-fight { position: absolute; right: 24px; top: 8px; width: 400px; height: 90px; font-size: 46px; font-family: var(--f-num); font-weight: 400; background: linear-gradient(#7fe3a4,#3cc57a); color: #06301a; box-shadow: 0 6px 0 #1f7a49; }
#btn-fight:active { box-shadow: 0 3px 0 #1f7a49; }

/* 5. Меню паузы (боковая панель), табличка конца волны, титульный экран. */
#pause-menu { position: absolute; right: 12px; top: 120px; width: 290px; padding: 12px; background: var(--panel); border: 4px solid #2b4f66; border-radius: 26px; display: grid; gap: 8px; }
#pause-menu .btn { width: 100%; height: 76px; font-size: 32px; }
#plaque { position: absolute; left: 400px; top: 270px; width: 800px; padding: 28px 30px 30px; background: var(--paper); color: var(--ink); border: 8px solid var(--gold); border-radius: 36px; text-align: center; display: grid; gap: 10px; justify-items: center; box-shadow: 0 10px 0 rgba(0,0,0,.2); }
#plaque-text { font: 400 62px/1.1 var(--f-num); }
#plaque-sub { font-weight: 800; font-size: 36px; }
#btn-again { width: 360px; height: 92px; margin-top: 10px; }
.screen { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #2a5575, var(--bg) 70%); display: grid; place-content: center; justify-items: center; gap: 24px; text-align: center; z-index: 5; }
.screen h1 { margin: 0; font: 400 118px/1.05 var(--f-num); color: var(--gold); text-shadow: 0 6px 0 #7a5400; }
.screen p { margin: 0; font-weight: 800; font-size: 38px; max-width: 1000px; line-height: 1.3; }
#btn-play { width: 420px; height: 120px; font-size: 56px; font-family: var(--f-num); font-weight: 400; margin-top: 20px; }
#toast { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); padding: 10px 26px; border-radius: 20px; background: var(--paper); color: var(--ink); font-weight: 800; font-size: 32px; pointer-events: none; }

/* 6. Поверни планшет. */
#rotate { position: fixed; inset: 0; z-index: 99; background: var(--bg); color: var(--gold); display: grid; place-content: center; text-align: center; font: 400 9vw/1.15 var(--f-num); padding: 0 6vw; }

/* 7. Спокойный режим движения. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<div id="app">
  <div id="stage">
    <canvas id="field"></canvas>
    <div id="hud" hidden>
      <div id="hearts" aria-label="Сердца"></div>

    </section>
  </div>
  <div id="rotate" hidden>Поверни планшет боком</div>
</div>
<script>
(() => { "use strict";
// Оборона таблицы. Этап 1: прототип (одна дорожка, 6 площадок, одна волна).
// Модули 0–13 — чистая логика: не трогают document и canvas. Рисуют и слушают только Render, UI, Input, Audio и boot.
const W = 1600, H = 900, DT = 1 / 60;
const PAD_R = 48, LINK_MAX = 470, CATCH_CSS = 40, HEARTS = 10;
const WAVES_PER_LEVEL = 1;                       // этап 2 ставит 3
const SPEEDS = { veryslow: 30, slow: 45, normal: 60, fast: 80 };   // лп/с
const GAP = 150, GAP_BOSS = 225;                 // расстояние между врагами, лп
const FIELD_TOP = 110, FIELD_BOTTOM = 790;       // зона поля; выше лента, ниже рука
const MINUS = "−", TIMES = "×";

/* ---------- 0 Util: мелочи и seeded RNG ---------- */
const Util = {
  rng(seed) {                                    // mulberry32
    let a = (seed >>> 0) || 1;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
    };
  },
  clamp: (v, lo, hi) => Math.min(hi, Math.max(lo, v)),
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  fmt: (n) => String(n),
  clone: (o) => JSON.parse(JSON.stringify(o)),
};

/* ---------- 1 Content: факты, шаблоны полей, тексты ---------- */
const Content = {
  HAND: [2, 3, 4, 5, 6, 7, 8, 9, 10],            // этап 2 добавит 20, 30, 40 для земли 6
  // Т1 «Прямая»: одна прямая дорожка, 6 площадок «лесенкой» (раздел 3 чертежа).
  TEMPLATES: {
    T1: {
      id: "T1", name: "Прямая",
      lanes: [[[-60, 450], [1400, 450]]],
      pads: [
        { id: "A0", x: 420, y: 280, lane: 0, side: 1 }, { id: "B0", x: 420, y: 620, lane: 0, side: -1 },
        { id: "A1", x: 720, y: 280, lane: 0, side: 1 }, { id: "B1", x: 720, y: 620, lane: 0, side: -1 },
        { id: "A2", x: 1020, y: 280, lane: 0, side: 1 }, { id: "B2", x: 1020, y: 620, lane: 0, side: -1 },
      ],
      links: null,                               // null = правило Geo.adjacency; иначе { padId: [padId…] }
    },
  },
  TEXT: { fight: "В бой!", pause: "Пауза", resume: "Продолжить", again: "Ещё раз", next: "Следующая волна", rotate: "Поверни планшет боком" },
  // Пары множителей из руки, дающие n (a ≤ b).
  pairsOf(n, hand) {
    hand = hand || Content.HAND;
    const out = [];
    for (const a of hand) for (const b of hand) if (a <= b && a * b === n) out.push([a, b]);
    return out;
  },
  cardKey(a, b, op) { return (op || "m") + ":" + Math.min(a, b) + "x" + Math.max(a, b); },
  cardOf(key) {
    const m = /^([mbd]):(\d+)x(\d+)$/.exec(key);
    return m ? { op: m[1], a: +m[2], b: +m[3], n: +m[2] * +m[3] } : null;
  },
  // Карточка числа: пара из 2–9, если есть, иначе пара с 10.
  cardForNumber(n) {
    const ps = Content.pairsOf(n, Content.HAND);
    if (!ps.length) return "m:?" + n;
    const small = ps.find(([a, b]) => b <= 9) || ps[0];
    return Content.cardKey(small[0], small[1]);
  },
  tableNumbers() {                               // все произведения 2–9 × 2–9 без повторов
    const s = new Set();
    for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) s.add(a * b);
    return [...s].sort((x, y) => x - y);
  },
  // Разрезание босса a×b на две части (раздел 6.2). null — резать нечем (3×3).
  split(card) {
    const c = typeof card === "string" ? Content.cardOf(card) : card;
    if (!c) return null;
    const a = Math.min(c.a, c.b), f = Math.max(c.a, c.b);
    if (f > 3) {
      if (f - 5 >= 2) return [a * 5, a * (f - 5)];
      const h = Math.floor(f / 2);
      return [a * h, a * (f - h)];
    }
    return null;
  },
};

/* ---------- 2 Clock: сегодняшняя дата с подменой ---------- */
const Clock = {
  override: null,
  nowMs: () => Date.now(),
  key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
  today() { return Clock.override || Clock.key(new Date()); },
  addDays(key, n) { const [y, m, d] = key.split("-").map(Number); return Clock.key(new Date(y, m - 1, d + n)); },
  setOverride(k) { Clock.override = k || null; },
};

/* ---------- 3 Bus: события и журнал для тестов ---------- */
const Bus = {
  log: [], seq: 0, subs: {},
  emit(type, payload) {
    const L = Game.level;
    const t = L && (L.phase === "battle" || L.phase === "paused") ? +L.simT.toFixed(3) : Clock.nowMs();
    const ev = Object.assign({ seq: ++Bus.seq, t, type }, payload || {});
    Bus.log.push(ev);
    if (Bus.log.length > 2000) Bus.log.shift();
    const list = Bus.subs[type];
    if (list) for (const fn of list) fn(ev);
    return ev;
  },
  on(type, fn) { (Bus.subs[type] = Bus.subs[type] || []).push(fn); },
  clear() { Bus.log.length = 0; },
};

/* ---------- 4 Store: заглушка (этап 3: localStorage, миграции, зеркало в db) ---------- */
const Store = {
  readonly: false, mode: "local",
  load() {}, save(/* docName */) {}, flush() {}, attachDb() {},
  migrate(doc) { return doc; },
};

/* ---------- 5 Learner: заглушка (этап 3: карточки Лейтнера, путаницы, подсказки) ---------- */
const Learner = {
  onWaveEnd(/* report */) {},
  due() { return []; },
  isMastered() { return false; },
  landDone() { return false; },
  hintMode() { return "full"; },
  recordConfusion() {},
  recordBuildTime() {},
};

/* ---------- 6 Solver: можно ли построить волну на этих площадках ---------- */
// Перебор с возвратом: каждому числу спроса — своя соседняя пара площадок и разложение p = x·y из руки.
// Цифры на площадке не конфликтуют, у башни не больше 2 лучей, заранее стоящие цифры учитываются.
const Solver = {
  canBuild(level, demands) {
    const hand = Content.HAND;
    const edges = [];
    for (const a of Object.keys(level.adj)) for (const b of level.adj[a]) if (a < b) edges.push([a, b]);
    const digit = {}, cnt = {}, used = new Set(), plan = [];
    for (const id of Object.keys(level.towers)) if (level.towers[id].fixed) digit[id] = level.towers[id].digit;
    const go = (i) => {
      if (i === demands.length) return true;
      const n = demands[i];
      for (const [a, b] of edges) {
        const key = a + "|" + b;
        if (used.has(key) || (cnt[a] || 0) >= 2 || (cnt[b] || 0) >= 2) continue;
        for (const x of hand) {
          if (n % x) continue;
          const y = n / x;
          if (!hand.includes(y)) continue;
          if (digit[a] !== undefined && digit[a] !== x) continue;
          if (digit[b] !== undefined && digit[b] !== y) continue;
          const sa = digit[a], sb = digit[b];
          digit[a] = x; digit[b] = y; cnt[a] = (cnt[a] || 0) + 1; cnt[b] = (cnt[b] || 0) + 1;
          used.add(key); plan.push({ number: n, a, b, da: x, db: y });
          if (go(i + 1)) return true;
          plan.pop(); used.delete(key); cnt[a]--; cnt[b]--;
          if (sa === undefined) delete digit[a]; else digit[a] = sa;
          if (sb === undefined) delete digit[b]; else digit[b] = sb;
        }
      }
      return false;
    };
    return go(0) ? { ok: true, plan } : { ok: false, plan: [] };
  },
};

/* ---------- 7 WaveGen: состав волны ---------- */
// Этап 1: простой вариант. 8 врагов из 3 различных табличных чисел (на T1 k ≤ 3), проверка через Solver.
// Этап 3 заменит выбор чисел на корзины Лейтнера, оставив тот же вход и выход.
const WaveGen = {
  SIZE: 8, KINDS: 3,
  make(cx) {
    const rng = cx.rng, L = cx.level;
    const pool = Content.tableNumbers();
    let nums = null;
    for (let tries = 0; tries < 60 && !nums; tries++) {
      const pick = rng.shuffle(pool.slice()).slice(0, WaveGen.KINDS);
      if (Solver.canBuild(L, pick).ok) nums = pick;
    }
    if (!nums) nums = [12, 24, 56];
    // Каждое число минимум дважды, остаток добирается кругом: 3 + 3 + 2.
    let list = [];
    for (let i = 0; i < WaveGen.SIZE; i++) list.push(nums[i % nums.length]);
    const noTriple = (a) => { for (let i = 2; i < a.length; i++) if (a[i] === a[i - 1] && a[i] === a[i - 2]) return false; return true; };
    for (let tries = 0; tries < 100; tries++) { rng.shuffle(list); if (noTriple(list)) break; }
    return {
      idx: cx.waveIdx || 0, easy: false, seed: cx.seed, fixed: {}, hints: [],
      enemies: list.map((n, i) => ({ number: n, card: Content.cardForNumber(n), armored: false, lane: i % L.lanes.length })),
    };
  },
};

/* ---------- 8 Geo: полилинии, пересечения, соседство ---------- */
const Geo = {
  makeLane(id, points) {
    const cum = [0];
    for (let i = 1; i < points.length; i++) cum.push(cum[i - 1] + Util.dist(points[i - 1][0], points[i - 1][1], points[i][0], points[i][1]));
    return { id, points, cum, len: cum[cum.length - 1] };
  },
  prepLane(points) { return Geo.makeLane(0, points); },
  pointAt(lane, d) {
    d = Util.clamp(d, 0, lane.len);
    let i = 0;
    while (i < lane.points.length - 2 && d > lane.cum[i + 1]) i++;
    const p = lane.points[i], q = lane.points[i + 1];
    const sl = lane.cum[i + 1] - lane.cum[i] || 1, t = (d - lane.cum[i]) / sl;
    return { x: p[0] + (q[0] - p[0]) * t, y: p[1] + (q[1] - p[1]) * t, dx: (q[0] - p[0]) / sl, dy: (q[1] - p[1]) / sl };
  },
  // Пересечение отрезков p-q и a-b: {t по p-q, u по a-b} или null.
  segHit(p, q, a, b) {
    const rx = q[0] - p[0], ry = q[1] - p[1], sx = b[0] - a[0], sy = b[1] - a[1];
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((a[0] - p[0]) * sy - (a[1] - p[1]) * sx) / den;
    const u = ((a[0] - p[0]) * ry - (a[1] - p[1]) * rx) / den;
    return t < 0 || t > 1 || u < 0 || u > 1 ? null : { t, u };
  },
  // Первое (по d) пересечение отрезка p-q с дорожкой: {d, t, x, y} или null.
  cross(lane, p, q) {
    let best = null;
    for (let i = 0; i < lane.points.length - 1; i++) {
      const h = Geo.segHit(p, q, lane.points[i], lane.points[i + 1]);
      if (!h) continue;
      const d = lane.cum[i] + h.u * (lane.cum[i + 1] - lane.cum[i]);
      if (!best || d < best.d) best = { d, t: h.t, x: p[0] + (q[0] - p[0]) * h.t, y: p[1] + (q[1] - p[1]) * h.t };
    }
    return best;
  },
  crossD(lane, p, q) { const c = Geo.cross(lane, p, q); return c ? c.d : null; },
  // Соседние площадки: отрезок между центрами пересекает дорожку и короче LINK_MAX. Шаблон может задать links.
  adjacency(level) {
    const adj = {};
    for (const p of level.pads) adj[p.id] = [];
    const tpl = Content.TEMPLATES[level.template];
    if (tpl && tpl.links) {
      for (const id of Object.keys(tpl.links)) adj[id] = tpl.links[id].slice();
      return adj;
    }
    for (let i = 0; i < level.pads.length; i++) for (let j = i + 1; j < level.pads.length; j++) {
      const a = level.pads[i], b = level.pads[j];
      if (Util.dist(a.x, a.y, b.x, b.y) > LINK_MAX) continue;
      if (level.lanes.some((ln) => Geo.crossD(ln, [a.x, a.y], [b.x, b.y]) !== null)) { adj[a.id].push(b.id); adj[b.id].push(a.id); }
    }
    return adj;
  },
};

/* ---------- 9 Level: состояние уровня (простые JSON-объекты) ---------- */
const Level = {
  create(land, idx, templateId) {
    const t = Content.TEMPLATES[templateId || "T1"];
    const L = {
      land, idx, template: t.id,
      lanes: t.lanes.map((pts, i) => Geo.makeLane(i, pts)),
      pads: t.pads.map((p) => Object.assign({ fixed: false }, p)),
      towers: {}, beams: [], enemies: [], queue: [], fx: [],
      spawnT: 0, hearts: HEARTS, wave: null, waveIdx: 0,
      phase: "prep", simT: 0, plaqueT: 0, nextBeamId: 1, nextEnemyId: 1,
      prep: { startMs: 0, lastBuildMs: 0, pairEdits: {}, covered: {} },
      results: [], killedBy: {}, adj: null,
    };
    L.adj = Geo.adjacency(L);
    return L;
  },
  pad(L, id) { return L.pads.find((p) => p.id === id) || null; },
  snapshot() { return Util.clone(Game.level); },
};

/* ---------- 10 Build: правила стройки (подготовка и пауза) ---------- */
const Build = {
  scale: 1,                                      // масштаб экрана, его ставит Render.resize: радиус ловли 40 CSS px = 40/scale лп
  fail: (reason) => ({ ok: false, reason }),
  editable() { const L = Game.level; return !!L && (L.phase === "prep" || L.phase === "paused"); },
  beamsOf(L, padId) { return L.beams.filter((b) => b.a === padId || b.b === padId); },
  beamBetween(L, a, b) { return L.beams.find((m) => (m.a === a && m.b === b) || (m.a === b && m.b === a)) || null; },
  catchRadius() { return PAD_R + CATCH_CSS / Build.scale; },
  padAt(x, y) {                                  // ближайшая площадка в радиусе ловли или null
    const L = Game.level;
    if (!L) return null;
    let best = null, bd = Build.catchRadius();
    for (const p of L.pads) { const d = Util.dist(x, y, p.x, p.y); if (d <= bd) { bd = d; best = p; } }
    return best;
  },
  _label(b) { return b.da + " " + TIMES + " " + b.db + " = " + b.product; },
  _touchPair(L, a, b) {                          // счёт переделок пары за эту подготовку
    const key = [a, b].sort().join("|");
    L.prep.pairEdits[key] = (L.prep.pairEdits[key] || 0) + 1;
    return L.prep.pairEdits[key] - 1;
  },
  _dropBeam(L, beam) {
    L.beams.splice(L.beams.indexOf(beam), 1);
    Bus.emit("beam_broken", { id: beam.id, product: beam.product });
  },
  place(padId, digit) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pad = Level.pad(L, padId);
    if (!pad) return Build.fail("no_pad");
    if (pad.fixed) return Build.fail("fixed");
    if (!Content.HAND.includes(digit)) return Build.fail("digit");
    const old = L.towers[padId];
    if (old && old.digit === digit) return { ok: true, pad: padId };
    L.towers[padId] = { pad: padId, digit, fixed: false, skin: "base" };
    if (old) Build._refresh(L, padId);           // смена цифры: подписи лучей пересчитываются сразу
    Bus.emit("tower_placed", { pad: padId, digit });
    return { ok: true, pad: padId };
  },
  _refresh(L, padId) {
    for (const b of Build.beamsOf(L, padId)) {
      const was = b.product;
      b.da = L.towers[b.a].digit; b.db = L.towers[b.b].digit;
      b.product = b.da * b.db; b.label = Build._label(b);
      if (b.product !== was) {
        b.born = L.phase === "paused" ? "pause" : "prep";
        b.rebuilds = Build._touchPair(L, b.a, b.b);
        Bus.emit("beam_broken", { id: b.id, product: was });
        Bus.emit("beam_built", { id: b.id, a: b.a, b: b.b, product: b.product, born: b.born });
      }
    }
  },
  remove(padId) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    if (!Level.pad(L, padId)) return Build.fail("no_pad");
    const t = L.towers[padId];
    if (!t) return Build.fail("empty");
    if (t.fixed) return Build.fail("fixed");
    for (const b of Build.beamsOf(L, padId)) Build._dropBeam(L, b);
    delete L.towers[padId];
    Bus.emit("tower_removed", { pad: padId });
    return { ok: true };
  },
  move(from, to) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pf = Level.pad(L, from), pt = Level.pad(L, to);
    if (!pf || !pt) return Build.fail("no_pad");
    const t = L.towers[from];
    if (!t) return Build.fail("empty");
    if (t.fixed || pt.fixed) return Build.fail("fixed");
    if (from === to) return { ok: true };
    if (L.towers[to]) return Build.fail("occupied");
    for (const b of Build.beamsOf(L, from)) Build._dropBeam(L, b);   // новое место — новые соседи, лучи рвутся
    delete L.towers[from];
    L.towers[to] = { pad: to, digit: t.digit, fixed: false, skin: t.skin };
    Bus.emit("tower_removed", { pad: from });
    Bus.emit("tower_placed", { pad: to, digit: t.digit });
    return { ok: true };
  },
  link(a, b) {                                   // подпись «da × db»: цифра башни a слева
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pa = Level.pad(L, a), pb = Level.pad(L, b);
    if (!pa || !pb) return Build.fail("no_pad");
    if (a === b || !L.adj[a].includes(b)) return Build.fail("not_adjacent");
    const ta = L.towers[a], tb = L.towers[b];
    if (!ta || !tb) return Build.fail("empty");
    if (Build.beamBetween(L, a, b)) return Build.fail("occupied");
    if (Build.beamsOf(L, a).length >= 2 || Build.beamsOf(L, b).length >= 2) return Build.fail("max_beams");
    const cross = {};
    for (const ln of L.lanes) { const c = Geo.crossD(ln, [pa.x, pa.y], [pb.x, pb.y]); if (c !== null) cross[ln.id] = c; }
    if (!Object.keys(cross).length) return Build.fail("not_adjacent");
    const beam = { id: L.nextBeamId++, a, b, da: ta.digit, db: tb.digit, product: ta.digit * tb.digit, label: "", cross, born: L.phase === "paused" ? "pause" : "prep", rebuilds: 0, blinkT: 0 };
    beam.label = Build._label(beam);
    beam.rebuilds = Build._touchPair(L, a, b);
    L.beams.push(beam);
    Bus.emit("beam_built", { id: beam.id, a, b, product: beam.product, born: beam.born });
    return { ok: true, id: beam.id };
  },
  unlink(a, b) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    if (!Level.pad(L, a) || !Level.pad(L, b)) return Build.fail("no_pad");
    const beam = Build.beamBetween(L, a, b);
    if (!beam) return Build.fail("empty");
    Build._dropBeam(L, beam);
    return { ok: true };
  },
  dropDigit(digit, x, y) {                       // отпускание цифры в логической точке
    if (!Build.editable()) return Build.fail("phase");
    if (!Content.HAND.includes(digit)) return Build.fail("digit");
    const pad = Build.padAt(x, y);
    if (!pad) return Build.fail("no_pad");
    const r = Build.place(pad.id, digit);
    return r.ok ? { ok: true, pad: pad.id } : Object.assign({ pad: pad.id }, r);
  },
};

/* ---------- 11 Rules: что делает луч с врагом (чистая функция) ---------- */
// Обычный враг: p == rem — победа, иначе проходит. Железный: p < rem — число уменьшается, p == rem — победа, p > rem — проходит.
const Rules = {
  apply(enemy, beam) {
    const p = beam.product, rem = enemy.rem;
    if (p === rem) return { kind: "kill", from: rem, to: 0 };
    if (enemy.armored && p < rem) return { kind: "cut", from: rem, to: rem - p };
    return { kind: "miss", from: rem, to: rem };
  },
};

/* ---------- 12 Sim: фиксированный шаг 1/60 с ---------- */
const Sim = {
  speed() { return SPEEDS[Game.settings.speed] || SPEEDS.slow; },
  spawn(L) {
    const q = L.queue.shift();
    const e = { id: L.nextEnemyId++, ord: q.ord, card: q.card, number: q.number, rem: q.number, armored: !!q.armored, lane: q.lane || 0, d: 0,
      alive: true, outcome: null, hitLog: [], note: null, noteT: 0, cutNote: null, hintBeaten: false, deadT: 0 };
    L.enemies.push(e);
    Bus.emit("enemy_spawn", { id: e.id, number: e.number, armored: e.armored, lane: e.lane });
    return e;
  },
  burst(L, x, y) {                               // 6 звёздочек, без случайности
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2 + 0.3;
      L.fx.push({ x, y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150 - 40, t: 0, life: 0.7, rot: k });
    }
  },
  moveEnemy(L, e, v, dt) {
    const lane = L.lanes[e.lane] || L.lanes[0];
    const d0 = e.d, d1 = d0 + v * dt;
    const hits = [];
    for (const b of L.beams) { const c = b.cross[lane.id]; if (c !== undefined && c > d0 && c <= d1) hits.push({ b, c }); }
    hits.sort((m, n) => m.c - n.c || m.b.id - n.b.id);
    for (const { b, c } of hits) {
      const r = Rules.apply(e, b);
      if (r.kind === "kill") {
        e.alive = false; e.outcome = "killed"; e.d = c; e.deadT = 0; e.rem = 0;
        e.killedBy = { a: b.a, b: b.b, da: b.da, db: b.db, product: b.product };
        Bus.emit("enemy_killed", { id: e.id, number: e.number, beam: { a: b.a, b: b.b, da: b.da, db: b.db, product: b.product } });
        const pt = Geo.pointAt(lane, c);
        Sim.burst(L, pt.x, pt.y);
        return;                                  // остальные лучи этого шага пропускаются
      }
      if (r.kind === "cut") {
        e.rem = r.to; e.hitLog.push({ product: b.product, from: r.from, to: r.to });
        e.cutNote = r.from + " " + MINUS + " " + b.product + " = " + r.to;
        e.note = e.cutNote; e.noteT = 0;
        Bus.emit("boss_hit", { id: e.id, from: r.from, to: r.to, product: b.product });
      } else {
        b.blinkT = 0.4;
        e.note = e.rem + ", а луч даёт " + b.product; e.noteT = 1;
        Bus.emit("enemy_passed_beam", { id: e.id, number: e.number, product: b.product, rem: e.rem });
      }
    }
    e.d = d1;
    if (e.d >= lane.len) {
      e.d = lane.len; e.alive = false; e.outcome = "castle";
      L.hearts = Math.max(0, L.hearts - 1);
      Bus.emit("enemy_reached_castle", { id: e.id, number: e.number, hearts: L.hearts });
    }
  },
  step(dt) {
    const L = Game.level;
    if (!L) return;
    if (L.phase === "waveEnd") {                 // плашка «Волна отбита» ждёт 2 с и ведёт в следующую подготовку
      if (L.plaqueT > 0) { L.plaqueT -= dt; if (L.plaqueT <= 0) Game.nextWave(); }
      return;
    }
    if (L.phase !== "battle") return;
    L.simT += dt;
    const v = Sim.speed();
    if (L.queue.length) {                        // (1) появление
      L.spawnT -= dt;
      if (L.spawnT <= 0) { const e = Sim.spawn(L); L.spawnT += (e.armored ? GAP_BOSS : GAP) / v; }
    }
    for (const e of L.enemies) if (e.alive) Sim.moveEnemy(L, e, v, dt);   // (2) движение, лучи, крепость
    for (const e of L.enemies) {                 // (3) таймеры
      if (!e.alive) e.deadT += dt;
      if (e.noteT > 0) { e.noteT -= dt; if (e.noteT <= 0) { e.noteT = 0; e.note = e.cutNote; } }
    }
    for (const b of L.beams) if (b.blinkT > 0) b.blinkT = Math.max(0, b.blinkT - dt);
    for (const f of L.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; }
    L.fx = L.fx.filter((f) => f.t < f.life);
    if (!L.queue.length && !L.enemies.some((e) => e.alive)) Game.endWave();   // (4) конец волны
  },
};

/* ---------- 13 Game: фазы prep → battle ⇄ paused → waveEnd → (prep | levelEnd) ---------- */
const Game = {
  level: null, screen: "title", manual: false, seed: 1, waveCounter: 0,
  settings: { speed: "slow", perDay: 5, sound: true, big: false },
  startLevel(land, idx) {
    Game.level = Level.create(land, idx, "T1"); // этап 2 выбирает шаблон по номеру уровня
    Game.screen = "game";
    Game.startPrep();
    return { ok: true };
  },
  toTitle() { Game.level = null; Game.screen = "title"; },
  newWave() {
    const L = Game.level;
    return WaveGen.make({ land: L.land, idx: L.idx, waveIdx: L.waveIdx, level: L, seed: Game.seed + Game.waveCounter, rng: Util.rng(Game.seed + Game.waveCounter++) });
  },
  startPrep() {                                  // подготовка: симуляция стоит, таймера нет
    const L = Game.level;
    L.phase = "prep";
    L.prep = { startMs: Clock.nowMs(), lastBuildMs: Clock.nowMs(), pairEdits: {}, covered: {} };
    Game.loadWave(Game.newWave());
  },
  loadWave(wave) {                               // подменяет волну текущей подготовки (OT.setWave тоже)
    const L = Game.level;
    L.wave = wave;
    L.queue = wave.enemies.map((e, i) => Object.assign({ ord: i }, e));
    L.enemies = []; L.fx = []; L.spawnT = 0;
    for (const p of L.pads) if (p.fixed) { p.fixed = false; delete L.towers[p.id]; }   // старые заранее стоящие башни уходят
    for (const b of L.beams.slice()) if (!L.towers[b.a] || !L.towers[b.b]) Build._dropBeam(L, b);
    for (const id of Object.keys(wave.fixed || {})) {
      const pad = Level.pad(L, id);
      if (!pad) continue;
      pad.fixed = true;
      L.towers[id] = { pad: id, digit: wave.fixed[id], fixed: true, skin: "base" };
      Build._refresh(L, id);
    }
  },
  startWave() {                                  // кнопка «В бой!»
    const L = Game.level;
    if (!L || L.phase !== "prep") return Build.fail("phase");
    L.phase = "battle"; L.spawnT = 0;
    Bus.emit("wave_start", { waveIdx: L.waveIdx, numbers: L.wave.enemies.map((e) => e.number) });
    return { ok: true };
  },
  pause() { const L = Game.level; if (!L || L.phase !== "battle") return Build.fail("phase"); L.phase = "paused"; return { ok: true }; },
  resume() { const L = Game.level; if (!L || L.phase !== "paused") return Build.fail("phase"); L.phase = "battle"; return { ok: true }; },
  endWave() {                                    // зовёт Sim, когда очередь пуста и живых нет
    const L = Game.level;
    const killed = L.enemies.filter((e) => e.outcome === "killed").length, total = L.wave.enemies.length;
    Bus.emit("wave_end", { waveIdx: L.waveIdx, killed, total });   // ещё в бою, поэтому t — время симуляции
    L.phase = "waveEnd";
    L.results.push({ killed, total, passed: total - killed });
    Learner.onWaveEnd({ enemies: L.enemies.map((e) => ({ card: e.card, number: e.number, outcome: e.outcome, killedBy: e.killedBy || null })) });
    Game.onWaveEnd();
  },
  onWaveEnd() {
    const L = Game.level;
    if (L.waveIdx + 1 < WAVES_PER_LEVEL) L.plaqueT = 2; else Game.onLevelEnd();
  },
  nextWave() { Game.level.waveIdx++; Game.startPrep(); },
  stars(hearts) { return hearts >= 9 ? 3 : hearts >= 6 ? 2 : 1; },
  onLevelEnd() {
    const L = Game.level;
    L.phase = "levelEnd";
    Bus.emit("level_end", { land: L.land, level: L.idx, hearts: L.hearts, stars: Game.stars(L.hearts) });
  },
  again() {                                      // «Ещё раз»: сердца заново, новая волна, башни и лучи остаются
    const L = Game.level;
    L.hearts = HEARTS; L.waveIdx = 0; L.results = []; L.beams.forEach((b) => { b.blinkT = 0; });
    Game.startPrep();
  },
  ribbon() {                                     // карточки ленты в порядке выхода
    const L = Game.level;
    if (!L || !L.wave) return [];
    return L.wave.enemies.map((w, i) => {
      const e = L.enemies.find((m) => m.ord === i);
      const status = !e ? "wait" : e.alive ? "walk" : e.outcome === "killed" ? "killed" : "castle";
      return { number: w.number, armored: !!w.armored, status };
    });
  },
};

/* ---------- 14 Render: всё, что на canvas (логика 1600x900) ---------- */
// Владеет: масштабом и letterbox, фоном, дорожкой, крепостью, площадками, башнями, лучами, подписями «a × b = c», врагами.
const Render = {
  cv: null, c: null, stage: null, rotate: null, s: 1, dpr: 1, t: 0, reduced: false,
  col: {}, deco: [], shakes: {},
  last: { labels: [], notes: [], hints: [], del: null },   // что нарисовано в последнем кадре (OT.drawn, Input)
  F_NUM: '"Russo One","Nunito",system-ui,sans-serif', F_BODY: '"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  init(canvas) {
    Render.cv = canvas; Render.c = canvas.getContext("2d");
    Render.stage = document.getElementById("stage"); Render.rotate = document.getElementById("rotate");
    const cs = getComputedStyle(document.documentElement);
    const fb = { grass: "#8fcf6a", "grass-2": "#79bb57", path: "#ecd29b", "path-edge": "#c9a66b", stone: "#a7b0bb", "stone-2": "#7d8792", castle: "#d9dee5", roof: "#d65a4a",
      wood: "#a8703f", ink: "#1b2333", paper: "#fffaf0", gold: "#ffc83d", beam: "#ffd23f", "beam-core": "#fff6c8", miss: "#8e949c", hint: "#3b6fd8",
      enemy: "#8a63d2", "enemy-2": "#6c48b3", boss: "#59606d", rivet: "#c8ced6", good: "#2fa36b", bg: "#17324a" };
    for (const k of Object.keys(fb)) Render.col[k] = cs.getPropertyValue("--" + k).trim() || fb[k];
    try { Render.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { Render.reduced = false; }
    // Украшения травы — раз и навсегда, без Math.random.
    const r = Util.rng(7), pads = Content.TEMPLATES.T1.pads;
    for (let i = 0; i < 120; i++) {
      const x = r.int(10, 1590), y = r.int(125, 775), kind = r.next() < 0.78 ? 0 : 1 + r.int(0, 2);
      if (Math.abs(y - 450) < 85 && x < 1500) continue;
      if (x > 1380 && y > 200 && y < 700) continue;
      if (pads.some((p) => Util.dist(x, y, p.x, p.y) < 85)) continue;
      Render.deco.push({ x, y, kind, s: 0.8 + r.next() * 0.6 });
    }
    Render.resize();
  },
  resize() {
    const iw = window.innerWidth, ih = window.innerHeight;
    const s = Math.min(iw / W, ih / H);
    Render.s = s; Render.dpr = Math.min(window.devicePixelRatio || 1, 2); Build.scale = s;
    Render.stage.style.transform = "translate(" + ((iw - W * s) / 2) + "px," + ((ih - H * s) / 2) + "px) scale(" + s + ")";
    Render.cv.width = Math.round(W * s * Render.dpr); Render.cv.height = Math.round(H * s * Render.dpr);
    const portrait = iw < ih;
    Render.rotate.hidden = !portrait;
    if (portrait) Game.pause();                  // волна на паузу, пока планшет стоит вертикально
    Render.draw();
  },
  tick(dt) { Render.t += dt; },
  shake(padId) { if (!Render.reduced) Render.shakes[padId] = Render.t + 0.5; },

  // --- мелочи рисования ---
  rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); },
  circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); },
  txt(c, s, x, y, size, fill, stroke, lw, num) {
    c.font = (num ? "400 " : "800 ") + size + "px " + (num ? Render.F_NUM : Render.F_BODY);
    c.textAlign = "center"; c.textBaseline = "middle"; c.lineJoin = "round";
    if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
    c.fillStyle = fill; c.fillText(s, x, y);
  },
  star(c, x, y, r, rot) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + (i * Math.PI) / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath();
  },

  // --- фон ---
  ground(c) {
    const k = Render.col;
    c.fillStyle = k.grass; c.fillRect(0, 0, W, H);
    c.globalAlpha = 0.28; c.fillStyle = k["grass-2"];
    for (let x = 0; x < W; x += 220) c.fillRect(x, 0, 110, H);
    c.globalAlpha = 1;
    for (const d of Render.deco) {
      c.save(); c.translate(d.x, d.y); c.scale(d.s, d.s);
      if (d.kind === 0) {                        // кустик
        c.strokeStyle = k["grass-2"]; c.lineWidth = 4; c.lineCap = "round";
        c.beginPath(); c.moveTo(-9, 0); c.lineTo(-12, -13); c.moveTo(0, 0); c.lineTo(0, -17); c.moveTo(9, 0); c.lineTo(12, -13); c.stroke();
      } else {                                   // цветок
        c.fillStyle = ["#fff", "#ffb3c7", "#fff3a3"][d.kind - 1];
        for (let i = 0; i < 5; i++) { Render.circ(c, Math.cos(i * 1.2566) * 7, Math.sin(i * 1.2566) * 7, 5); c.fill(); }
        c.fillStyle = "#f2a31b"; Render.circ(c, 0, 0, 4); c.fill();
      }
      c.restore();
    }
  },
  lanes(c, L) {
    const k = Render.col;
    for (const lane of L.lanes) {
      const pts = lane.points.map((p) => p.slice()), n = pts.length;
      const dx = pts[n - 1][0] - pts[n - 2][0], dy = pts[n - 1][1] - pts[n - 2][1], dl = Math.hypot(dx, dy) || 1;
      pts.push([pts[n - 1][0] + (dx / dl) * 36, pts[n - 1][1] + (dy / dl) * 36]);   // дорога доходит до стены
      c.lineJoin = "round"; c.lineCap = "butt";
      for (const [col, w] of [[k["path-edge"], 124], [k.path, 108]]) {
        c.strokeStyle = col; c.lineWidth = w; c.beginPath();
        pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
        c.stroke();
      }
      c.fillStyle = k["path-edge"]; c.globalAlpha = 0.55;   // камешки
      for (let i = 0, d = 30; d < lane.len; i++, d += 64) {
        const p = Geo.pointAt(lane, d), off = ((i * 37) % 70) - 35;
        c.beginPath(); c.ellipse(p.x, p.y + off, 6 + (i % 3) * 2, 4 + (i % 2) * 2, 0, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
    }
  },
  castle(c) {
    const k = Render.col;
    c.lineJoin = "round";
    // стена с воротами: сюда доходит дорога
    c.fillStyle = k.castle; c.strokeStyle = k.ink; c.lineWidth = 5;
    Render.rr(c, 1432, 340, 156, 220, 14); c.fill(); c.stroke();
    c.strokeStyle = "rgba(27,35,51,.18)"; c.lineWidth = 3;
    for (let y = 372; y < 550; y += 34) { c.beginPath(); c.moveTo(1440, y); c.lineTo(1580, y); c.stroke(); }
    c.fillStyle = "#3a2a1c"; c.strokeStyle = k.ink; c.lineWidth = 5;
    c.beginPath(); c.moveTo(1432, 505); c.lineTo(1432, 440); c.arc(1472, 440, 40, Math.PI, 0); c.lineTo(1512, 505); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = k.wood; c.lineWidth = 6;
    for (const x of [1452, 1472, 1492]) { c.beginPath(); c.moveTo(x, 410); c.lineTo(x, 503); c.stroke(); }
    // две башенки с красными крышами на правых углах стены
    for (const ty of [346, 554]) {
      const up = ty < 450 ? -1 : 1;              // верхняя крыша смотрит вверх, нижняя — вниз
      c.fillStyle = "#c4ccd6"; c.strokeStyle = k.ink; c.lineWidth = 5;
      Render.circ(c, 1540, ty, 42); c.fill(); c.stroke();
      c.fillStyle = k.roof; c.beginPath(); c.moveTo(1494, ty + up * 6); c.lineTo(1540, ty + up * 84); c.lineTo(1586, ty + up * 6); c.closePath(); c.fill(); c.stroke();
    }
    // флаг на верхней крыше
    c.strokeStyle = k.ink; c.lineWidth = 5; c.beginPath(); c.moveTo(1540, 262); c.lineTo(1540, 214); c.stroke();
    c.fillStyle = k.gold; c.beginPath(); c.moveTo(1542, 216); c.lineTo(1582, 228); c.lineTo(1542, 242); c.closePath(); c.fill(); c.stroke();
  },
  pads(c, L) {
    const k = Render.col, sel = Input.sel && L.towers[Input.sel] ? Input.sel : null;
    for (const p of L.pads) {
      const g = c.createRadialGradient(p.x - 12, p.y - 14, 6, p.x, p.y, PAD_R);
      if (p.fixed) { g.addColorStop(0, "#69727d"); g.addColorStop(1, "#3f464f"); } else { g.addColorStop(0, "#c6ccd4"); g.addColorStop(1, k["stone-2"]); }
      c.fillStyle = g; c.strokeStyle = k.ink; c.lineWidth = 5;
      Render.circ(c, p.x, p.y, PAD_R); c.fill(); c.stroke();
      c.strokeStyle = "rgba(255,255,255,.4)"; c.lineWidth = 3; Render.circ(c, p.x, p.y, PAD_R - 10); c.stroke();
      if (p.fixed && !L.towers[p.id]) { /* пустой замок не бывает */ }
      if (sel && L.adj[sel].includes(p.id)) {    // соседи выбранной башни
        c.save(); c.setLineDash([14, 10]); c.strokeStyle = k.gold; c.lineWidth = 6; Render.circ(c, p.x, p.y, PAD_R + 12); c.stroke(); c.restore();
      }
    }
  },
  tower(c, x, y, digit, o) {
    const k = Render.col; o = o || {};
    c.save(); c.globalAlpha = o.alpha === undefined ? 1 : o.alpha; c.translate(x, y); if (o.scale) c.scale(o.scale, o.scale);
    c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(0, 8, 48, 40, 0, 0, Math.PI * 2); c.fill();
    c.lineJoin = "round"; c.strokeStyle = k.ink; c.fillStyle = k["stone-2"]; c.lineWidth = 3;
    for (let i = 0; i < 10; i++) { c.save(); c.rotate((i * Math.PI) / 5); Render.rr(c, -8, -53, 16, 14, 3); c.fill(); c.stroke(); c.restore(); }
    c.lineWidth = 4; c.fillStyle = k.stone; Render.circ(c, 0, 0, 43); c.fill(); c.stroke();
    const g = c.createRadialGradient(-10, -12, 4, 0, 0, 34);
    g.addColorStop(0, "#c9915a"); g.addColorStop(1, k.wood);
    c.fillStyle = g; Render.circ(c, 0, 0, 34); c.fill(); c.stroke();
    c.strokeStyle = "rgba(27,35,51,.28)"; c.lineWidth = 3;
    for (const yy of [-14, 14]) { c.beginPath(); c.moveTo(-Math.sqrt(34 * 34 - yy * yy) + 3, yy); c.lineTo(Math.sqrt(34 * 34 - yy * yy) - 3, yy); c.stroke(); }
    Render.txt(c, String(digit), 0, 3, 56, "#fff", k.ink, 6, true);
    c.restore();
  },
  towers(c, L) {
    const k = Render.col, dragFrom = Input.drag && Input.drag.kind === "tower" ? Input.drag.from : null;
    for (const p of L.pads) {
      const t = L.towers[p.id];
      if (!t) continue;
      let dx = 0; const u = Render.shakes[p.id];
      if (u && u > Render.t) dx = Math.sin((u - Render.t) * 28) * 7 * ((u - Render.t) / 0.5);
      Render.tower(c, p.x + dx, p.y, t.digit, { alpha: dragFrom === p.id ? 0.3 : 1 });
      if (t.fixed) {                             // замочек
        c.fillStyle = k.gold; c.strokeStyle = k.ink; c.lineWidth = 3;
        Render.rr(c, p.x + 22, p.y + 18, 24, 20, 5); c.fill(); c.stroke();
        c.beginPath(); c.arc(p.x + 34, p.y + 18, 8, Math.PI, 0); c.stroke();
      }
      if (Input.sel === p.id) {                  // выбранная — золотое кольцо
        c.strokeStyle = k.gold; c.lineWidth = 8; Render.circ(c, p.x, p.y, PAD_R + 12); c.stroke();
      }
    }
  },
  crossPoint(L, b) {                             // где луч пересекает ось дорожки
    const pa = Level.pad(L, b.a), pb = Level.pad(L, b.b);
    for (const ln of L.lanes) { const h = Geo.cross(ln, [pa.x, pa.y], [pb.x, pb.y]); if (h) return h; }
    return { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 };
  },
  beams(c, L) {
    const k = Render.col;
    for (const b of L.beams) {
      const pa = Level.pad(L, b.a), pb = Level.pad(L, b.b), gray = b.blinkT > 0;
      c.lineCap = "round";
      c.strokeStyle = gray ? k.miss : k.beam; c.lineWidth = 10;
      c.beginPath(); c.moveTo(pa.x, pa.y); c.lineTo(pb.x, pb.y); c.stroke();
      c.save(); c.setLineDash([18, 18]); c.lineDashOffset = Render.reduced ? 0 : -Render.t * 18;   // 0,5 периода в секунду
      c.strokeStyle = gray ? "#d0d4d9" : k["beam-core"]; c.lineWidth = 4;
      c.beginPath(); c.moveTo(pa.x, pa.y); c.lineTo(pb.x, pb.y); c.stroke(); c.restore();
      const cp = Render.crossPoint(L, b);        // кольцо там, где луч режет дорогу
      c.strokeStyle = gray ? k.miss : k.beam; c.lineWidth = 5; Render.circ(c, cp.x, cp.y, 14); c.stroke();
    }
  },
  enemy(c, L, e, last) {
    const k = Render.col, lane = L.lanes[e.lane] || L.lanes[0], pt = Geo.pointAt(lane, e.d);
    let sc = 1;
    if (!e.alive) { if (e.outcome !== "killed" || e.deadT >= 0.3) return; sc = 1 - e.deadT / 0.3; }
    const R = e.armored ? 40 : 30, bob = Render.reduced ? 0 : Math.sin(L.simT * 5 + e.id * 1.3) * 3;
    c.save(); c.translate(pt.x, pt.y + bob); c.scale(sc, sc); c.lineJoin = "round";
    c.fillStyle = "rgba(0,0,0,.2)"; c.beginPath(); c.ellipse(0, R - 2, R * 0.9, 9, 0, 0, Math.PI * 2); c.fill();
    if (!e.armored) {
      for (const pass of [0, 1]) {               // пушистая клякса: сначала обводка, потом заливка
        c.fillStyle = pass ? k.enemy : k.ink;
        const grow = pass ? 0 : 3.5;
        Render.circ(c, 0, 0, R - 2 + grow); c.fill();
        for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; Render.circ(c, Math.cos(a) * (R - 4), Math.sin(a) * (R - 4), 7 + grow); c.fill(); }
      }
      const g = c.createRadialGradient(-8, -10, 4, 0, 0, R); g.addColorStop(0, "rgba(255,255,255,.22)"); g.addColorStop(1, "rgba(0,0,0,.18)");
      c.fillStyle = g; Render.circ(c, 0, 0, R - 2); c.fill();
      c.fillStyle = "#fff"; c.strokeStyle = k.ink; c.lineWidth = 3;
      for (const ex of [-10, 9]) { Render.circ(c, ex, -13, 7.5); c.fill(); c.stroke(); c.fillStyle = k.ink; Render.circ(c, ex + 2.5, -12, 3.6); c.fill(); c.fillStyle = "#fff"; }
      c.strokeStyle = k.ink; c.lineWidth = 3; c.beginPath(); c.arc(-1, -3, 6, 0.2, Math.PI - 0.2); c.stroke();
      c.fillStyle = "#fff"; c.strokeStyle = k.ink; c.lineWidth = 4;          // круглый щит
      Render.circ(c, 6, 14, 27); c.fill(); c.stroke();
      c.strokeStyle = k["enemy-2"]; c.lineWidth = 3; Render.circ(c, 6, 14, 22); c.stroke();
      Render.txt(c, String(e.rem), 6, 15, 34, k.ink, null, 0, true);
    } else {
      c.fillStyle = k.boss; c.strokeStyle = k.ink; c.lineWidth = 5;           // железный: шлем и квадратный клёпаный щит
      Render.circ(c, 0, 0, R - 2); c.fill(); c.stroke();
      c.fillStyle = "#3d434e"; c.beginPath(); c.arc(0, -4, R - 1, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = k.roof; Render.rr(c, -5, -R - 12, 10, 18, 3); c.fill(); c.stroke();
      c.fillStyle = "#ffd23f"; for (const ex of [-12, 12]) { Render.circ(c, ex, 6, 5.5); c.fill(); }
      c.fillStyle = "#e8ecf1"; c.strokeStyle = k.ink; c.lineWidth = 4;
      Render.rr(c, -26, 8, 64, 58, 10); c.fill(); c.stroke();
      c.fillStyle = k.rivet; c.lineWidth = 2.5;
      for (const [rx, ry] of [[-18, 16], [30, 16], [-18, 58], [30, 58]]) { Render.circ(c, rx + 0, ry, 4.2); c.fill(); c.stroke(); }
      Render.txt(c, String(e.rem), 6, 38, 38, k.ink, null, 0, true);
    }
    c.restore();
    if (e.alive && e.note) {                     // «56, а луч даёт 42» уходит вверх; «56 − 35 = 21» висит
      const sticky = e.noteT <= 0, rise = sticky ? 0 : 20 * (1 - e.noteT);
      const y = Math.max(128, pt.y - R - (sticky ? 52 : 26) - rise);
      c.font = "800 30px " + Render.F_BODY;
      const w = c.measureText(e.note).width + 30, x = Util.clamp(pt.x, w / 2 + 8, W - w / 2 - 8);
      if (sticky) {
        c.fillStyle = k.paper; c.strokeStyle = k.ink; c.lineWidth = 4;
        Render.rr(c, x - w / 2, y - 22, w, 44, 12); c.fill(); c.stroke();
        Render.txt(c, e.note, x, y + 1, 30, k.ink, null, 0, false);
      } else {
        Render.txt(c, e.note, x, y, 30, "#fff", k.ink, 7, false);
      }
      last.notes.push({ enemyId: e.id, text: e.note });
    }
  },
  enemies(c, L, last) {
    const list = L.enemies.slice().sort((a, b) => a.d - b.d);
    for (const e of list) Render.enemy(c, L, e, last);
  },
  fx(c, L) {
    for (const f of L.fx) {
      c.globalAlpha = Math.max(0, 1 - f.t / f.life);
      c.fillStyle = Render.col.gold; c.strokeStyle = Render.col.ink; c.lineWidth = 3;
      Render.star(c, f.x, f.y, 13, f.rot + f.t * 4); c.fill(); c.stroke();
    }
    c.globalAlpha = 1;
  },

  // --- подписи «a × b = c» ---
  // Точка — на луче в 95 лп от оси дороги к верхнему концу; если занято, к нижнему; затем сдвиг наружу по лучу шагами по 20 лп (до 3).
  // Если и так не вышло, перебираем ещё несколько расстояний (60…200), и только потом ставим «как есть».
  labels(c, L, last) {
    const k = Render.col, placed = [];
    const hit = (a, b) => a.x < b.x + b.w + 6 && b.x < a.x + a.w + 6 && a.y < b.y + b.h + 6 && b.y < a.y + a.h + 6;
    c.font = "400 34px " + Render.F_NUM;
    for (const b of L.beams.slice().sort((m, n) => m.id - n.id)) {
      const pa = Level.pad(L, b.a), pb = Level.pad(L, b.b), C = Render.crossPoint(L, b);
      const top = pa.y <= pb.y ? pa : pb, bot = top === pa ? pb : pa;
      const ut = [top.x - C.x, top.y - C.y], ub = [bot.x - C.x, bot.y - C.y];
      const lt = Math.hypot(ut[0], ut[1]) || 1, lb = Math.hypot(ub[0], ub[1]) || 1;
      const w = Math.ceil(c.measureText(b.label).width) + 30, h = 54;
      const at = (u, l, dist) => ({ x: Util.clamp(C.x + (u[0] / l) * dist - w / 2, 8, W - 8 - w), y: Util.clamp(C.y + (u[1] / l) * dist - h / 2, FIELD_TOP + 8, FIELD_BOTTOM - 8 - h), w, h });
      const cands = [];
      for (let i = 0; i <= 3; i++) { cands.push(at(ut, lt, 95 + 20 * i)); cands.push(at(ub, lb, 95 + 20 * i)); }
      for (const dd of [75, 60, 115 + 60, 200]) { cands.push(at(ut, lt, dd)); cands.push(at(ub, lb, dd)); }
      const r = cands.find((q) => !placed.some((o) => hit(q, o))) || cands[0];
      placed.push(r);
      last.labels.push({ beamId: b.id, text: b.label, x: r.x, y: r.y, w: r.w, h: r.h });
    }
    for (const r of last.labels) {
      c.fillStyle = k.paper; c.strokeStyle = k.gold; c.lineWidth = 5;
      Render.rr(c, r.x, r.y, r.w, r.h, 14); c.fill(); c.stroke();
      Render.txt(c, r.text, r.x + r.w / 2, r.y + r.h / 2 + 2, 34, k.ink, null, 0, true);
    }
    const d = Input.delBeam;                     // «✕» рядом с подписью, 3 секунды после касания
    if (d && Render.t < d.until) {
      const lab = last.labels.find((l) => l.beamId === d.id);
      if (lab) {
        const x = lab.x + lab.w + 44 > W - 10 ? lab.x - 44 : lab.x + lab.w + 44, y = lab.y + lab.h / 2;
        c.fillStyle = "#e8445a"; c.strokeStyle = k.ink; c.lineWidth = 5; Render.circ(c, x, y, 38); c.fill(); c.stroke();
        c.strokeStyle = "#fff"; c.lineWidth = 8; c.lineCap = "round";
        c.beginPath(); c.moveTo(x - 13, y - 13); c.lineTo(x + 13, y + 13); c.moveTo(x + 13, y - 13); c.lineTo(x - 13, y + 13); c.stroke();
        last.del = { beamId: d.id, x, y, r: 38 };
      }
    } else if (d) Input.delBeam = null;
  },
  drag(c) {                                      // призрак перетаскиваемой цифры и подсветка площадки, которая её поймает
    const d = Input.drag;
    if (!d || !d.moved) return;
    const pad = Build.padAt(d.x, d.y);
    if (pad) { c.strokeStyle = Render.col.gold; c.lineWidth = 8; Render.circ(c, pad.x, pad.y, PAD_R + 12); c.stroke(); }
    Render.tower(c, d.x, d.y - 10, d.digit, { alpha: 0.82, scale: 1.1 });
  },
  draw() {
    const c = Render.c;
    if (!c) return;
    const k = Render.s * Render.dpr, L = Game.level;
    c.setTransform(k, 0, 0, k, 0, 0); c.clearRect(0, 0, W, H);
    const last = { labels: [], notes: [], hints: [], del: null };
    Render.ground(c);
    if (L && Game.screen === "game") {
      Render.lanes(c, L); Render.castle(c); Render.pads(c, L); Render.beams(c, L); Render.towers(c, L);
      Render.enemies(c, L, last); Render.fx(c, L); Render.labels(c, L, last); Render.drag(c);
    }
    Render.last = last;
  },
};

/* ---------- 15 Input: Pointer Events (палец, перо, мышь) ---------- */
// Владеет выбором башни, «взятой» цифрой, перетаскиванием и ✕ у подписи. В бою касание руки или площадки само ставит паузу.
const Input = {
  sel: null,        // выбранная башня (id площадки)
  armed: null,      // цифра, нажатая в руке (тап по цифре, потом тап по площадке)
  drag: null,       // { kind:'digit'|'tower', digit, from, x, y, sx, sy, moved, pid }
  down: null,       // нажатие на башню на поле, ещё не понятно: тап это или перетаскивание
  delBeam: null,    // { id, until } — у подписи показан ✕
  reset() { Input.sel = null; Input.armed = null; Input.drag = null; Input.down = null; Input.delBeam = null; },
  pt(e) {
    const r = Render.cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
  },
  thr() { return 12 / Build.scale; },            // порог «это уже перетаскивание»: 12 CSS px
  init() {
    Render.cv.addEventListener("pointerdown", Input.onFieldDown);
    document.getElementById("hand").addEventListener("pointerdown", Input.onHandDown);
    window.addEventListener("pointermove", Input.onMove);
    window.addEventListener("pointerup", Input.onUp);
    window.addEventListener("pointercancel", () => { Input.drag = null; Input.down = null; });
    window.addEventListener("keydown", () => Audio.unlock());
  },
  onHandDown(e) {
    Audio.unlock();
    const b = e.target.closest ? e.target.closest("[data-digit]") : null, L = Game.level;
    if (!b || !L || e.button > 0) return;
    if (L.phase === "battle") { Game.pause(); UI.sync(); }   // строить на бегу нельзя: сначала пауза
    if (!Build.editable()) return;
    const p = Input.pt(e);
    Input.sel = null; Input.delBeam = null;
    Input.drag = { kind: "digit", digit: +b.dataset.digit, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, pid: e.pointerId };
  },
  onFieldDown(e) {
    Audio.unlock();
    const L = Game.level;
    if (!L || e.button > 0) return;
    const p = Input.pt(e), near = Build.padAt(p.x, p.y);
    if (L.phase === "battle") { if (near) { Game.pause(); UI.sync(); } else return; }   // пустое поле в бою игнорируется
    if (!Build.editable()) return;
    const del = Render.last.del;
    if (del && Util.dist(p.x, p.y, del.x, del.y) <= del.r) {              // ✕: разорвать луч
      const b = L.beams.find((m) => m.id === del.beamId);
      if (b) Build.unlink(b.a, b.b);
      Input.delBeam = null;
      return;
    }
    const lab = Render.last.labels.find((l) => p.x >= l.x && p.x <= l.x + l.w && p.y >= l.y && p.y <= l.y + l.h);
    if (lab) { Input.delBeam = Input.delBeam && Input.delBeam.id === lab.beamId ? null : { id: lab.beamId, until: Render.t + 3 }; Render.draw(); return; }
    Input.delBeam = null;
    if (Input.armed !== null && near) {                                    // цифра взята, тап по площадке; взятая цифра одноразовая
      const r = Build.dropDigit(Input.armed, p.x, p.y);
      Input.armed = null;
      if (!r.ok && r.reason === "fixed") Render.shake(near.id);
      return;
    }
    if (near && L.towers[near.id]) { Input.down = { pad: near.id, sx: p.x, sy: p.y, moved: false, pid: e.pointerId }; return; }
    Input.sel = null;                                                      // тап по пустому месту снимает выбор
    Input.armed = null;
  },
  onMove(e) {
    const L = Game.level;
    if (!L) return;
    const d = Input.drag, dn = Input.down;
    if (d && d.pid === e.pointerId) {
      const p = Input.pt(e);
      d.x = p.x; d.y = p.y;
      if (!d.moved && Util.dist(p.x, p.y, d.sx, d.sy) > Input.thr()) d.moved = true;
    } else if (dn && dn.pid === e.pointerId) {
      const p = Input.pt(e);
      if (!dn.moved && Util.dist(p.x, p.y, dn.sx, dn.sy) > Input.thr()) {
        dn.moved = true;
        const t = L.towers[dn.pad];
        if (t && !t.fixed) { Input.sel = null; Input.drag = { kind: "tower", digit: t.digit, from: dn.pad, x: p.x, y: p.y, sx: dn.sx, sy: dn.sy, moved: true, pid: dn.pid }; }
        else Render.shake(dn.pad);                                         // заранее стоящую башню не сдвинуть
      }
      if (Input.drag && Input.drag.pid === dn.pid) { Input.drag.x = p.x; Input.drag.y = p.y; }
    }
  },
  onUp(e) {
    const d = Input.drag, dn = Input.down;
    if (d && d.pid === e.pointerId) {
      Input.drag = null; Input.down = null;
      if (!Build.editable()) return;
      if (d.kind === "digit") {
        if (!d.moved) Input.armed = Input.armed === d.digit ? null : d.digit;   // тап по цифре
        else Build.dropDigit(d.digit, d.x, d.y);                                // отпустили над полем
      } else {
        if (d.y > FIELD_BOTTOM) Build.remove(d.from);                           // унесли на руку — башня убрана
        else {
          const pad = Build.padAt(d.x, d.y);
          if (pad && pad.id !== d.from) { const r = Build.move(d.from, pad.id); if (!r.ok) Render.shake(pad.id); }
        }
      }
    } else if (dn && dn.pid === e.pointerId) {
      Input.down = null;
      if (!dn.moved && Build.editable()) Input.tapTower(dn.pad);
    }
  },
  // Тап по башне: первая выбирается, вторая рядом — луч или разрыв уже построенного.
  tapTower(id) {
    const L = Game.level, sel = Input.sel;
    if (!sel || !L.towers[sel]) { Input.sel = id; return; }
    if (sel === id) { Input.sel = null; return; }
    if (L.adj[sel].includes(id)) {
      if (Build.beamBetween(L, sel, id)) Build.unlink(sel, id);
      else {
        const r = Build.link(sel, id);
        if (!r.ok && r.reason === "max_beams") { Render.shake(sel); Render.shake(id); }   // третий луч не строится: башня покачивается
      }
      Input.sel = null;
    } else Input.sel = id;
  },
};

/* ---------- 16 UI: DOM поверх canvas (сердца, лента, кнопки, рука, меню паузы, плашки) ---------- */
const UI = {
  el: {}, sig: "",
  HEART: '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C3 14 1 10 1 6.5 1 3.5 3.4 1.5 6 1.5c2.4 0 4.3 1.4 6 3.8 1.7-2.4 3.6-3.8 6-3.8 2.6 0 5 2 5 5 0 3.5-2 7.5-11 14.5z"/></svg>',
  OK: '<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/><path d="M2.6 5.2l1.7 1.7 3.2-3.5" fill="none" stroke="#fff" stroke-width="1.4"/></svg>',
  TOWER: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 9V3h2v1h1V3h2v1h1V3h2v6z"/></svg>',
  init() {
    for (const id of ["hud", "hearts", "ribbon", "ribbon-cap", "wave-info", "btn-pause", "hand", "btn-fight", "pause-menu", "btn-resume", "btn-sound", "btn-title",
      "plaque", "plaque-text", "plaque-sub", "btn-again", "toast", "scr-title", "btn-play"]) UI.el[id] = document.getElementById(id);
    const el = UI.el;
    for (const d of Content.HAND) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "hd"; b.dataset.digit = String(d); b.textContent = String(d); b.setAttribute("aria-label", "Цифра " + d);
      el.hand.insertBefore(b, el["btn-fight"]);
    }
    const on = (id, fn) => el[id].addEventListener("click", () => { fn(); UI.sync(); });   // экран обновляется сразу, не ждёт кадра
    on("btn-play", () => { Audio.unlock(); Game.startLevel(1, 0); });
    on("btn-fight", () => { Input.reset(); Game.startWave(); });
    on("btn-pause", () => Game.pause());
    on("btn-resume", () => Game.resume());
    on("btn-again", () => { Input.reset(); Game.again(); });
    on("btn-title", () => { Input.reset(); Game.toTitle(); });
    on("btn-sound", () => { Game.settings.sound = !Game.settings.sound; Audio.enabled = Game.settings.sound; });
  },
  toast(text) {
    const t = UI.el.toast;
    t.textContent = text; t.hidden = false;
    clearTimeout(UI._toastT);
    UI._toastT = setTimeout(() => { t.hidden = true; }, 2500);
  },
  sync() {                                       // перерисовывает DOM только когда что-то изменилось
    const L = Game.level, el = UI.el, inGame = Game.screen === "game" && !!L;
    if (!Build.editable() && (Input.sel || Input.armed !== null || Input.drag || Input.down)) Input.reset();
    const ph = inGame ? L.phase : "none", rib = inGame ? Game.ribbon() : [];
    const last = inGame && L.results.length ? L.results[L.results.length - 1] : null;
    const sig = JSON.stringify([Game.screen, ph, inGame ? L.hearts : 0, rib, inGame ? L.waveIdx : 0, Input.armed, Game.settings.sound, last]);
    if (sig === UI.sig) return;
    UI.sig = sig;
    el["scr-title"].hidden = Game.screen !== "title";
    el.hud.hidden = !inGame;
    el.hand.hidden = !inGame || !(ph === "prep" || ph === "battle" || ph === "paused");
    el["btn-fight"].hidden = ph !== "prep";
    el["btn-pause"].hidden = ph !== "battle";
    el["pause-menu"].hidden = ph !== "paused";
    el["btn-sound"].textContent = "Звук: " + (Game.settings.sound ? "вкл" : "выкл");
    for (const b of el.hand.querySelectorAll("[data-digit]")) b.classList.toggle("armed", Input.armed === +b.dataset.digit);
    if (inGame) {
      let h = "";
      for (let i = 0; i < HEARTS; i++) h += UI.HEART.replace("<svg", i < L.hearts ? "<svg" : '<svg class="lost"');
      el.hearts.innerHTML = h;
      el.ribbon.innerHTML = rib.map((r) => '<div class="rc ' + r.status + (r.armored ? " boss" : "") + (String(r.number).length > 2 ? " l3" : "") + '">' + r.number +
        (r.status === "killed" ? UI.OK : r.status === "castle" ? UI.TOWER : "") + "</div>").join("");
      el["wave-info"].textContent = "Волна " + (L.waveIdx + 1) + "/" + WAVES_PER_LEVEL;
    }
    const over = ph === "waveEnd" || ph === "levelEnd";
    el.plaque.hidden = !over;
    if (over && last) {
      el["plaque-text"].textContent = ph === "levelEnd" ? "Отбито " + last.killed + " из " + last.total : "Волна " + (L.waveIdx + 1) + " отбита!";
      el["plaque-sub"].textContent = "Сердец: " + L.hearts + " из " + HEARTS;
      el["btn-again"].hidden = ph !== "levelEnd";
    }
  },
};

/* ---------- 17 Audio: заглушка (этап 2: WebAudio-блипы из раздела 11) ---------- */
const Audio = {
  enabled: true, ctx: null,
  unlock() {},                                   // этап 2 создаёт AudioContext только здесь, по первому жесту
  play() {},
  state() { return "none"; },
};

/* ---------- 18 Debug: window.OT (раздел 13 чертежа) ---------- */
const Debug = {
  state() {
    const L = Game.level;
    return Util.clone({
      screen: Game.screen, phase: L ? L.phase : null, land: L ? L.land : null, level: L ? L.idx : null, waveIdx: L ? L.waveIdx : null,
      hearts: L ? L.hearts : HEARTS, hand: Content.HAND, scale: Build.scale,
      pads: L ? L.pads.map((p) => ({ id: p.id, x: p.x, y: p.y, lane: p.lane, side: p.side, digit: L.towers[p.id] ? L.towers[p.id].digit : null, fixed: !!(L.towers[p.id] && L.towers[p.id].fixed) })) : [],
      adj: L ? L.adj : {},
      beams: L ? L.beams.map((b) => ({ id: b.id, a: b.a, b: b.b, da: b.da, db: b.db, product: b.product, label: b.label, cross: b.cross, born: b.born, rebuilds: b.rebuilds, blink: b.blinkT > 0 })) : [],
      enemies: L ? L.enemies.map((e) => ({ id: e.id, number: e.number, rem: e.rem, armored: e.armored, lane: e.lane, d: e.d, alive: e.alive, outcome: e.outcome, note: e.note })) : [],
      ribbon: Game.ribbon(), hints: [], settings: Game.settings, day: { started: L ? 1 : 0, done: 0 }, diff: { hard: 0, easy: false }, unlocked: [1], stars: {}, cards: {}, conf: {},
    });
  },
  fail: (reason) => ({ ok: false, reason }),
  make() {
    const redraw = () => { Render.draw(); UI.sync(); };
    const wrap = (fn) => (...a) => { const r = fn(...a); redraw(); return r; };   // после каждой мутации кадр свежий
    return {
      state: Debug.state,
      manual: (on) => { Game.manual = on !== false; return Game.manual; },
      seed: (n) => { Game.seed = n; Game.waveCounter = 0; return n; },
      newGame: () => { Input.reset(); Game.toTitle(); Game.waveCounter = 0; Bus.clear(); Render.shakes = {}; redraw(); return Debug.state(); },
      loadLevel: wrap((land, idx) => Game.startLevel(land, idx)),
      setWave: wrap((numbers, o) => {
        const L = Game.level; o = o || {};
        if (!L || L.phase !== "prep") return Debug.fail("phase");
        const armored = o.armored || [];
        Game.loadWave({ idx: L.waveIdx, easy: false, seed: Game.seed, fixed: o.fixed || {}, hints: [],
          enemies: numbers.map((n, i) => ({ number: n, card: Content.cardForNumber(n), armored: armored.includes(n), lane: o.lanes ? o.lanes[i] : i % L.lanes.length })) });
        return { ok: true };
      }),
      placeTower: wrap((pad, digit) => Build.place(pad, digit)),
      removeTower: wrap((pad) => Build.remove(pad)),
      moveTower: wrap((from, to) => Build.move(from, to)),
      link: wrap((a, b) => Build.link(a, b)),
      unlink: wrap((a, b) => Build.unlink(a, b)),
      dropDigit: wrap((digit, x, y) => Build.dropDigit(digit, x, y)),
      startWave: wrap(() => Game.startWave()),
      step(sec) {
        const n = Math.round(sec * 60);
        for (let i = 0; i < n; i++) Sim.step(DT);
        Render.tick(sec); redraw();
        return Debug.state();
      },
      runWave(maxSec) {
        const L = Game.level, limit = Math.round((maxSec || 300) * 60);
        for (let i = 0; L && i < limit && L.phase !== "waveEnd" && L.phase !== "levelEnd"; i++) {
          Sim.step(DT);
          if (i % 6 === 0) Render.tick(0.1);
        }
        redraw();
        return Debug.state();
      },
      pause: wrap(() => Game.pause()),
      resume: wrap(() => Game.resume()),
      setSetting: (name, value) => { if (name in Game.settings) Game.settings[name] = value; if (name === "sound") Audio.enabled = !!value; return Game.settings; },
      events: (o) => { const r = Bus.log.slice(); if (o && o.clear) Bus.clear(); return r; },
      drawn: () => { Render.draw(); return Util.clone({ labels: Render.last.labels, notes: Render.last.notes, hints: Render.last.hints }); },
      toScreen: (x, y) => { const r = Render.cv.getBoundingClientRect(); return { x: r.left + (x * r.width) / W, y: r.top + (y * r.height) / H }; },
      show: (name) => { if (name === "title") { Game.toTitle(); redraw(); } return Game.screen; },
      audioState: () => Audio.state(),
    };
  },
};

/* ---------- 19 boot ---------- */
Render.init(document.getElementById("field"));
UI.init();
Input.init();
window.addEventListener("resize", Render.resize);
window.addEventListener("orientationchange", Render.resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) Game.pause(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Render.draw());
let lastTs = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastTs) / 1000);
  lastTs = now;
  if (!Game.manual) {
    acc += dt;
    for (let n = 0; acc >= DT && n < 6; n++) { Sim.step(DT); acc -= DT; }
  } else acc = 0;
  Render.tick(dt); Render.draw(); UI.sync();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.OT = Debug.make();
UI.sync();
})();
</script>
