      Render.txt(c, r.text, r.x + r.w / 2, r.y + r.h / 2 + 2, 34, k.ink, null, 0, true);
    }
    const d = Input.delBeam;                     // «✕» рядом с подписью, 3 секунды после касания
    if (d && Render.t < d.until) {
      const lab = last.labels.find((l) => l.beamId === d.id);
      if (lab) {
        const x = lab.x + lab.w + 44 > W - 10 ? lab.x - 44 : lab.x + lab.w + 44, y = lab.y + lab.h / 2;
        c.fillStyle = "#e8445a"; c.strokeStyle = k.ink; c.lineWidth = 5; Render.circ(c, x, y, 38); c.fill(); c.stroke();
        c.strokeStyle = "#fff"; c.lineWidth = 8; c.lineCap = "round";
        c.beginPath(); c.moveTo(x - 13, y - 13); c.lineTo(x + 13, y + 13); c.moveTo(x + 13, y - 13); c.lineTo(x - 13, y + 13); c.stroke();
        last.del = { beamId: d.id, x, y, r: 38 };
      }
    } else if (d) Input.delBeam = null;
  },
  drag(c) {                                      // призрак перетаскиваемой цифры и подсветка площадки, которая её поймает
    const d = Input.drag;
    if (!d || !d.moved) return;
    const pad = Build.padAt(d.x, d.y);
    if (pad) { c.strokeStyle = Render.col.gold; c.lineWidth = 8; Render.circ(c, pad.x, pad.y, PAD_R + 12); c.stroke(); }
    Render.tower(c, d.x, d.y - 10, d.digit, { alpha: 0.82, scale: 1.1 });
  },
  draw() {
    const c = Render.c;
    if (!c) return;
    const k = Render.s * Render.dpr, L = Game.level;
    c.setTransform(k, 0, 0, k, 0, 0); c.clearRect(0, 0, W, H);
    const last = { labels: [], notes: [], hints: [], del: null };
    if (Render.decoFor !== (L ? L.template : null)) Render.makeDeco(L);
    Render.ground(c);
    if (L && Game.screen === "game") {
      Render.labels(c, L, last);                 // сначала раскладка подписей: надписи над врагами её обходят
      Render.lanes(c, L); Render.castle(c); Render.pads(c, L); Render.hintPaths(c, L, last); Render.beams(c, L); Render.towers(c, L);
      Render.enemies(c, L, last); Render.fx(c, L); Render.drawLabels(c, last); Render.drag(c);
    }
    Render.last = last;
  },
};

/* ---------- 15 Input: Pointer Events (палец, перо, мышь) ---------- */
// Владеет выбором башни, «взятой» цифрой, перетаскиванием и ✕ у подписи. В бою касание руки или площадки само ставит паузу.
const Input = {
  sel: null,        // выбранная башня (id площадки)
  armed: null,      // цифра, нажатая в руке (тап по цифре, потом тап по площадке)
  drag: null,       // { kind:'digit'|'tower', digit, from, x, y, sx, sy, moved, pid }
  down: null,       // нажатие на башню на поле, ещё не понятно: тап это или перетаскивание
  delBeam: null,    // { id, until } — у подписи показан ✕
  reset() { Input.sel = null; Input.armed = null; Input.drag = null; Input.down = null; Input.delBeam = null; },
  pt(e) {
    const r = Render.cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
  },
  thr() { return 12 / Build.scale; },            // порог «это уже перетаскивание»: 12 CSS px
  init() {
    Render.cv.addEventListener("pointerdown", Input.onFieldDown);
    document.getElementById("hand").addEventListener("pointerdown", Input.onHandDown);
    window.addEventListener("pointermove", Input.onMove);
    window.addEventListener("pointerup", Input.onUp);
    window.addEventListener("pointercancel", () => { Input.drag = null; Input.down = null; });
    window.addEventListener("keydown", () => Audio.unlock());
    // Долгое касание пером в Windows — это правый клик: контекстное меню браузера сорвало бы перетаскивание.
    document.getElementById("app").addEventListener("contextmenu", (e) => e.preventDefault());
  },
  onHandDown(e) {
    Audio.unlock();
    const b = e.target.closest ? e.target.closest("[data-digit]") : null, L = Game.level;
    if (!b || !L || e.button > 0) return;
    if (L.phase === "battle") { Game.pause(); UI.sync(); }   // строить на бегу нельзя: сначала пауза
    if (!Build.editable()) return;
    const p = Input.pt(e);
    Input.sel = null; Input.delBeam = null;
    Input.drag = { kind: "digit", digit: +b.dataset.digit, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, pid: e.pointerId };
  },
  onFieldDown(e) {
    Audio.unlock();
    const L = Game.level;
    if (!L || e.button > 0) return;
    const p = Input.pt(e), near = Build.padAt(p.x, p.y);
    if (L.phase === "battle") { if (near) { Game.pause(); UI.sync(); } else return; }   // пустое поле в бою игнорируется
    if (!Build.editable()) return;
    const del = Render.last.del;
    if (del && Util.dist(p.x, p.y, del.x, del.y) <= del.r) {              // ✕: разорвать луч
      const b = L.beams.find((m) => m.id === del.beamId);
      if (b) Build.unlink(b.a, b.b);
      Input.delBeam = null;
      return;
    }
    const lab = Render.last.labels.find((l) => p.x >= l.x && p.x <= l.x + l.w && p.y >= l.y && p.y <= l.y + l.h);
    if (lab) { Input.delBeam = Input.delBeam && Input.delBeam.id === lab.beamId ? null : { id: lab.beamId, until: Render.t + 3 }; Render.draw(); return; }
    Input.delBeam = null;
    if (Input.armed !== null && near) {                                    // цифра взята, тап по площадке; взятая цифра одноразовая
      const r = Build.dropDigit(Input.armed, p.x, p.y);
      Input.armed = null;
      if (!r.ok && r.reason === "fixed") Render.shake(near.id);
      return;
    }
    if (near && L.towers[near.id]) { Input.down = { pad: near.id, sx: p.x, sy: p.y, moved: false, pid: e.pointerId }; return; }
    Input.sel = null;                                                      // тап по пустому месту снимает выбор
    Input.armed = null;
  },
  onMove(e) {
    const L = Game.level;
    if (!L) return;
    const d = Input.drag, dn = Input.down;
    if (d && d.pid === e.pointerId) {
      const p = Input.pt(e);
      d.x = p.x; d.y = p.y;
      if (!d.moved && Util.dist(p.x, p.y, d.sx, d.sy) > Input.thr()) d.moved = true;
    } else if (dn && dn.pid === e.pointerId) {
      const p = Input.pt(e);
      if (!dn.moved && Util.dist(p.x, p.y, dn.sx, dn.sy) > Input.thr()) {
        dn.moved = true;
        const t = L.towers[dn.pad];
        if (t && !t.fixed) { Input.sel = null; Input.drag = { kind: "tower", digit: t.digit, from: dn.pad, x: p.x, y: p.y, sx: dn.sx, sy: dn.sy, moved: true, pid: dn.pid }; }
        else Render.shake(dn.pad);                                         // заранее стоящую башню не сдвинуть
      }
      if (Input.drag && Input.drag.pid === dn.pid) { Input.drag.x = p.x; Input.drag.y = p.y; }
    }
  },
  onUp(e) {
    const d = Input.drag, dn = Input.down;
    if (d && d.pid === e.pointerId) {
      Input.drag = null; Input.down = null;
      if (!Build.editable()) return;
      if (d.kind === "digit") {
        if (!d.moved) Input.armed = Input.armed === d.digit ? null : d.digit;   // тап по цифре
        else { const r = Build.dropDigit(d.digit, d.x, d.y); if (!r.ok && r.reason === "fixed") Render.shake(r.pad); }   // отпустили над полем; заранее стоящая покачивается
      } else {
        if (d.y > FIELD_BOTTOM) Build.remove(d.from);                           // унесли на руку — башня убрана
        else {
          const pad = Build.padAt(d.x, d.y);
          if (pad && pad.id !== d.from) { const r = Build.move(d.from, pad.id); if (!r.ok) Render.shake(pad.id); }
        }
      }
    } else if (dn && dn.pid === e.pointerId) {
      Input.down = null;
      if (!dn.moved && Build.editable()) Input.tapTower(dn.pad);
    }
  },
  // Тап по башне: первая выбирается, вторая рядом — луч или разрыв уже построенного.
  tapTower(id) {
    const L = Game.level, sel = Input.sel;
    if (!sel || !L.towers[sel]) { Input.sel = id; return; }
    if (sel === id) { Input.sel = null; return; }
    if (L.adj[sel].includes(id)) {
      if (Build.beamBetween(L, sel, id)) Build.unlink(sel, id);
      else {
        const r = Build.link(sel, id);
        if (!r.ok && r.reason === "max_beams") { Render.shake(sel); Render.shake(id); }   // третий луч не строится: башня покачивается
      }
      Input.sel = null;
    } else Input.sel = id;
  },
};

/* ---------- 16 UI: DOM поверх canvas (сердца, лента, кнопки, рука, меню паузы, плашки, титул, карта мира, итоги уровня) ---------- */
const UI = {
  el: {}, sig: "", handKey: "",
  HEART: '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C3 14 1 10 1 6.5 1 3.5 3.4 1.5 6 1.5c2.4 0 4.3 1.4 6 3.8 1.7-2.4 3.6-3.8 6-3.8 2.6 0 5 2 5 5 0 3.5-2 7.5-11 14.5z"/></svg>',
  OK: '<svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5"/><path d="M2.6 5.2l1.7 1.7 3.2-3.5" fill="none" stroke="#fff" stroke-width="1.4"/></svg>',
  TOWER: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 9V3h2v1h1V3h2v1h1V3h2v6z"/></svg>',
  STAR: (on, cls) => '<svg viewBox="0 0 24 23" class="' + (cls || "") + (on ? " on" : "") + '" aria-hidden="true"><path d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.5 5.6 21.1 7 14l-5.3-5 7.2-.9z"/></svg>',
  LOCK: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3h1.5a1.5 1.5 0 011.5 1.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 20.5v-9A1.5 1.5 0 015.5 10zM9 10h6V7a3 3 0 00-6 0z"/></svg>',
  init() {
    for (const id of ["hud", "hearts", "ribbon", "ribbon-cap", "wave-info", "btn-pause", "hand", "btn-fight", "pause-menu", "btn-resume", "btn-sound", "btn-to-map",
      "plaque", "plaque-text", "plaque-sub", "toast", "scr-title", "btn-play", "scr-map", "lands", "scr-level-end", "le-title", "le-stars", "le-hearts", "le-lines",
      "btn-le-next", "btn-le-map"]) UI.el[id] = document.getElementById(id);
    const el = UI.el;
    const on = (id, fn) => el[id].addEventListener("click", () => { fn(); UI.sync(); });   // экран обновляется сразу, не ждёт кадра
    on("btn-play", () => { Audio.unlock(); Game.toMap(); });
    on("btn-fight", () => { Input.reset(); Game.startWave(); });
    on("btn-pause", () => Game.pause());
    on("btn-resume", () => Game.resume());
    on("btn-to-map", () => { Input.reset(); Game.toMap(); });
    on("btn-sound", () => { Game.settings.sound = !Game.settings.sound; });
    on("btn-le-map", () => { Input.reset(); Game.toMap(); });
    on("btn-le-next", () => { const [l, i] = Game.nextLevel(Game.level.land); Input.reset(); Game.startLevel(l, i); });
    el.lands.addEventListener("click", (e) => {
      const b = e.target.closest ? e.target.closest("[data-level]") : null;
      if (!b) return;
      const [l, i] = b.dataset.level.split("-").map(Number);
      Audio.unlock(); Input.reset(); Game.startLevel(l, i); UI.sync();
    });
  },
  buildHand(hand) {                              // цифры руки пересобираются, когда меняется набор (земля 6: ещё 20, 30, 40)
    const key = hand.join(","), el = UI.el;
    if (key === UI.handKey) return;
    UI.handKey = key;
    for (const b of el.hand.querySelectorAll("[data-digit]")) b.remove();
    for (const d of hand) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "hd"; b.dataset.digit = String(d); b.textContent = String(d); b.setAttribute("aria-label", "Цифра " + d);
      el.hand.insertBefore(b, el["btn-fight"]);
    }
    el.hand.classList.toggle("dense", hand.length > 11);
  },
  toast(text) {
    const t = UI.el.toast;
    t.textContent = text; t.hidden = false;
    clearTimeout(UI._toastT);
    UI._toastT = setTimeout(() => { t.hidden = true; }, 2500);
  },
  stars(n) { return [1, 2, 3].map((i) => UI.STAR(i <= n)).join(""); },
  renderMap() {
    const st = Game.progress.stars;
    UI.el.lands.innerHTML = Content.LANDS.map((LD) => {
      const open = Learner.landOpen(LD.id);
      if (!open) {
        const prev = Content.LANDS[LD.id - 2], pr = Learner.landProgress(LD.id - 1);
        return '<div class="land locked" data-land="' + LD.id + '"><h3>' + LD.id + ". " + LD.name + '</h3><div class="lock">' + UI.LOCK +
          "Откроется, когда освоишь факты " + prev.short + ": " + pr.done + " из " + pr.total + "</div><div></div></div>";
      }
      let cells = "";
      for (let i = 0; i < 5; i++) {
        const n = st[LD.id + "-" + i] || 0;
        cells += '<div class="lvl-cell"><button class="lvl" type="button" data-level="' + LD.id + "-" + i + '" aria-label="Земля ' + LD.id + ", уровень " + (i + 1) +
          '">' + (i + 1) + '</button><div class="lvl-stars" data-stars="' + n + '">' + UI.stars(n).replace(/<svg /g, '<svg width="22" height="21" ') + "</div></div>";
      }
      return '<div class="land" data-land="' + LD.id + '"><h3>' + LD.id + ". " + LD.name + '</h3><div class="sample">' + LD.sample + '</div><div class="lvls">' + cells + "</div></div>";
    }).join("");
  },
  renderEnd() {
    const D = Game.endData(), el = UI.el;
    el["le-stars"].innerHTML = UI.stars(D.stars);
    el["le-stars"].dataset.stars = String(D.stars);
    el["le-hearts"].textContent = "Сердец: " + D.hearts + " из " + HEARTS;
    el["le-lines"].innerHTML = D.tips.map((t) => '<p class="tip">' + t + "</p>").concat(D.alts.map((t) => '<p class="alt">' + t + "</p>"), D.chains.map((t) => '<p class="chain">' + t + "</p>")).join("");
  },
  sync() {                                       // перерисовывает DOM только когда что-то изменилось
    const L = Game.level, el = UI.el, inGame = Game.screen === "game" && !!L;
    if (!Build.editable() && (Input.sel || Input.armed !== null || Input.drag || Input.down)) Input.reset();
    const ph = inGame ? L.phase : "none", rib = inGame ? Game.ribbon() : [];
    const last = inGame && L.results.length ? L.results[L.results.length - 1] : null;
    const atEnd = inGame && ph === "levelEnd" && L.endT <= 0, plaqueOn = inGame && ph === "waveEnd" && L.plaqueT <= 2;   // через 0,6 с после последней победы
    const sig = JSON.stringify([Game.screen, ph, inGame ? L.hearts : 0, rib, inGame ? L.waveIdx : 0, Input.armed, Game.settings.sound, last, atEnd, plaqueOn,
      inGame ? L.hand.length : 0, inGame ? L.land + "-" + L.idx : "", Game.screen === "map" ? Game.progress.stars : 0]);
    if (sig === UI.sig) return;
    UI.sig = sig;
    el["scr-title"].hidden = Game.screen !== "title";
    el["scr-map"].hidden = Game.screen !== "map";
    if (Game.screen === "map") UI.renderMap();
    el["scr-level-end"].hidden = !atEnd;
    if (atEnd) UI.renderEnd();
    el.hud.hidden = !inGame;
    if (inGame) UI.buildHand(L.hand);
    el.hand.hidden = !inGame || !(ph === "prep" || ph === "battle" || ph === "paused");
    el["btn-fight"].hidden = ph !== "prep";
    el["btn-pause"].hidden = ph !== "battle";
    el["pause-menu"].hidden = ph !== "paused";
    el["btn-sound"].textContent = "Звук: " + (Game.settings.sound ? "вкл" : "выкл");
    for (const b of el.hand.querySelectorAll("[data-digit]")) b.classList.toggle("armed", Input.armed === +b.dataset.digit);
    if (inGame) {
      let h = "";
      for (let i = 0; i < HEARTS; i++) h += UI.HEART.replace("<svg", i < L.hearts ? "<svg" : '<svg class="lost"');
      el.hearts.innerHTML = h;
      el.ribbon.innerHTML = rib.map((r) => '<div class="rc ' + r.status + (r.armored ? " boss" : "") + (String(r.number).length > 2 ? " l3" : "") + '">' + r.number +
        (r.status === "killed" ? UI.OK : r.status === "castle" ? UI.TOWER : "") + "</div>").join("");
      el["wave-info"].textContent = "Волна " + (L.waveIdx + 1) + " из " + WAVES_PER_LEVEL;
    }
    el.plaque.hidden = !plaqueOn;
    if (plaqueOn && last) {
      el["plaque-text"].textContent = "Волна " + (L.waveIdx + 1) + " отбита!";
      el["plaque-sub"].textContent = "Побеждено " + last.killed + " из " + last.total + " · сердец " + L.hearts + " из " + HEARTS;
    }
  },
};

/* ---------- 17 Audio: WebAudio-блипы (раздел 11), только осцилляторы, без файлов ---------- */
// Контекст создаётся только в первом pointerdown или keydown (unlock): до жеста play молчит. Выключатель — Game.settings.sound.
const Audio = {
  ctx: null, master: null, osc: 0,               // osc — сколько осцилляторов создано (для тестов: при sound:false остаётся 0)
  // Ноты: f — частота, f2 — конечная частота (скольжение), t — старт, d — длительность, r — затухание, w — тип волны.
  NOTES: {
    build: [{ f: 660, f2: 880, t: 0, d: 0.09, r: 0.09, w: "sine" }],
    kill: [{ f: 523, t: 0, d: 0.08, r: 0.1, w: "triangle" }, { f: 784, t: 0.08, d: 0.08, r: 0.14, w: "triangle" }],
    cut: [{ f: 392, t: 0, d: 0.1, r: 0.12, w: "triangle" }],
    miss: [{ f: 220, t: 0, d: 0.12, r: 0.1, w: "triangle" }],
    castle: [{ f: 110, t: 0, d: 0.18, r: 0.2, w: "sine" }],
    wave: [{ f: 523, t: 0, d: 0.09, r: 0.1, w: "sine" }, { f: 659, t: 0.09, d: 0.09, r: 0.1, w: "sine" }, { f: 784, t: 0.18, d: 0.09, r: 0.2, w: "sine" }],
  },
  unlock() {
    try {
      if (Audio.ctx) { if (Audio.ctx.state === "suspended") Audio.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      Audio.ctx = new AC();
      Audio.master = Audio.ctx.createGain(); Audio.master.gain.value = 0.15; Audio.master.connect(Audio.ctx.destination);
      if (Audio.ctx.state === "suspended") Audio.ctx.resume();
    } catch (e) { Audio.ctx = null; }
  },
  state() { return Audio.ctx ? Audio.ctx.state : "none"; },
  play(name) {
    if (!Game.settings.sound || !Audio.ctx || Audio.ctx.state !== "running") return;
    const seq = Audio.NOTES[name];
    if (!seq) return;
    try {
      const c = Audio.ctx, t0 = c.currentTime;
      for (const n of seq) {
        const o = c.createOscillator(), g = c.createGain(), a = t0 + n.t;
        Audio.osc++;
        o.type = n.w; o.frequency.setValueAtTime(n.f, a);
        if (n.f2) o.frequency.linearRampToValueAtTime(n.f2, a + n.d);
        g.gain.setValueAtTime(0.0001, a); g.gain.linearRampToValueAtTime(1, a + 0.005);       // attack 5 мс
        g.gain.setValueAtTime(1, a + n.d); g.gain.exponentialRampToValueAtTime(0.0001, a + n.d + n.r);   // release 80–200 мс
        o.connect(g); g.connect(Audio.master);
        o.start(a); o.stop(a + n.d + n.r + 0.02);
      }
    } catch (e) { /* звук не должен ронять игру */ }
  },
};

/* ---------- 18 Debug: window.OT (раздел 13 чертежа) ---------- */
const Debug = {
  state() {
    const L = Game.level;
    return Util.clone({
      screen: Game.screen, phase: L ? L.phase : null, land: L ? L.land : null, level: L ? L.idx : null, waveIdx: L ? L.waveIdx : null, template: L ? L.template : null, simT: L ? L.simT : 0,
      hearts: L ? L.hearts : HEARTS, hand: L ? L.hand : Content.HAND, scale: Build.scale,
      pads: L ? L.pads.map((p) => ({ id: p.id, x: p.x, y: p.y, lane: p.lane, side: p.side, digit: L.towers[p.id] ? L.towers[p.id].digit : null, fixed: !!(L.towers[p.id] && L.towers[p.id].fixed) })) : [],
      adj: L ? L.adj : {},
      lanes: L ? L.lanes.map((ln) => ({ id: ln.id, len: ln.len, lead: ln.lead, points: ln.points })) : [],
      beams: L ? L.beams.map((b) => ({ id: b.id, a: b.a, b: b.b, da: b.da, db: b.db, product: b.product, label: b.label, cross: b.cross, born: b.born, rebuilds: b.rebuilds, blink: b.blinkT > 0 })) : [],
      enemies: L ? L.enemies.map((e) => ({ id: e.id, number: e.number, card: e.card, rem: e.rem, armored: e.armored, lane: e.lane, d: e.d, alive: e.alive, outcome: e.outcome, note: e.note, hitLog: e.hitLog })) : [],
      ribbon: Game.ribbon(), hints: L && L.wave ? L.wave.hints : [], wave: L && L.wave ? { numbers: L.wave.enemies.map((e) => e.number), fixed: L.wave.fixed, plan: L.wave.plan || [] } : null,
      settings: Game.settings, day: { started: L ? 1 : 0, done: 0 }, diff: { hard: 0, easy: false },
      unlocked: Content.LANDS.map((l) => l.id).filter((id) => Learner.landOpen(id)), stars: Game.progress.stars, cards: {}, conf: {},
      kills: L ? L.kills : [], bosses: L ? L.bosses : [],
    });
  },
  fail: (reason) => ({ ok: false, reason }),
  make() {
    const redraw = () => { Render.draw(); UI.sync(); };
    const wrap = (fn) => (...a) => { const r = fn(...a); redraw(); return r; };   // после каждой мутации кадр свежий
    return {
      state: Debug.state,
      manual: (on) => { Game.manual = on !== false; return Game.manual; },
      seed: (n) => { Game.seed = n; Game.waveCounter = 0; return n; },
      newGame: () => { Input.reset(); Game.toTitle(); Game.waveCounter = 0; Game.progress = { stars: {} }; Bus.clear(); Render.shakes = {}; redraw(); return Debug.state(); },
      loadLevel: wrap((land, idx) => { Input.reset(); return Game.startLevel(land, idx); }),
      setWave: wrap((numbers, o) => {
        const L = Game.level; o = o || {};
        if (!L || L.phase !== "prep") return Debug.fail("phase");
        const armored = o.armored || [], fixed = o.fixed || {};
        const enemies = numbers.map((n, i) => {
          const arm = armored.includes(n);
          const card = (o.cards && o.cards[n]) || (arm ? Content.bossCardFor(L.land, n) || Content.cardForNumber(n) : Content.cardForNumber(n));
          return { number: n, card, armored: arm, lane: o.lanes ? o.lanes[i] : i % L.lanes.length };
        });
        const pl = WaveGen.plan(L, enemies, fixed);       // план Solver: подсказки боссов и поле wave.plan для тестов
        Game.loadWave({ idx: L.waveIdx, easy: false, seed: Game.seed, fixed, enemies,
          hints: pl.ok ? WaveGen.hintsFor(L, enemies, pl.plan) : [], plan: pl.plan.map((p) => ({ n: p.number, a: p.a, b: p.b, da: p.da, db: p.db, tag: p.tag })) });
        return { ok: true };
      }),
      placeTower: wrap((pad, digit) => Build.place(pad, digit)),
      removeTower: wrap((pad) => Build.remove(pad)),
      moveTower: wrap((from, to) => Build.move(from, to)),
      link: wrap((a, b) => Build.link(a, b)),
      unlink: wrap((a, b) => Build.unlink(a, b)),
      dropDigit: wrap((digit, x, y) => Build.dropDigit(digit, x, y)),
      startWave: wrap(() => Game.startWave()),
      step(sec) {
        const n = Math.round(sec * 60);
        for (let i = 0; i < n; i++) Sim.step(DT);
        Render.tick(sec); redraw();
        return Debug.state();
      },
      runWave(maxSec) {
        const L = Game.level, limit = Math.round((maxSec || 300) * 60);
        for (let i = 0; L && i < limit && L.phase !== "waveEnd" && L.phase !== "levelEnd"; i++) {
          Sim.step(DT);
          if (i % 6 === 0) Render.tick(0.1);
        }
        redraw();
        return Debug.state();
      },
      pause: wrap(() => Game.pause()),
      resume: wrap(() => Game.resume()),
      setSetting: (name, value) => { if (name in Game.settings) Game.settings[name] = value; redraw(); return Game.settings; },
      events: (o) => { const r = Bus.log.slice(); if (o && o.clear) Bus.clear(); return r; },
      drawn: () => { Render.draw(); return Util.clone({ labels: Render.last.labels, notes: Render.last.notes, hints: Render.last.hints }); },
      toScreen: (x, y) => { const r = Render.cv.getBoundingClientRect(); return { x: r.left + (x * r.width) / W, y: r.top + (y * r.height) / H }; },
      show: (name) => { if (name === "title") Game.toTitle(); else if (name === "map") Game.toMap(); redraw(); return Game.screen; },
      audioState: () => Audio.state(),
      audioStats: () => ({ state: Audio.state(), osc: Audio.osc }),
      // --- проверки контента без игры (для тестов Solver, WaveGen и шаблонов) ---
      lands: () => Util.clone(Content.LANDS.map((l) => ({ id: l.id, name: l.name, cards: l.cards, normal: l.normal, boss: l.boss, hand: l.hand, tips: l.tips }))),
      templates: () => Object.keys(Content.TEMPLATES),
      validate: (tid) => Content.validate(tid),
      split: (card) => Content.split(card),
      solve: (o) => { const L = Level.create(o.land || 1, o.idx || 0, o.template || "T1"); return Util.clone(Solver.canBuild(L, o.demands, { enemies: o.enemies, fixed: o.fixed })); },
      // Независимая проверка плана волны: пары соседние, цифры согласованы и из руки, у башни ≤ 2 лучей, каждый враг побеждается при проходе по дороге.
      verifyPlan: (o) => {
        const L = Level.create(o.land, o.idx, o.template), bad = [], digit = Object.assign({}, o.fixed || {}), cnt = {}, seen = new Set();
        for (const p of o.plan) {
          const key = Solver.pairKey(p.a, p.b);
          if (!L.pairs[key]) bad.push("пара не соседняя " + key);
          if (seen.has(key)) bad.push("пара дважды " + key);
          seen.add(key);
          for (const [pad, d] of [[p.a, p.da], [p.b, p.db]]) {
            if (!L.hand.includes(d)) bad.push("цифры " + d + " нет в руке");
            if (digit[pad] !== undefined && digit[pad] !== d) bad.push("цифры на " + pad + " спорят: " + digit[pad] + " и " + d);
            digit[pad] = d; cnt[pad] = (cnt[pad] || 0) + 1;
            if (cnt[pad] > 2) bad.push("у " + pad + " больше двух лучей");
          }
        }
        if (!bad.length && !Solver.simulate(L, o.plan, o.enemies)) bad.push("кто-то из врагов не побеждается по плану");
        return bad;
      },
      waveFor: (land, idx, waveIdx, seed) => { const L = Level.create(land, idx); return Util.clone(WaveGen.make({ land, idx, waveIdx, level: L, seed, rng: Util.rng(seed) })); },
    };
  },
};

/* ---------- 19 boot ---------- */
Render.init(document.getElementById("field"));
UI.init();
Input.init();
window.addEventListener("pointerdown", () => Audio.unlock(), true);     // звук оживает только после жеста
window.addEventListener("resize", Render.resize);
window.addEventListener("orientationchange", Render.resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) Game.pause(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Render.draw());
for (const [ev, snd] of [["beam_built", "build"], ["enemy_killed", "kill"], ["boss_hit", "cut"], ["enemy_passed_beam", "miss"], ["enemy_reached_castle", "castle"], ["wave_end", "wave"]]) Bus.on(ev, () => Audio.play(snd));
let lastTs = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastTs) / 1000);
  lastTs = now;
  if (!Game.manual) {
    acc += dt;
    for (let n = 0; acc >= DT && n < 6; n++) { Sim.step(DT); acc -= DT; }
  } else acc = 0;
  Render.tick(dt); Render.draw(); UI.sync();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.OT = Debug.make();
UI.sync();
})();
</script>
