<title>Оборона таблицы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Russo+One&display=swap">
<style>
/* 1. Токены. Игра держит один яркий дневной вид, тёмной темы нет. */
:root {
  --bg:#17324a; --grass:#8fcf6a; --grass-2:#79bb57; --path:#ecd29b; --path-edge:#c9a66b;
  --stone:#a7b0bb; --stone-2:#7d8792; --castle:#d9dee5; --roof:#d65a4a; --wood:#a8703f;
  --ink:#1b2333; --paper:#fffaf0; --gold:#ffc83d; --gold-ink:#2a1d00;
  --beam:#ffd23f; --beam-core:#fff6c8; --miss:#8e949c; --hint:#3b6fd8;
  --enemy:#8a63d2; --enemy-2:#6c48b3; --boss:#59606d; --rivet:#c8ced6;
  --heart:#e8445a; --good:#2fa36b;
  --panel:#1f3b4d; --panel-ink:#f2f6ee;
  --b0:#cfd6de; --b1:#ff6f61; --b2:#ff9f4a; --b3:#ffd24a; --b4:#9be27a; --b5:#43c97a;
  --f-num:"Russo One","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:30px; /* базовый текст в лп; крупный шрифт = 37.5px */
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--f-body); font-size: var(--fs); color: var(--panel-ink); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

/* 2. Сцена: логическое поле 1600x900, масштаб и letterbox ставит JS (Render.resize). */
#app { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden; background: var(--grass); }
#field { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; display: block; touch-action: none; }

/* 3. HUD: сердца, лента волны, номер волны, пауза. Сам слой не ловит касания. */
#hud { position: absolute; left: 0; top: 0; width: 1600px; height: 110px; background: rgba(31,59,77,.94); border-bottom: 4px solid #2b4f66; pointer-events: none; }
#hearts { position: absolute; left: 18px; top: 16px; display: flex; gap: 3px; }
#hearts svg { width: 30px; height: 28px; fill: var(--heart); stroke: #7d1626; stroke-width: 1.4; }
#hearts svg.lost { fill: none; stroke: #6f8797; opacity: .8; }
#ribbon-cap { position: absolute; left: 350px; top: 3px; width: 890px; height: 32px; line-height: 32px; text-align: center; font-weight: 800; font-size: 26px; opacity: .9; }
#ribbon { position: absolute; left: 350px; top: 38px; width: 890px; height: 64px; display: flex; gap: 6px; justify-content: center; }
.rc { position: relative; flex: none; width: 66px; height: 60px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 4px solid #c9b88a; font: 400 32px/52px var(--f-num); text-align: center; }
.rc.l3 { font-size: 26px; }
.rc.boss { background: #dfe3e8; border-color: var(--boss); border-width: 5px; }
.rc.walk { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.55); }
.rc.killed { opacity: .5; }
.rc.castle { background: #f5d7d3; border-color: var(--roof); }
.rc svg { position: absolute; right: -6px; bottom: -8px; width: 26px; height: 26px; }
.rc.killed svg { fill: var(--good); }
.rc.castle svg { fill: var(--roof); }
#wave-info { position: absolute; left: 18px; top: 62px; width: 320px; font: 400 30px/1.2 var(--f-num); }
.btn { border-radius: 22px; background: linear-gradient(#ffd75e,#ffc83d); color: var(--gold-ink); font-weight: 800; font-size: 34px; box-shadow: 0 6px 0 #b9861a; pointer-events: auto; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b9861a; }
.btn.alt { background: linear-gradient(#e9f0f4,#cfdbe3); color: var(--ink); box-shadow: 0 6px 0 #8aa0ae; }
#btn-pause { position: absolute; left: 1410px; top: 12px; width: 176px; height: 84px; }

/* 4. Рука с цифрами и «В бой!». */
#hand { position: absolute; left: 0; top: 790px; width: 1600px; height: 110px; background: var(--panel); border-top: 4px solid #2b4f66; display: flex; align-items: center; gap: 10px; padding: 0 24px; touch-action: none; }
#hand .hd { flex: none; width: 88px; height: 88px; border-radius: 24px; background: var(--paper); border: 6px solid var(--wood); color: var(--ink); font: 400 50px/1 var(--f-num); box-shadow: 0 5px 0 #6f4524; touch-action: none; }
#hand .hd.armed { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(255,200,61,.6), 0 5px 0 #6f4524; transform: translateY(-6px); }
#hand .hd.off { opacity: .5; }
#hand.dense { gap: 6px; padding: 0 16px; }
#hand.dense .hd { width: 78px; height: 84px; font-size: 44px; }
#btn-fight { position: absolute; right: 24px; top: 8px; width: 400px; height: 90px; font-size: 46px; font-family: var(--f-num); font-weight: 400; background: linear-gradient(#7fe3a4,#3cc57a); color: #06301a; box-shadow: 0 6px 0 #1f7a49; }
#btn-fight:active { box-shadow: 0 3px 0 #1f7a49; }

/* 5. Меню паузы (полоса справа под лентой, крепость не закрывает), табличка конца волны, экраны. */
#pause-menu { position: absolute; right: 12px; top: 118px; width: 760px; padding: 10px; background: var(--panel); border: 4px solid #2b4f66; border-radius: 26px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
#pause-menu .btn { width: 100%; height: 76px; font-size: 32px; }
#plaque { position: absolute; left: 400px; top: 270px; width: 800px; padding: 28px 30px 30px; background: var(--paper); color: var(--ink); border: 8px solid var(--gold); border-radius: 36px; text-align: center; display: grid; gap: 10px; justify-items: center; box-shadow: 0 10px 0 rgba(0,0,0,.2); }
#plaque-text { font: 400 62px/1.1 var(--f-num); }
#plaque-sub { font-weight: 800; font-size: 36px; }
.screen { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, #2a5575, var(--bg) 70%); display: grid; place-content: center; justify-items: center; gap: 24px; text-align: center; z-index: 5; }
.screen h1 { margin: 0; font: 400 118px/1.05 var(--f-num); color: var(--gold); text-shadow: 0 6px 0 #7a5400; }
.screen p { margin: 0; font-weight: 800; font-size: 38px; max-width: 1000px; line-height: 1.3; }
#btn-play { width: 420px; height: 120px; font-size: 56px; font-family: var(--f-num); font-weight: 400; margin-top: 20px; }
/* Карта мира: шесть земель, по пять уровней. */
#scr-map { gap: 10px; padding-top: 14px; }
#scr-map h2 { margin: 0; font: 400 58px/1.1 var(--f-num); color: var(--gold); text-shadow: 0 4px 0 #7a5400; }
#lands { display: grid; grid-template-columns: repeat(3, 500px); gap: 22px 24px; }
.land { position: relative; height: 350px; padding: 16px 14px 12px; border-radius: 34px; border: 6px solid #2b4f66; background: linear-gradient(#3a7d52, #2c6a45); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; }
.land[data-land="2"] { background: linear-gradient(#7a9a4a, #5f8238); }
.land[data-land="3"] { background: linear-gradient(#2f7a4c, #1f5e3a); }
.land[data-land="4"] { background: linear-gradient(#8b95a3, #66707e); }
.land[data-land="5"] { background: linear-gradient(#b08a52, #8c6a38); }
.land[data-land="6"] { background: linear-gradient(#8a63d2, #6c48b3); }
.land.locked { filter: saturate(.25) brightness(.7); }
.land h3 { margin: 0; font: 800 32px/1.15 var(--f-body); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); min-height: 74px; display: flex; align-items: center; }
.land .lock { align-self: center; font-weight: 800; font-size: 28px; line-height: 1.25; padding: 0 10px; }
.land .lock svg { display: block; margin: 0 auto 6px; width: 54px; height: 54px; fill: var(--gold); stroke: var(--ink); stroke-width: 1.5; }
.lvls { display: flex; gap: 16px; align-items: flex-start; justify-content: center; margin-bottom: 8px; }
.lvl-cell { display: grid; justify-items: center; gap: 2px; }
.lvl { width: 78px; height: 78px; border-radius: 50%; background: linear-gradient(#ffd75e,#ffc83d); color: var(--gold-ink); font: 400 38px/1 var(--f-num); box-shadow: 0 5px 0 #b9861a; border: 4px solid var(--ink); }
.lvl:active { transform: translateY(3px); box-shadow: 0 2px 0 #b9861a; }
.lvl-stars { display: flex; gap: 2px; height: 24px; }
.lvl-stars svg { fill: rgba(0,0,0,.35); stroke: rgba(255,255,255,.45); stroke-width: 1.2; }
.lvl-stars svg.on { fill: var(--gold); stroke: var(--ink); }
.land .sample { align-self: center; font: 400 54px/1 var(--f-num); color: rgba(255,255,255,.28); }
/* Итоги уровня. */
#scr-level-end { gap: 12px; }
#scr-level-end h2 { margin: 0; font: 400 76px/1.1 var(--f-num); color: var(--gold); text-shadow: 0 5px 0 #7a5400; }
#le-stars { display: flex; gap: 14px; }
#le-stars svg { width: 110px; height: 106px; fill: #31566e; stroke: #0f2230; stroke-width: 1.2; }
#le-stars svg.on { fill: var(--gold); }
#le-hearts { font-weight: 800; font-size: 36px; }
#le-lines { display: grid; gap: 8px; max-width: 1280px; padding: 14px 24px; background: rgba(0,0,0,.22); border-radius: 24px; }
#le-lines p { font-size: 32px; font-weight: 800; line-height: 1.25; max-width: none; }
#le-lines p.tip { color: #bfe8ff; }
#le-lines p.alt { color: #fff3b8; }
#le-lines p.chain { color: #d6dde5; }
#le-btns { display: flex; gap: 28px; margin-top: 8px; }
#le-btns .btn { width: 360px; height: 100px; font-size: 44px; font-family: var(--f-num); font-weight: 400; }
#toast { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); padding: 10px 26px; border-radius: 20px; background: var(--paper); color: var(--ink); font-weight: 800; font-size: 32px; pointer-events: none; }

/* 6. Поверни планшет. */
#rotate { position: fixed; inset: 0; z-index: 99; background: var(--bg); color: var(--gold); display: grid; place-content: center; text-align: center; font: 400 9vw/1.15 var(--f-num); padding: 0 6vw; }

/* 7. Спокойный режим движения. */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div id="app">
  <div id="stage">
    <canvas id="field"></canvas>
    <div id="hud" hidden>
      <div id="hearts" aria-label="Сердца"></div>
      <div id="ribbon-cap">Следующая волна</div>
      <div id="ribbon"></div>
      <div id="wave-info"></div>
      <button class="btn" id="btn-pause" type="button" hidden>Пауза</button>
    </div>
    <div id="hand" hidden>
      <button class="btn" id="btn-fight" type="button">В бой!</button>
    </div>
    <div id="pause-menu" hidden>
      <button class="btn" id="btn-resume" type="button">Продолжить</button>
      <button class="btn alt" id="btn-sound" type="button">Звук: вкл</button>
      <button class="btn alt" id="btn-to-map" type="button">На карту</button>
    </div>
    <div id="plaque" hidden>
      <div id="plaque-text"></div>
      <div id="plaque-sub"></div>
    </div>
    <div id="toast" hidden></div>
    <section class="screen" id="scr-title">
      <h1>Оборона таблицы</h1>
      <p>Путаник несёт число. Поставь две башни, чтобы луч между ними дал это число, и путаник исчезнет.</p>
      <button class="btn" id="btn-play" type="button">Играть</button>
    </section>
    <section class="screen" id="scr-map" hidden>
      <h2>Карта мира</h2>
      <div id="lands"></div>
    </section>
    <section class="screen" id="scr-level-end" hidden>
      <h2 id="le-title">Уровень пройден!</h2>
      <div id="le-stars" aria-label="Звёзды"></div>
      <div id="le-hearts"></div>
      <div id="le-lines"></div>
      <div id="le-btns">
        <button class="btn" id="btn-le-next" type="button">Дальше</button>
        <button class="btn alt" id="btn-le-map" type="button">На карту</button>
      </div>
    </section>
  </div>
  <div id="rotate" hidden>Поверни планшет боком</div>
</div>
<script>
(() => { "use strict";
// Оборона таблицы. Этап 2: карта мира, шесть земель, боссы, деление, двузначные, три волны на уровень.
// Модули 0–13 — чистая логика: не трогают document и canvas. Рисуют и слушают только Render, UI, Input, Audio и boot.
const W = 1600, H = 900, DT = 1 / 60;
const PAD_OFF = 170, PAD_R = 48, LINK_MAX = 470, CATCH_CSS = 40, HEARTS = 10;
const WAVES_PER_LEVEL = 3;
const DEV_UNLOCK_ALL = true;                     // все земли открыты; этап 3 снимает флаг и открывает земли по карточкам
const SPEEDS = { veryslow: 30, slow: 45, normal: 60, fast: 80 };   // лп/с
const GAP = 150, GAP_BOSS = 225;                 // расстояние между врагами, лп
const FIELD_TOP = 110, FIELD_BOTTOM = 790;       // зона поля; выше лента, ниже рука
const MINUS = "−", TIMES = "×";

/* ---------- 0 Util: мелочи и seeded RNG ---------- */
const Util = {
  rng(seed) {                                    // mulberry32
    let a = (seed >>> 0) || 1;
    const next = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
    };
  },
  clamp: (v, lo, hi) => Math.min(hi, Math.max(lo, v)),
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  fmt: (n) => String(n),
  clone: (o) => JSON.parse(JSON.stringify(o)),
};

/* ---------- 1 Content: факты, земли, шаблоны полей, тексты ---------- */
const Content = {
  HAND: [2, 3, 4, 5, 6, 7, 8, 9, 10],            // земли 1–5
  HAND6: [2, 3, 4, 5, 6, 7, 8, 9, 10, 20, 30, 40],   // земля 6: ещё 20, 30, 40 (раздел 16, п. 9)
  handOf(land) { return land === 6 ? Content.HAND6 : Content.HAND; },
  LEVEL_TEMPLATE: ["T1", "T2", "T3", "T3", "T4"],   // уровни 0–4 земель 1–4 и 6; земля 5 всегда T5
  templateFor(land, idx) { return land === 5 ? "T5" : Content.LEVEL_TEMPLATE[idx] || "T1"; },
  // Шаблоны полей (раздел 3 чертежа). Площадка: id, x, y, lane (ближайшая дорожка), side (+1 выше дорожки, −1 ниже).
  // Необязательно: pad.clear — свой минимум до дороги (по умолчанию PAD_OFF − 10), template.minGap — свой минимум между площадками (по умолчанию 300).
  TEMPLATES: {
    T1: {   // «Прямая»: одна дорога, три пары через дорогу
      id: "T1", name: "Прямая",
      lanes: [[[-60, 450], [1400, 450]]],
      pads: [
        { id: "A0", x: 420, y: 280, lane: 0, side: 1 }, { id: "B0", x: 420, y: 620, lane: 0, side: -1 },
        { id: "A1", x: 720, y: 280, lane: 0, side: 1 }, { id: "B1", x: 720, y: 620, lane: 0, side: -1 },
        { id: "A2", x: 1020, y: 280, lane: 0, side: 1 }, { id: "B2", x: 1020, y: 620, lane: 0, side: -1 },
      ],
      links: null,                               // null = правило Geo.adjacency; иначе { padId: [padId…] }
    },
    T2: {   // «Изгиб»: S-образная дорога, лесенки 2 + 2 пары на двух прямых участках
      id: "T2", name: "Изгиб",
      lanes: [[[-60, 340], [580, 340], [720, 560], [1230, 560], [1330, 450], [1400, 450]]],
      pads: [
        { id: "A0", x: 140, y: 170, lane: 0, side: 1 }, { id: "B0", x: 140, y: 510, lane: 0, side: -1 },
        { id: "A1", x: 440, y: 170, lane: 0, side: 1 }, { id: "B1", x: 440, y: 510, lane: 0, side: -1 },
        { id: "A2", x: 840, y: 390, lane: 0, side: 1 }, { id: "B2", x: 840, y: 730, lane: 0, side: -1 },
        { id: "A3", x: 1160, y: 390, lane: 0, side: 1 }, { id: "B3", x: 1160, y: 730, lane: 0, side: -1 },
      ],
      links: null,
    },
    T3: {   // «Развилка»: две дороги сливаются в ствол на x = 520; шесть площадок на стволе, пара C0–C1 у верхней ветки
      id: "T3", name: "Развилка",
      lanes: [[[-60, 330], [260, 330], [520, 450], [1400, 450]], [[-60, 700], [260, 700], [520, 450], [1400, 450]]],
      pads: [
        { id: "A0", x: 700, y: 280, lane: 0, side: 1 }, { id: "B0", x: 700, y: 620, lane: 0, side: -1 },
        { id: "A1", x: 1000, y: 280, lane: 0, side: 1 }, { id: "B1", x: 1000, y: 620, lane: 0, side: -1 },
        { id: "A2", x: 1300, y: 280, lane: 0, side: 1 }, { id: "B2", x: 1300, y: 620, lane: 0, side: -1 },
        { id: "C0", x: 150, y: 160, lane: 0, side: 1 }, { id: "C1", x: 150, y: 500, lane: 0, side: -1 },
      ],
      links: null,
    },
    T4: {   // «Три тропы»: три дороги сливаются на x = 560; шесть площадок на стволе, D0 и D1 стоят между ветками
      id: "T4", name: "Три тропы", minGap: 240,
      lanes: [
        [[-60, 190], [340, 190], [560, 450], [1400, 450]],
        [[-60, 450], [560, 450], [1400, 450]],
        [[-60, 710], [340, 710], [560, 450], [1400, 450]],
      ],
      pads: [
        { id: "A0", x: 700, y: 280, lane: 0, side: 1 }, { id: "B0", x: 700, y: 620, lane: 2, side: -1 },
        { id: "A1", x: 1000, y: 280, lane: 0, side: 1 }, { id: "B1", x: 1000, y: 620, lane: 2, side: -1 },
        { id: "A2", x: 1300, y: 280, lane: 0, side: 1 }, { id: "B2", x: 1300, y: 620, lane: 2, side: -1 },
        { id: "D0", x: 260, y: 310, lane: 0, side: -1, clear: 118 }, { id: "D1", x: 260, y: 590, lane: 2, side: 1, clear: 118 },
      ],
      links: null,
    },
    T5: {   // «Деление»: A0…A3 — заранее стоящие башни, B0…B3 свободные; свободные не соседи друг другу
      id: "T5", name: "Деление",
      lanes: [[[-60, 450], [1400, 450]]],
      pads: [
        { id: "A0", x: 300, y: 280, lane: 0, side: 1 }, { id: "B0", x: 300, y: 620, lane: 0, side: -1 },
        { id: "A1", x: 600, y: 280, lane: 0, side: 1 }, { id: "B1", x: 600, y: 620, lane: 0, side: -1 },
        { id: "A2", x: 900, y: 280, lane: 0, side: 1 }, { id: "B2", x: 900, y: 620, lane: 0, side: -1 },
        { id: "A3", x: 1200, y: 280, lane: 0, side: 1 }, { id: "B3", x: 1200, y: 620, lane: 0, side: -1 },
      ],
      links: null,
    },
  },
  TEXT: { fight: "В бой!", pause: "Пауза", resume: "Продолжить", next: "Следующая волна", rotate: "Поверни планшет боком" },
  // Пары множителей из руки, дающие n (a ≤ b).
  pairsOf(n, hand) {
    hand = hand || Content.HAND;
    const out = [];
    for (const a of hand) for (const b of hand) if (a <= b && a * b === n) out.push([a, b]);
    return out;
  },
  cardKey(a, b, op) { return (op || "m") + ":" + Math.min(a, b) + "x" + Math.max(a, b); },
  cardOf(key) {
    const m = /^([mbd]):(\d+)x(\d+)$/.exec(key);
    return m ? { op: m[1], a: +m[2], b: +m[3], n: +m[2] * +m[3] } : null;
  },
  cardNumber(key) { const c = Content.cardOf(key); return c ? c.n : 0; },
  // Карточка числа: пара из 2–9, если есть, иначе пара с 10.
  cardForNumber(n) {
    const ps = Content.pairsOf(n, Content.HAND);
    if (!ps.length) return "m:?" + n;
    const small = ps.find(([a, b]) => b <= 9) || ps[0];
    return Content.cardKey(small[0], small[1]);
  },
  // Карточка железного путаника с числом n на земле land: земля 6 — двузначный босс, иначе «Трудные пятнадцать» (b:).
  bossCardFor(land, n) {
    const L = Content.LANDS[land - 1], list = land === 6 ? L.cards : Content.H15;
    return list.find((k) => Content.cardNumber(k) === n) || null;
  },
  tableNumbers() {                               // все произведения 2–9 × 2–9 без повторов
    const s = new Set();
    for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) s.add(a * b);
    return [...s].sort((x, y) => x - y);
  },
  // Разрезание босса (раздел 6.2). Табличный a×b: больший множитель f = 5 + остаток (иначе пополам), 3×3 не режется (null).
  // Двузначный n×k режется по разрядам: десятки × k и единицы × k.
  split(card) {
    const c = typeof card === "string" ? Content.cardOf(card) : card;
    if (!c) return null;
    const a = Math.min(c.a, c.b), f = Math.max(c.a, c.b);
    if (f >= 10) {
      const u = f % 10;
      return u ? [(f - u) * a, u * a] : null;
    }
    if (f > 3) {
      if (f - 5 >= 2) return [a * 5, a * (f - 5)];
      const h = Math.floor(f / 2);
      return [a * h, a * (f - h)];
    }
    return null;
  },
  // Разрезание для Solver и подсказки: две части или (3×3) целый луч.
  demandsOf(card) { const sp = Content.split(card); return sp || [Content.cardNumber(card)]; },
  // Какими цифрами строить часть p босса: общий множитель босса и частное (7 × 8 → 7 × 5 и 7 × 3, 4 × 23 → 4 × 20 и 4 × 3).
  // Solver пробует это разложение первым, поэтому план и призрак подсказки учат разрезанию, а не «3 × 10» для 6 × 8.
  prefOf(card, p) { const c = Content.cardOf(card), a = c ? Math.min(c.a, c.b) : 0; return a && p % a === 0 ? [a, p / a] : null; },
  // Проверка шаблона: расстояния, соседи, места под подписи, решаемость трёх наборов. Возвращает список замечаний.
  validate(tid) {
    const t = Content.TEMPLATES[tid];
    if (!t) return ["нет шаблона " + tid];
    const bad = [], L = Level.create(1, 0, tid), gap = t.minGap || 300;
    for (let i = 0; i < t.pads.length; i++) for (let j = i + 1; j < t.pads.length; j++) {
      const a = t.pads[i], b = t.pads[j], d = Util.dist(a.x, a.y, b.x, b.y);
      if (d < gap) bad.push(tid + ": площадки " + a.id + " и " + b.id + " ближе " + gap + " лп (" + Math.round(d) + ")");
    }
    for (const p of t.pads) {
      const need = p.clear || PAD_OFF - 10, near = Math.min(...L.lanes.map((ln) => Geo.distToLane(ln, p.x, p.y)));
      if (near < need) bad.push(tid + ": площадка " + p.id + " ближе " + need + " лп к дороге (" + Math.round(near) + ")");
      if (p.x - PAD_R < 0 || p.x + PAD_R > W || p.y - PAD_R < FIELD_TOP || p.y + PAD_R > FIELD_BOTTOM) bad.push(tid + ": площадка " + p.id + " выходит из поля");
      if (!L.adj[p.id].length) bad.push(tid + ": у площадки " + p.id + " нет соседа");
    }
    const sets = [[12, 24, 56], [18, 42, 63], [16, 30, 72]];
    for (const set of sets) if (!Solver.canBuild(L, set).ok) bad.push(tid + ": не строится набор " + set.join(", "));
    const last = (ln) => ln.points[ln.points.length - 1];
    if (L.lanes.some((ln) => last(ln)[0] !== 1400 || last(ln)[1] !== 450)) bad.push(tid + ": дорога не кончается у ворот (1400, 450)");
    if (L.lanes.some((ln) => ln.points[0][0] > -60)) bad.push(tid + ": дорога начинается внутри поля");
    return bad;
  },
};

/* ---------- 2 Clock: сегодняшняя дата с подменой ---------- */
const Clock = {
  override: null,
  nowMs: () => Date.now(),
  key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
  today() { return Clock.override || Clock.key(new Date()); },
  addDays(key, n) { const [y, m, d] = key.split("-").map(Number); return Clock.key(new Date(y, m - 1, d + n)); },
  setOverride(k) { Clock.override = k || null; },
};

/* ---------- 3 Bus: события и журнал для тестов ---------- */
const Bus = {
  log: [], seq: 0, subs: {},
  emit(type, payload) {
    const L = Game.level;
    const t = L && (L.phase === "battle" || L.phase === "paused") ? +L.simT.toFixed(3) : Clock.nowMs();
    const ev = Object.assign({ seq: ++Bus.seq, t, type }, payload || {});
    Bus.log.push(ev);
    if (Bus.log.length > 2000) Bus.log.shift();
    const list = Bus.subs[type];
    if (list) for (const fn of list) fn(ev);
    return ev;
  },
  on(type, fn) { (Bus.subs[type] = Bus.subs[type] || []).push(fn); },
  clear() { Bus.log.length = 0; },
};

/* ---------- 6 Solver: можно ли построить волну на этих площадках ---------- */
// Перебор с возвратом: каждому спросу — своя соседняя пара площадок и разложение p = x·y из руки.
// Цифры на площадке не конфликтуют, у башни не больше 2 лучей, заранее стоящие цифры учитываются.
// Спрос: число или { n, lanes:[id…] (дорожки, которые луч обязан пересекать; по умолчанию все), tag, part (часть разрезания босса) }.
// opts.enemies — враги волны {number, armored, lane}: найденный план дополнительно проверяется проходом каждого врага по дороге.
// opts.fixed — цифры заранее стоящих башен {padId: digit}.
const Solver = {
  LIMIT: 7000,
  simulate(level, plan, enemies) {
    const beams = plan.map((p, i) => ({ id: i, product: p.da * p.db, cross: level.pairs[Solver.pairKey(p.a, p.b)].cross }));
    for (const e of enemies) {
      const lane = e.lane || 0, st = { rem: e.number, armored: !!e.armored };
      const list = beams.filter((b) => b.cross[lane] !== undefined).sort((x, y) => x.cross[lane] - y.cross[lane] || x.id - y.id);
      let dead = false;
      for (const b of list) {
        const r = Rules.apply(st, b);
        if (r.kind === "kill") { dead = true; break; }
        if (r.kind === "cut") st.rem = r.to;
      }
      if (!dead) return false;
    }
    return true;
  },
  pairKey: (a, b) => (a < b ? a + "|" + b : b + "|" + a),
  canBuild(level, demands, opts) {
    opts = opts || {};
    const hand = level.hand || Content.HAND, all = level.lanes.map((l) => l.id);
    const dem = demands.map((d) => typeof d === "number" ? { n: d, lanes: all, tag: null, part: false, xs: hand }
      : { n: d.n, lanes: d.lanes && d.lanes.length ? d.lanes : all, tag: d.tag || null, part: !!d.part,
          xs: d.pref ? [...new Set(d.pref.filter((x) => hand.includes(x)).concat(hand))] : hand });   // pref — разложение, которое пробуется первым
    const edges = Object.keys(level.pairs).sort().map((k) => level.pairs[k]);
    const digit = {}, cnt = {}, used = new Set(), plan = [];
    for (const id of Object.keys(level.towers)) if (level.towers[id].fixed) digit[id] = level.towers[id].digit;
    Object.assign(digit, opts.fixed || {});
    let nodes = 0;
    const go = (i) => {
      if (i === dem.length) return !opts.enemies || Solver.simulate(level, plan, opts.enemies);
      if (++nodes > Solver.LIMIT) return false;
      const { n, lanes, tag, part, xs } = dem[i];
      if (!part && plan.some((p) => p.da * p.db === n && lanes.every((l) => level.pairs[Solver.pairKey(p.a, p.b)].cross[l] !== undefined))) return go(i + 1);   // уже есть такой луч
      for (const e of edges) {
        if (used.has(e.key) || (cnt[e.a] || 0) >= 2 || (cnt[e.b] || 0) >= 2) continue;
        if (!lanes.every((l) => e.cross[l] !== undefined)) continue;
        for (const x of xs) {
          if (n % x) continue;
          const y = n / x;
          if (!hand.includes(y)) continue;
          if (digit[e.a] !== undefined && digit[e.a] !== x) continue;
          if (digit[e.b] !== undefined && digit[e.b] !== y) continue;
          const sa = digit[e.a], sb = digit[e.b];
          digit[e.a] = x; digit[e.b] = y; cnt[e.a] = (cnt[e.a] || 0) + 1; cnt[e.b] = (cnt[e.b] || 0) + 1;
          used.add(e.key); plan.push({ number: n, a: e.a, b: e.b, da: x, db: y, tag });
          if (go(i + 1)) return true;
          plan.pop(); used.delete(e.key); cnt[e.a]--; cnt[e.b]--;
          if (sa === undefined) delete digit[e.a]; else digit[e.a] = sa;
          if (sb === undefined) delete digit[e.b]; else digit[e.b] = sb;
        }
      }
      return false;
    };
    return go(0) ? { ok: true, plan: plan.map((p) => Object.assign({}, p)) } : { ok: false, plan: [] };
  },
};

/* ---------- 7 WaveGen: состав волны ---------- */
// Шаги 1, 4, 6–9 раздела 6.4 без Лейтнера: все карточки земли считаются знакомыми, «новые» вводятся по порядку от волны к волне
// (за 15 волн земли проходит весь список). Этап 3 заменит выбор карточек на корзины, оставив тот же вход и выход.
const WaveGen = {
  BASE: [6, 7, 8, 9, 10],
  sizeOf(idx, waveIdx, easy) { const n = Math.min(12, WaveGen.BASE[idx] + waveIdx); return easy ? Math.max(6, n - 2) : n; },
  intro(N, s) { return Math.min(N, 3 + Math.floor((s * (N - 3)) / 14)); },   // сколько карточек земли уже введено к волне s = уровень·3 + волна
  priors(land) {                                 // m: карточки прошлых земель — обычные враги-повторы
    const out = [];
    for (let i = 0; i < land - 1; i++) for (const k of Content.LANDS[i].cards) if (k[0] === "m") out.push(k);
    return out;
  },
  // Набор из k различных чисел: самая новая карточка, остальные из введённых; иногда повтор из прошлых земель.
  pickCards(rng, intro, priors, k, first) {
    const chosen = [], nums = new Set();
    const add = (key) => { const num = Content.cardNumber(key); if (nums.has(num)) return false; nums.add(num); chosen.push(key); return true; };
    if (first) add(first);
    for (let g = 0; chosen.length < k && g < 120; g++) {
      const fromPrior = priors.length && (!intro.length || (chosen.length >= 2 && rng.next() < 0.3));
      add(rng.pick(fromPrior ? priors : intro));
    }
    return chosen;
  },
  spread(cards, n, armored) {                    // n врагов по кругу между карточками
    const out = [];
    for (let i = 0; i < n; i++) { const c = cards[i % cards.length]; out.push({ number: Content.cardNumber(c), card: c, armored: !!armored }); }
    return out;
  },
  composeNormal(cx, n, kMax, shrink) {
    const { land, rng, s } = cx, LD = Content.LANDS[land - 1], intro = LD.normal.slice(0, WaveGen.intro(LD.normal.length, s));
    const k = Math.max(1, Math.min(kMax, s === 0 ? 3 : kMax) - shrink), newCard = intro[intro.length - 1];
    const cards = WaveGen.pickCards(rng, intro, land > 1 ? WaveGen.priors(land) : [], k, newCard);
    return { list: WaveGen.spread(cards, n, false), fixed: {}, newCard };
  },
  composeBoss(cx, n, kMax, shrink) {
    const { land, idx, rng, s, level: L } = cx, LD = Content.LANDS[land - 1], BL = LD.boss;
    // Боссов ≤ 3 на волну, различных ≤ 2; два разных босса (четыре луча) — только на T2: на стволе T3 и T4 для них не хватает башен.
    let nb = Math.min(3, 1 + (s >> 2)), nCards = nb > 1 && L.template === "T2" ? 2 : 1;
    if (shrink >= 1) nCards = 1;
    if (shrink >= 2) nb = 1;
    const cards = [BL[s % BL.length]];
    if (nCards === 2) { let j = (s * 7 + 3) % BL.length; if (BL[j] === cards[0]) j = (j + 1) % BL.length; cards.push(BL[j]); }
    const bosses = WaveGen.spread(cards, nb, true);
    const bossNums = new Set(cards.map(Content.cardNumber));     // обычное число, равное боссу, убило бы его целым лучом
    const pool = LD.normal.concat(WaveGen.priors(land)).filter((k) => !bossNums.has(Content.cardNumber(k)));
    const kN = Math.max(1, Math.min(2, kMax - nCards) - (shrink >= 3 ? 1 : 0));
    const normalCards = WaveGen.pickCards(rng, pool, [], kN, null);
    return { list: bosses.concat(WaveGen.spread(normalCards, n - nb, false)), fixed: {}, newCard: null };
  },
  composeDiv(cx, n, kMax, shrink) {
    const { idx, rng, s } = cx, LD = Content.LANDS[4], intro = LD.cards.slice(0, WaveGen.intro(LD.cards.length, s));
    const k = Math.max(1, Math.min(kMax, 2 + (idx >> 1)) - shrink), newCard = intro[intro.length - 1];
    const cards = WaveGen.pickCards(rng, intro, [], k, newCard), pads = rng.shuffle(["A0", "A1", "A2", "A3"]), fixed = {};
    cards.forEach((key, i) => {                  // заранее стоящая башня получает один из множителей: то меньший, то больший
      const c = Content.cardOf(key);
      fixed[pads[i]] = i % 2 === 0 ? Math.min(c.a, c.b) : Math.max(c.a, c.b);
    });
    for (const p of pads.slice(cards.length)) fixed[p] = rng.int(2, 9);          // остальные — отвлекающие
    return { list: WaveGen.spread(cards, n, false), fixed, newCard };
  },
  // Порядок выхода: боссы во второй половине, одно число не больше двух раз подряд, новая карточка не первая.
  arrange(list, rng, lanes, newCard) {
    const n = list.length, out = new Array(n).fill(null);
    const bosses = list.filter((e) => e.armored), normals = list.filter((e) => !e.armored), half = [];
    for (let i = Math.ceil(n / 2); i < n; i++) half.push(i);
    const same = (x, y) => x.number === y.number && x.armored === y.armored;
    const ok = (a) => {
      for (let i = 2; i < a.length; i++) if (same(a[i], a[i - 1]) && same(a[i], a[i - 2])) return false;
      return !newCard || a[0].card !== newCard || list.every((e) => e.card === newCard);
    };
    for (let t = 0; t < 200; t++) {
      out.fill(null);
      rng.shuffle(bosses);
      rng.shuffle(half.slice()).slice(0, bosses.length).forEach((pos, i) => { out[pos] = bosses[i]; });
      const free = out.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
      rng.shuffle(normals);
      free.forEach((pos, j) => { out[pos] = normals[j]; });
      if (ok(out)) break;
    }
    return out.map((e, i) => Object.assign({}, e, { lane: i % lanes }));
  },
  // Спросы для Solver: боссы (части разрезания, дорожки их врагов) и обычные числа.
  demandsOf(ordered) {
    const dem = [], bossLanes = new Map(), numLanes = new Map();
    for (const e of ordered) {
      const m = e.armored ? bossLanes : numLanes, key = e.armored ? e.card : e.number;
      if (!m.has(key)) m.set(key, new Set());
      m.get(key).add(e.lane);
    }
    for (const [card, ls] of bossLanes) for (const p of Content.demandsOf(card)) dem.push({ n: p, lanes: [...ls].sort(), tag: card, part: true, pref: Content.prefOf(card, p) });
    for (const [num, ls] of numLanes) dem.push({ n: num, lanes: [...ls].sort(), tag: null, part: false });
    return dem;
  },
  plan(L, ordered, fixed) { return Solver.canBuild(L, WaveGen.demandsOf(ordered), { enemies: ordered, fixed: fixed || {} }); },
  // Подсказка-путь: для каждого босса — первая по ходу пара из плана (раздел 7).
  hintsFor(L, ordered, plan) {
    const hints = [], seen = new Set();
    for (const e of ordered) {
      if (!e.armored || seen.has(e.card)) continue;
      seen.add(e.card);
      const mode = Learner.hintMode(e.card);
      if (mode === "none") continue;
      const mine = plan.filter((p) => p.tag === e.card);
      if (!mine.length) continue;
      // Подсказка — луч первой части разрезания (7 × 5 из 7 × 5 + 7 × 3); порядок лучей вдоль дороги боссу безразличен. Если такой части в плане нет, то первая пара по ходу врага.
      const lane = e.lane || 0, parts = Content.demandsOf(e.card), d = (p) => { const c = L.pairs[Solver.pairKey(p.a, p.b)].cross[lane]; return c === undefined ? 1e9 : c; };
      const first = mine.find((p) => p.number === parts[0]) || mine.slice().sort((x, y) => d(x) - d(y))[0];
      hints.push({ card: e.card, parts, pads: [first.a, first.b], ghost: first.da + " " + TIMES + " " + first.db, mode, lane });
    }
    return hints;
  },
  make(cx) {
    const { land, idx, waveIdx, level: L, rng } = cx, LD = Content.LANDS[land - 1];
    const c2 = { land, idx, rng, s: idx * 3 + waveIdx, level: L }, n = WaveGen.sizeOf(idx, waveIdx, !!cx.easy);
    const kMax = L.template === "T1" ? 3 : 4, compose = land === 5 ? WaveGen.composeDiv : LD.boss.length ? WaveGen.composeBoss : WaveGen.composeNormal;
    const wave = (ordered, plan, fixed) => ({
      idx: waveIdx, easy: !!cx.easy, seed: cx.seed, fixed, hints: WaveGen.hintsFor(L, ordered, plan.plan),
      plan: plan.plan.map((p) => ({ n: p.number, a: p.a, b: p.b, da: p.da, db: p.db, tag: p.tag })),
      enemies: ordered.map((e) => ({ number: e.number, card: e.card, armored: e.armored, lane: e.lane })),
    });
    for (let attempt = 0; attempt < 60; attempt++) {
      const comp = compose(c2, n, kMax, Math.floor(attempt / 10));        // каждые 10 неудач — проще
      const ordered = WaveGen.arrange(comp.list, rng, L.lanes.length, comp.newCard), plan = WaveGen.plan(L, ordered, comp.fixed);
      if (plan.ok) return wave(ordered, plan, comp.fixed);
    }
    // Запасной вариант: одно решаемое число (или одна карточка деления).
    const cards = land === 5 ? LD.cards : Content.tableNumbers().map(Content.cardForNumber);
    for (const key of cards) {
      const fixed = land === 5 ? { A0: Content.cardOf(key).a, A1: 2, A2: 2, A3: 2 } : {};
      const ordered = WaveGen.spread([key], n, false).map((e, i) => Object.assign(e, { lane: i % L.lanes.length })), plan = WaveGen.plan(L, ordered, fixed);
      if (plan.ok) return wave(ordered, plan, fixed);
    }
    throw new Error("WaveGen: нет решаемой волны");
  },
};

/* ---------- 8 Geo: полилинии, пересечения, соседство ---------- */
const Geo = {
  makeLane(id, points) {
    const cum = [0];
    for (let i = 1; i < points.length; i++) cum.push(cum[i - 1] + Util.dist(points[i - 1][0], points[i - 1][1], points[i][0], points[i][1]));
    return { id, points, cum, len: cum[cum.length - 1] };
  },
  prepLane(points) { return Geo.makeLane(0, points); },
  pointAt(lane, d) {
    d = Util.clamp(d, 0, lane.len);
    let i = 0;
    while (i < lane.points.length - 2 && d > lane.cum[i + 1]) i++;
    const p = lane.points[i], q = lane.points[i + 1];
    const sl = lane.cum[i + 1] - lane.cum[i] || 1, t = (d - lane.cum[i]) / sl;
    return { x: p[0] + (q[0] - p[0]) * t, y: p[1] + (q[1] - p[1]) * t, dx: (q[0] - p[0]) / sl, dy: (q[1] - p[1]) / sl };
  },
  // Пересечение отрезков p-q и a-b: {t по p-q, u по a-b} или null.
  segHit(p, q, a, b) {
    const rx = q[0] - p[0], ry = q[1] - p[1], sx = b[0] - a[0], sy = b[1] - a[1];
    const den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((a[0] - p[0]) * sy - (a[1] - p[1]) * sx) / den;
    const u = ((a[0] - p[0]) * ry - (a[1] - p[1]) * rx) / den;
    return t < 0 || t > 1 || u < 0 || u > 1 ? null : { t, u };
  },
  // Первое (по d) пересечение отрезка p-q с дорожкой: {d, t, x, y} или null.
  cross(lane, p, q) {
    let best = null;
    for (let i = 0; i < lane.points.length - 1; i++) {
      const h = Geo.segHit(p, q, lane.points[i], lane.points[i + 1]);
      if (!h) continue;
      const d = lane.cum[i] + h.u * (lane.cum[i + 1] - lane.cum[i]);
      if (!best || d < best.d) best = { d, t: h.t, x: p[0] + (q[0] - p[0]) * h.t, y: p[1] + (q[1] - p[1]) * h.t };
    }
    return best;
  },
  crossD(lane, p, q) { const c = Geo.cross(lane, p, q); return c ? c.d : null; },
  distToLane(lane, x, y) {                       // расстояние от точки до полилинии дорожки
    let best = Infinity;
    for (let i = 0; i < lane.points.length - 1; i++) {
      const ax = lane.points[i][0], ay = lane.points[i][1], dx = lane.points[i + 1][0] - ax, dy = lane.points[i + 1][1] - ay;
      const t = Util.clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      best = Math.min(best, Util.dist(x, y, ax + dx * t, ay + dy * t));
    }
    return best;
  },
  // Для каждой соседней пары: где её луч пересекает каждую дорожку (d) — по этому видно, каких врагов он достанет.
  pairInfo(level) {
    const out = {};
    for (const a of Object.keys(level.adj)) for (const b of level.adj[a]) {
      if (a >= b) continue;
      const pa = Level.pad(level, a), pb = Level.pad(level, b), cross = {};
      for (const ln of level.lanes) { const c = Geo.crossD(ln, [pa.x, pa.y], [pb.x, pb.y]); if (c !== null) cross[ln.id] = c; }
      out[a + "|" + b] = { key: a + "|" + b, a, b, cross };
    }
    return out;
  },
  // Дорожки, сливающиеся в ствол, имеют разную длину ветки. Короткая получает отставание lead: враг стартует с d = −lead,
  // поэтому на стволе враги разных дорожек идут с тем же интервалом, что и при выходе, и не налезают друг на друга.
  leads(lanes) {
    const key = (p) => p[0] + "," + p[1], md = lanes.map(() => 0);
    if (lanes.length > 1) lanes.forEach((ln, k) => {
      const others = lanes.filter((_, j) => j !== k).map((o) => new Set(o.points.map(key)));
      const i = ln.points.findIndex((p) => others.every((set) => set.has(key(p))));
      md[k] = i >= 0 ? ln.cum[i] : 0;
    });
    const top = Math.max(...md);
    lanes.forEach((ln, k) => { ln.lead = top - md[k]; });
  },
  // Соседние площадки: отрезок между центрами пересекает дорожку и короче LINK_MAX. Шаблон может задать links.
  adjacency(level) {
    const adj = {};
    for (const p of level.pads) adj[p.id] = [];
    const tpl = Content.TEMPLATES[level.template];
    if (tpl && tpl.links) {
      for (const id of Object.keys(tpl.links)) adj[id] = tpl.links[id].slice();
      return adj;
    }
    for (let i = 0; i < level.pads.length; i++) for (let j = i + 1; j < level.pads.length; j++) {
      const a = level.pads[i], b = level.pads[j];
      if (Util.dist(a.x, a.y, b.x, b.y) > LINK_MAX) continue;
      if (level.lanes.some((ln) => Geo.crossD(ln, [a.x, a.y], [b.x, b.y]) !== null)) { adj[a.id].push(b.id); adj[b.id].push(a.id); }
    }
    return adj;
  },
};

/* ---------- 9 Level: состояние уровня (простые JSON-объекты) ---------- */
const Level = {
  create(land, idx, templateId) {
    const t = Content.TEMPLATES[templateId || Content.templateFor(land, idx)];
    const L = {
      land, idx, template: t.id, hand: Content.handOf(land),
      lanes: t.lanes.map((pts, i) => Geo.makeLane(i, pts)),
      pads: t.pads.map((p) => Object.assign({ fixed: false }, p)),
      towers: {}, beams: [], enemies: [], queue: [], fx: [],
      spawnT: 0, hearts: HEARTS, wave: null, waveIdx: 0,
      phase: "prep", simT: 0, plaqueT: 0, endT: 0, nextBeamId: 1, nextEnemyId: 1,
      prep: { startMs: 0, lastBuildMs: 0, pairEdits: {}, covered: {} },
      results: [], killedBy: {}, kills: [], bosses: [], adj: null, pairs: null,
    };
    Geo.leads(L.lanes);
    L.adj = Geo.adjacency(L);
    L.pairs = Geo.pairInfo(L);
    return L;
  },
  pad(L, id) { return L.pads.find((p) => p.id === id) || null; },
  snapshot() { return Util.clone(Game.level); },
};

/* ---------- 10 Build: правила стройки (подготовка и пауза) ---------- */
const Build = {
  scale: 1,                                      // масштаб экрана, его ставит Render.resize: радиус ловли 40 CSS px = 40/scale лп
  fail: (reason) => ({ ok: false, reason }),
  editable() { const L = Game.level; return !!L && (L.phase === "prep" || L.phase === "paused"); },
  beamsOf(L, padId) { return L.beams.filter((b) => b.a === padId || b.b === padId); },
  beamBetween(L, a, b) { return L.beams.find((m) => (m.a === a && m.b === b) || (m.a === b && m.b === a)) || null; },
  catchRadius() { return PAD_R + CATCH_CSS / Build.scale; },
  padAt(x, y) {                                  // ближайшая площадка в радиусе ловли или null
    const L = Game.level;
    if (!L) return null;
    let best = null, bd = Build.catchRadius();
    for (const p of L.pads) { const d = Util.dist(x, y, p.x, p.y); if (d <= bd) { bd = d; best = p; } }
    return best;
  },
  _label(b) { return b.da + " " + TIMES + " " + b.db + " = " + b.product; },
  _touchPair(L, a, b) {                          // счёт переделок пары за эту подготовку
    const key = [a, b].sort().join("|");
    L.prep.pairEdits[key] = (L.prep.pairEdits[key] || 0) + 1;
    return L.prep.pairEdits[key] - 1;
  },
  _dropBeam(L, beam) {
    L.beams.splice(L.beams.indexOf(beam), 1);
    Bus.emit("beam_broken", { id: beam.id, product: beam.product });
  },
  place(padId, digit) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pad = Level.pad(L, padId);
    if (!pad) return Build.fail("no_pad");
    if (pad.fixed) return Build.fail("fixed");
    if (!L.hand.includes(digit)) return Build.fail("digit");
    const old = L.towers[padId];
    if (old && old.digit === digit) return { ok: true, pad: padId };
    L.towers[padId] = { pad: padId, digit, fixed: false, skin: "base" };
    if (old) Build._refresh(L, padId);           // смена цифры: подписи лучей пересчитываются сразу
    Bus.emit("tower_placed", { pad: padId, digit });
    return { ok: true, pad: padId };
  },
  _refresh(L, padId) {
    for (const b of Build.beamsOf(L, padId)) {
      const was = b.product;
      b.da = L.towers[b.a].digit; b.db = L.towers[b.b].digit;
      b.product = b.da * b.db; b.label = Build._label(b);
      if (b.product !== was) {
        b.born = L.phase === "paused" ? "pause" : "prep";
        b.rebuilds = Build._touchPair(L, b.a, b.b);
        Bus.emit("beam_broken", { id: b.id, product: was });
        Bus.emit("beam_built", { id: b.id, a: b.a, b: b.b, product: b.product, born: b.born });
      }
    }
  },
  remove(padId) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    if (!Level.pad(L, padId)) return Build.fail("no_pad");
    const t = L.towers[padId];
    if (!t) return Build.fail("empty");
    if (t.fixed) return Build.fail("fixed");
    for (const b of Build.beamsOf(L, padId)) Build._dropBeam(L, b);
    delete L.towers[padId];
    Bus.emit("tower_removed", { pad: padId });
    return { ok: true };
  },
  move(from, to) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pf = Level.pad(L, from), pt = Level.pad(L, to);
    if (!pf || !pt) return Build.fail("no_pad");
    const t = L.towers[from];
    if (!t) return Build.fail("empty");
    if (t.fixed || pt.fixed) return Build.fail("fixed");
    if (from === to) return { ok: true };
    if (L.towers[to]) return Build.fail("occupied");
    for (const b of Build.beamsOf(L, from)) Build._dropBeam(L, b);   // новое место — новые соседи, лучи рвутся
    delete L.towers[from];
    L.towers[to] = { pad: to, digit: t.digit, fixed: false, skin: t.skin };
    Bus.emit("tower_removed", { pad: from });
    Bus.emit("tower_placed", { pad: to, digit: t.digit });
    return { ok: true };
  },
  link(a, b) {                                   // подпись «da × db»: цифра башни a слева
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    const pa = Level.pad(L, a), pb = Level.pad(L, b);
    if (!pa || !pb) return Build.fail("no_pad");
    if (a === b || !L.adj[a].includes(b)) return Build.fail("not_adjacent");
    const ta = L.towers[a], tb = L.towers[b];
    if (!ta || !tb) return Build.fail("empty");
    if (Build.beamBetween(L, a, b)) return Build.fail("occupied");
    if (Build.beamsOf(L, a).length >= 2 || Build.beamsOf(L, b).length >= 2) return Build.fail("max_beams");
    const info = L.pairs[Solver.pairKey(a, b)], cross = info ? Object.assign({}, info.cross) : {};
    if (!Object.keys(cross).length) return Build.fail("not_adjacent");
    const beam = { id: L.nextBeamId++, a, b, da: ta.digit, db: tb.digit, product: ta.digit * tb.digit, label: "", cross, born: L.phase === "paused" ? "pause" : "prep", rebuilds: 0, blinkT: 0 };
    beam.label = Build._label(beam);
    beam.rebuilds = Build._touchPair(L, a, b);
    L.beams.push(beam);
    Bus.emit("beam_built", { id: beam.id, a, b, product: beam.product, born: beam.born });
    return { ok: true, id: beam.id };
  },
  unlink(a, b) {
    const L = Game.level;
    if (!Build.editable()) return Build.fail("phase");
    if (!Level.pad(L, a) || !Level.pad(L, b)) return Build.fail("no_pad");
    const beam = Build.beamBetween(L, a, b);
    if (!beam) return Build.fail("empty");
    Build._dropBeam(L, beam);
    return { ok: true };
  },
  dropDigit(digit, x, y) {                       // отпускание цифры в логической точке
    if (!Build.editable()) return Build.fail("phase");
    if (!Game.level.hand.includes(digit)) return Build.fail("digit");
    const pad = Build.padAt(x, y);
    if (!pad) return Build.fail("no_pad");
    const r = Build.place(pad.id, digit);
    return r.ok ? { ok: true, pad: pad.id } : Object.assign({ pad: pad.id }, r);
  },
};

/* ---------- 11 Rules: что делает луч с врагом (чистая функция) ---------- */
// Обычный враг: p == rem — победа, иначе проходит. Железный: p < rem — число уменьшается, p == rem — победа, p > rem — проходит.
const Rules = {
  apply(enemy, beam) {
    const p = beam.product, rem = enemy.rem;
    if (p === rem) return { kind: "kill", from: rem, to: 0 };
    if (enemy.armored && p < rem) return { kind: "cut", from: rem, to: rem - p };
    return { kind: "miss", from: rem, to: rem };
  },
};

/* ---------- 12 Sim: фиксированный шаг 1/60 с ---------- */
const Sim = {
  speed() { return SPEEDS[Game.settings.speed] || SPEEDS.slow; },
  spawn(L) {
    const q = L.queue.shift();
    const lane = L.lanes[q.lane || 0] || L.lanes[0];
    const e = { id: L.nextEnemyId++, ord: q.ord, card: q.card, number: q.number, rem: q.number, armored: !!q.armored, lane: q.lane || 0, d: -(lane.lead || 0),
      alive: true, outcome: null, hitLog: [], note: null, noteT: 0, cutNote: null, hintBeaten: false, deadT: 0 };
    L.enemies.push(e);
    Bus.emit("enemy_spawn", { id: e.id, number: e.number, armored: e.armored, lane: e.lane });
    return e;
  },
  burst(L, x, y) {                               // 6 звёздочек, без случайности
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2 + 0.3;
      L.fx.push({ x, y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150 - 40, t: 0, life: 0.7, rot: k });
    }
  },
  moveEnemy(L, e, v, dt) {
    const lane = L.lanes[e.lane] || L.lanes[0];
    const d0 = e.d, d1 = d0 + v * dt;
    const hits = [];
    for (const b of L.beams) { const c = b.cross[lane.id]; if (c !== undefined && c > d0 && c <= d1) hits.push({ b, c }); }
    hits.sort((m, n) => m.c - n.c || m.b.id - n.b.id);
    for (const { b, c } of hits) {
      const r = Rules.apply(e, b);
      if (r.kind === "kill") {
        e.alive = false; e.outcome = "killed"; e.d = c; e.deadT = 0; e.rem = 0;
        e.killedBy = { a: b.a, b: b.b, da: b.da, db: b.db, product: b.product };
        if (e.armored) L.bosses.push({ number: e.number, chain: e.hitLog.map((h) => h.product).concat(b.product) });
        else L.kills.push({ number: e.number, da: b.da, db: b.db });
        Bus.emit("enemy_killed", { id: e.id, number: e.number, beam: { a: b.a, b: b.b, da: b.da, db: b.db, product: b.product } });
        const pt = Geo.pointAt(lane, c);
        Sim.burst(L, pt.x, pt.y);
        return;                                  // остальные лучи этого шага пропускаются
      }
      if (r.kind === "cut") {
        e.rem = r.to; e.hitLog.push({ product: b.product, from: r.from, to: r.to });
        e.cutNote = r.from + " " + MINUS + " " + b.product + " = " + r.to;
        e.note = e.cutNote; e.noteT = 0;
        Bus.emit("boss_hit", { id: e.id, from: r.from, to: r.to, product: b.product });
      } else {
        b.blinkT = 0.4;
        e.note = e.rem + ", а луч даёт " + b.product; e.noteT = 1;
        Bus.emit("enemy_passed_beam", { id: e.id, number: e.number, product: b.product, rem: e.rem });
      }
    }
    e.d = d1;
    if (e.d >= lane.len) {
      e.d = lane.len; e.alive = false; e.outcome = "castle";
      L.hearts = Math.max(0, L.hearts - 1);
      Bus.emit("enemy_reached_castle", { id: e.id, number: e.number, hearts: L.hearts });
    }
  },
  timers(L, dt) {                                // надписи, мигание, гибель, звёздочки
    for (const e of L.enemies) {
      if (!e.alive) e.deadT += dt;
      if (e.noteT > 0) { e.noteT -= dt; if (e.noteT <= 0) { e.noteT = 0; e.note = e.cutNote; } }
    }
    for (const b of L.beams) if (b.blinkT > 0) b.blinkT = Math.max(0, b.blinkT - dt);
    for (const f of L.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; }
    if (L.fx.length) L.fx = L.fx.filter((f) => f.t < f.life);
  },
  step(dt) {
    const L = Game.level;
    if (!L) return;
    if (L.phase === "waveEnd" || L.phase === "levelEnd") {
      Sim.timers(L, dt);                         // последний побеждённый враг и звёздочки доигрывают, а не застывают
      if (L.phase === "waveEnd" && L.plaqueT > 0) { L.plaqueT -= dt; if (L.plaqueT <= 0) Game.nextWave(); }   // плашка «Волна отбита» 2 с после паузы 0,6 с
      if (L.phase === "levelEnd" && L.endT > 0) L.endT = Math.max(0, L.endT - dt);                              // экран итогов через 0,6 с
      return;
    }
    if (L.phase !== "battle") return;
    L.simT += dt;
    const v = Sim.speed();
    if (L.queue.length) {                        // (1) появление
      L.spawnT -= dt;
      if (L.spawnT <= 0) { const e = Sim.spawn(L); L.spawnT += (e.armored ? GAP_BOSS : GAP) / v; }
    }
    for (const e of L.enemies) if (e.alive) Sim.moveEnemy(L, e, v, dt);   // (2) движение, лучи, крепость
    Sim.timers(L, dt);                           // (3) таймеры
    if (!L.queue.length && !L.enemies.some((e) => e.alive)) Game.endWave();   // (4) конец волны
  },
};

/* ---------- 13 Game: фазы prep → battle ⇄ paused → waveEnd → (prep | levelEnd); экраны title, map, game ---------- */
const Game = {
  level: null, screen: "title", manual: false, seed: 1, waveCounter: 0, cur: 1,
  settings: { speed: "slow", perDay: 5, sound: true, big: false },
  progress: { stars: {} },                       // лучший результат по уровням, ключ «земля-уровень»; этап 3 переносит в Store
  startLevel(land, idx) {
    if (!Content.LANDS[land - 1] || !(idx >= 0 && idx < 5)) return Build.fail("no_level");
    if (!Learner.landOpen(land)) return Build.fail("locked");
    Game.level = Level.create(land, idx);
    Game.screen = "game"; Game.cur = land;
    Game.startPrep();
    return { ok: true };
  },
  toTitle() { Game.level = null; Game.screen = "title"; },
  toMap() { Game.level = null; Game.screen = "map"; },
  newWave() {
    const L = Game.level;
    return WaveGen.make({ land: L.land, idx: L.idx, waveIdx: L.waveIdx, level: L, seed: Game.seed + Game.waveCounter, rng: Util.rng(Game.seed + Game.waveCounter++) });
  },
  startPrep() {                                  // подготовка: симуляция стоит, таймера нет
    const L = Game.level;
    L.phase = "prep"; L.plaqueT = 0; L.endT = 0;
    L.prep = { startMs: Clock.nowMs(), lastBuildMs: Clock.nowMs(), pairEdits: {}, covered: {} };
    Game.loadWave(Game.newWave());
  },
  loadWave(wave) {                               // подменяет волну текущей подготовки (OT.setWave тоже)
    const L = Game.level;
    L.wave = wave;
    L.queue = wave.enemies.map((e, i) => Object.assign({ ord: i }, e));
    L.enemies = []; L.fx = []; L.spawnT = 0;
    if (L.land === 5) {                          // земля деления: свободные башни и все лучи снимаются перед каждой волной
      for (const b of L.beams.slice()) Build._dropBeam(L, b);
      for (const id of Object.keys(L.towers)) delete L.towers[id];
      for (const p of L.pads) p.fixed = false;
    } else {
      for (const p of L.pads) if (p.fixed) { p.fixed = false; delete L.towers[p.id]; }   // старые заранее стоящие башни уходят
      for (const b of L.beams.slice()) if (!L.towers[b.a] || !L.towers[b.b]) Build._dropBeam(L, b);
    }
    for (const id of Object.keys(wave.fixed || {})) {   // новые цифры заранее стоящих башен
      const pad = Level.pad(L, id);
      if (!pad) continue;
      pad.fixed = true;
      L.towers[id] = { pad: id, digit: wave.fixed[id], fixed: true, skin: "base" };
      Build._refresh(L, id);
    }
  },
  startWave() {                                  // кнопка «В бой!»
    const L = Game.level;
    if (!L || L.phase !== "prep") return Build.fail("phase");
    L.phase = "battle"; L.spawnT = 0;
    Bus.emit("wave_start", { waveIdx: L.waveIdx, numbers: L.wave.enemies.map((e) => e.number) });
    return { ok: true };
  },
  pause() { const L = Game.level; if (!L || L.phase !== "battle") return Build.fail("phase"); L.phase = "paused"; return { ok: true }; },
  resume() { const L = Game.level; if (!L || L.phase !== "paused") return Build.fail("phase"); L.phase = "battle"; return { ok: true }; },
  endWave() {                                    // зовёт Sim, когда очередь пуста и живых нет
    const L = Game.level;
    const killed = L.enemies.filter((e) => e.outcome === "killed").length, total = L.wave.enemies.length;
    Bus.emit("wave_end", { waveIdx: L.waveIdx, killed, total });   // ещё в бою, поэтому t — время симуляции
    L.phase = "waveEnd";
    L.results.push({ killed, total, passed: total - killed });
    Learner.onWaveEnd({ enemies: L.enemies.map((e) => ({ card: e.card, number: e.number, outcome: e.outcome, killedBy: e.killedBy || null })) });
    Game.onWaveEnd();
  },
  onWaveEnd() {
    const L = Game.level;
    if (L.waveIdx + 1 < WAVES_PER_LEVEL) L.plaqueT = 2.6; else Game.onLevelEnd();   // 0,6 с звёздочки, потом плашка 2 с
  },
  nextWave() { Game.level.waveIdx++; Game.startPrep(); },
  stars(hearts) { return hearts >= 9 ? 3 : hearts >= 6 ? 2 : 1; },
  onLevelEnd() {
    const L = Game.level, stars = Game.stars(L.hearts), key = L.land + "-" + L.idx;
    L.phase = "levelEnd"; L.endT = 0.6;          // экран итогов появляется через 0,6 с после последней победы
    Game.progress.stars[key] = Math.max(Game.progress.stars[key] || 0, stars);
    Bus.emit("level_end", { land: L.land, level: L.idx, hearts: L.hearts, stars });
  },
  // Какой уровень следующий (раздел 8): первый уровень этой земли без 3 звёзд, иначе уровень 0 следующей открытой земли, иначе уровень 0 этой.
  nextLevel(land) {
    const st = Game.progress.stars;
    for (let i = 0; i < 5; i++) if ((st[land + "-" + i] || 0) < 3) return [land, i];
    return land < Content.LANDS.length && Learner.landOpen(land + 1) ? [land + 1, 0] : [land, 0];
  },
  // Итоги уровня: звёзды, подсказки земли, «можно было ещё лучом…» (до трёх строк) и цепочки боссов (до двух).
  endData() {
    const L = Game.level, LD = Content.LANDS[L.land - 1], alts = [], seen = new Set(), chains = [];
    for (const k of L.kills) {
      if (seen.has(k.number)) continue;
      seen.add(k.number);
      const used = Math.min(k.da, k.db) + "x" + Math.max(k.da, k.db);
      const others = Content.pairsOf(k.number, L.hand).filter(([a, b]) => a + "x" + b !== used);
      if (others.length) alts.push(k.number + " можно было победить ещё лучом " + others.map(([a, b]) => a + " " + TIMES + " " + b).join(" или "));
      if (alts.length === 3) break;
    }
    for (const b of L.bosses) {
      const text = b.number + b.chain.map((p) => " " + MINUS + " " + p).join("") + " = 0";
      if (!chains.includes(text) && chains.length < 2) chains.push(text);
    }
    return { stars: Game.stars(L.hearts), hearts: L.hearts, tips: LD.tips, alts, chains };
  },
  ribbon() {                                     // карточки ленты в порядке выхода
    const L = Game.level;
    if (!L || !L.wave) return [];
    return L.wave.enemies.map((w, i) => {
      const e = L.enemies.find((m) => m.ord === i);
      const status = !e ? "wait" : e.alive ? "walk" : e.outcome === "killed" ? "killed" : "castle";
      return { number: w.number, armored: !!w.armored, status };
    });
  },
};

/* ---------- 14 Render: всё, что на canvas (логика 1600x900) ---------- */
// Владеет: масштабом и letterbox, фоном, дорожкой, крепостью, площадками, башнями, лучами, подписями «a × b = c», врагами.
const Render = {
  cv: null, c: null, stage: null, rotate: null, s: 1, dpr: 1, t: 0, reduced: false,
  col: {}, deco: [], decoFor: undefined, shakes: {},
  last: { labels: [], notes: [], hints: [], del: null },   // что нарисовано в последнем кадре (OT.drawn, Input)
  F_NUM: '"Russo One","Nunito",system-ui,sans-serif', F_BODY: '"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  init(canvas) {
    Render.cv = canvas; Render.c = canvas.getContext("2d");
    Render.stage = document.getElementById("stage"); Render.rotate = document.getElementById("rotate");
    const cs = getComputedStyle(document.documentElement);
    const fb = { grass: "#8fcf6a", "grass-2": "#79bb57", path: "#ecd29b", "path-edge": "#c9a66b", stone: "#a7b0bb", "stone-2": "#7d8792", castle: "#d9dee5", roof: "#d65a4a",
      wood: "#a8703f", ink: "#1b2333", paper: "#fffaf0", gold: "#ffc83d", beam: "#ffd23f", "beam-core": "#fff6c8", miss: "#8e949c", hint: "#3b6fd8",
      enemy: "#8a63d2", "enemy-2": "#6c48b3", boss: "#59606d", rivet: "#c8ced6", good: "#2fa36b", bg: "#17324a" };
    for (const k of Object.keys(fb)) Render.col[k] = cs.getPropertyValue("--" + k).trim() || fb[k];
    try { Render.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { Render.reduced = false; }
    Render.makeDeco(null);
    Render.resize();
  },
  // Украшения травы — раз и навсегда на шаблон, без Math.random; не лежат на дорогах и площадках.
  makeDeco(L) {
    Render.deco = []; Render.decoFor = L ? L.template : null;
    const r = Util.rng(7);
    for (let i = 0; i < 160; i++) {
      const x = r.int(10, 1590), y = r.int(125, 775), kind = r.next() < 0.78 ? 0 : 1 + r.int(0, 2), sc = 0.8 + r.next() * 0.6;
      if (x > 1380 && y > 200 && y < 700) continue;
      if (L && (L.lanes.some((ln) => Geo.distToLane(ln, x, y) < 85) || L.pads.some((p) => Util.dist(x, y, p.x, p.y) < 85))) continue;
      if (!L && Math.abs(y - 450) < 85) continue;
      Render.deco.push({ x, y, kind, s: sc });
    }
  },
  resize() {
    const iw = window.innerWidth, ih = window.innerHeight;
    const s = Math.min(iw / W, ih / H);
    Render.s = s; Render.dpr = Math.min(window.devicePixelRatio || 1, 2); Build.scale = s;
    Render.stage.style.transform = "translate(" + ((iw - W * s) / 2) + "px," + ((ih - H * s) / 2) + "px) scale(" + s + ")";
    Render.cv.width = Math.round(W * s * Render.dpr); Render.cv.height = Math.round(H * s * Render.dpr);
    const portrait = iw < ih;
    Render.rotate.hidden = !portrait;
    if (portrait) Game.pause();                  // волна на паузу, пока планшет стоит вертикально
    Render.draw();
  },
  tick(dt) { Render.t += dt; },
  shake(padId) { if (!Render.reduced) Render.shakes[padId] = Render.t + 0.5; },

  // --- мелочи рисования ---
  rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); },
  circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); },
  txt(c, s, x, y, size, fill, stroke, lw, num) {
    c.font = (num ? "400 " : "800 ") + size + "px " + (num ? Render.F_NUM : Render.F_BODY);
    c.textAlign = "center"; c.textBaseline = "middle"; c.lineJoin = "round";
    if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
    c.fillStyle = fill; c.fillText(s, x, y);
  },
  fit(c, s, maxW, size, num) {                   // размер шрифта, при котором строка s помещается в maxW (двух- и трёхзначные числа на щитах)
    c.font = (num ? "400 " : "800 ") + size + "px " + (num ? Render.F_NUM : Render.F_BODY);
    const w = c.measureText(s).width;
    return w > maxW ? Math.max(12, Math.floor((size * maxW) / w)) : size;
  },
  star(c, x, y, r, rot) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + (i * Math.PI) / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    c.closePath();
  },

  // --- фон ---
  ground(c) {
    const k = Render.col;
    c.fillStyle = k.grass; c.fillRect(0, 0, W, H);
    c.globalAlpha = 0.28; c.fillStyle = k["grass-2"];
    for (let x = 0; x < W; x += 220) c.fillRect(x, 0, 110, H);
    c.globalAlpha = 1;
    for (const d of Render.deco) {
      c.save(); c.translate(d.x, d.y); c.scale(d.s, d.s);
      if (d.kind === 0) {                        // кустик
        c.strokeStyle = k["grass-2"]; c.lineWidth = 4; c.lineCap = "round";
        c.beginPath(); c.moveTo(-9, 0); c.lineTo(-12, -13); c.moveTo(0, 0); c.lineTo(0, -17); c.moveTo(9, 0); c.lineTo(12, -13); c.stroke();
      } else {                                   // цветок
        c.fillStyle = ["#fff", "#ffb3c7", "#fff3a3"][d.kind - 1];
        for (let i = 0; i < 5; i++) { Render.circ(c, Math.cos(i * 1.2566) * 7, Math.sin(i * 1.2566) * 7, 5); c.fill(); }
        c.fillStyle = "#f2a31b"; Render.circ(c, 0, 0, 4); c.fill();
      }
      c.restore();
    }
  },
  lanes(c, L) {
    const k = Render.col, paths = L.lanes.map((lane) => {
      const pts = lane.points.map((p) => p.slice()), n = pts.length;
      const dx = pts[n - 1][0] - pts[n - 2][0], dy = pts[n - 1][1] - pts[n - 2][1], dl = Math.hypot(dx, dy) || 1;
      pts.push([pts[n - 1][0] + (dx / dl) * 36, pts[n - 1][1] + (dy / dl) * 36]);   // дорога доходит до стены
      return pts;
    });
    c.lineJoin = "round"; c.lineCap = "butt";
    for (const [col, w] of [[k["path-edge"], 124], [k.path, 108]]) {          // сначала кромки всех дорог, потом заливка: ствол без швов
      for (const pts of paths) {
        c.strokeStyle = col; c.lineWidth = w; c.beginPath();
        pts.forEach((p, i) => (i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])));
        c.stroke();
      }
    }
    for (const lane of L.lanes) {
      c.fillStyle = k["path-edge"]; c.globalAlpha = 0.55;   // камешки
      for (let i = 0, d = 30; d < lane.len; i++, d += 64) {
        const p = Geo.pointAt(lane, d), off = ((i * 37) % 70) - 35;
        c.beginPath(); c.ellipse(p.x, p.y + off, 6 + (i % 3) * 2, 4 + (i % 2) * 2, 0, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
    }
  },
  castle(c) {
    const k = Render.col;
    c.lineJoin = "round";
    // стена с воротами: сюда доходит дорога
    c.fillStyle = k.castle; c.strokeStyle = k.ink; c.lineWidth = 5;
    Render.rr(c, 1432, 340, 156, 220, 14); c.fill(); c.stroke();
    c.strokeStyle = "rgba(27,35,51,.18)"; c.lineWidth = 3;
    for (let y = 372; y < 550; y += 34) { c.beginPath(); c.moveTo(1440, y); c.lineTo(1580, y); c.stroke(); }
    c.fillStyle = "#3a2a1c"; c.strokeStyle = k.ink; c.lineWidth = 5;
    c.beginPath(); c.moveTo(1432, 505); c.lineTo(1432, 440); c.arc(1472, 440, 40, Math.PI, 0); c.lineTo(1512, 505); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = k.wood; c.lineWidth = 6;
    for (const x of [1452, 1472, 1492]) { c.beginPath(); c.moveTo(x, 410); c.lineTo(x, 503); c.stroke(); }
    // две башенки с красными крышами на правых углах стены
    for (const ty of [346, 554]) {
      const up = ty < 450 ? -1 : 1;              // верхняя крыша смотрит вверх, нижняя — вниз
      c.fillStyle = "#c4ccd6"; c.strokeStyle = k.ink; c.lineWidth = 5;
      Render.circ(c, 1540, ty, 42); c.fill(); c.stroke();
      c.fillStyle = k.roof; c.beginPath(); c.moveTo(1494, ty + up * 6); c.lineTo(1540, ty + up * 84); c.lineTo(1586, ty + up * 6); c.closePath(); c.fill(); c.stroke();
    }
    // флаг на верхней крыше
    c.strokeStyle = k.ink; c.lineWidth = 5; c.beginPath(); c.moveTo(1540, 262); c.lineTo(1540, 236); c.stroke();   // ниже панели паузы (она кончается на y = 222)
    c.fillStyle = k.gold; c.beginPath(); c.moveTo(1542, 238); c.lineTo(1580, 248); c.lineTo(1542, 260); c.closePath(); c.fill(); c.stroke();
  },
  pads(c, L) {
    const k = Render.col, sel = Input.sel && L.towers[Input.sel] ? Input.sel : null;
    for (const p of L.pads) {
      const g = c.createRadialGradient(p.x - 12, p.y - 14, 6, p.x, p.y, PAD_R);
      if (p.fixed) { g.addColorStop(0, "#69727d"); g.addColorStop(1, "#3f464f"); } else { g.addColorStop(0, "#c6ccd4"); g.addColorStop(1, k["stone-2"]); }
      c.fillStyle = g; c.strokeStyle = k.ink; c.lineWidth = 5;
      Render.circ(c, p.x, p.y, PAD_R); c.fill(); c.stroke();
      c.strokeStyle = "rgba(255,255,255,.4)"; c.lineWidth = 3; Render.circ(c, p.x, p.y, PAD_R - 10); c.stroke();
      if (p.fixed && !L.towers[p.id]) { /* пустой замок не бывает */ }
      if (sel && L.adj[sel].includes(p.id)) {    // соседи выбранной башни
        c.save(); c.setLineDash([14, 10]); c.strokeStyle = k.gold; c.lineWidth = 6; Render.circ(c, p.x, p.y, PAD_R + 12); c.stroke(); c.restore();
      }
    }
  },
  tower(c, x, y, digit, o) {
    const k = Render.col; o = o || {};
    c.save(); c.globalAlpha = o.alpha === undefined ? 1 : o.alpha; c.translate(x, y); if (o.scale) c.scale(o.scale, o.scale);
    c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(0, 8, 48, 40, 0, 0, Math.PI * 2); c.fill();
    c.lineJoin = "round"; c.strokeStyle = k.ink; c.fillStyle = k["stone-2"]; c.lineWidth = 3;
    for (let i = 0; i < 10; i++) { c.save(); c.rotate((i * Math.PI) / 5); Render.rr(c, -8, -53, 16, 14, 3); c.fill(); c.stroke(); c.restore(); }
    c.lineWidth = 4; c.fillStyle = k.stone; Render.circ(c, 0, 0, 43); c.fill(); c.stroke();
    const g = c.createRadialGradient(-10, -12, 4, 0, 0, 34);
    if (o.fixed) { g.addColorStop(0, "#9aa3ae"); g.addColorStop(1, "#5d6671"); } else { g.addColorStop(0, "#c9915a"); g.addColorStop(1, k.wood); }   // заранее стоящая — каменная
    c.fillStyle = g; Render.circ(c, 0, 0, 34); c.fill(); c.stroke();
    c.strokeStyle = "rgba(27,35,51,.28)"; c.lineWidth = 3;
    for (const yy of [-14, 14]) { c.beginPath(); c.moveTo(-Math.sqrt(34 * 34 - yy * yy) + 3, yy); c.lineTo(Math.sqrt(34 * 34 - yy * yy) - 3, yy); c.stroke(); }
    Render.txt(c, String(digit), 0, 3, Render.fit(c, String(digit), 58, 56, true), "#fff", k.ink, 6, true);
    c.restore();
  },
  towers(c, L) {
    const k = Render.col, dragFrom = Input.drag && Input.drag.kind === "tower" ? Input.drag.from : null;
    for (const p of L.pads) {
      const t = L.towers[p.id];
      if (!t) continue;
      let dx = 0; const u = Render.shakes[p.id];
      if (u && u > Render.t) dx = Math.sin((u - Render.t) * 28) * 7 * ((u - Render.t) / 0.5);
      Render.tower(c, p.x + dx, p.y, t.digit, { alpha: dragFrom === p.id ? 0.3 : 1, fixed: t.fixed });
      if (t.fixed) {                             // замочек
        const lx = p.x + dx + 20, ly = p.y + 14;
        c.fillStyle = k.gold; c.strokeStyle = k.ink; c.lineWidth = 3.5;
        c.beginPath(); c.arc(lx + 15, ly + 2, 9, Math.PI, 0); c.stroke();
        Render.rr(c, lx, ly, 30, 24, 6); c.fill(); c.stroke();
        c.fillStyle = k.ink; Render.circ(c, lx + 15, ly + 12, 3.4); c.fill();
      }
      if (Input.sel === p.id) {                  // выбранная — золотое кольцо
        c.strokeStyle = k.gold; c.lineWidth = 8; Render.circ(c, p.x, p.y, PAD_R + 12); c.stroke();
      }
    }
  },
  crossPoint(L, b) {                             // где луч пересекает ось дорожки
    const pa = Level.pad(L, b.a), pb = Level.pad(L, b.b);
    for (const ln of L.lanes) { const h = Geo.cross(ln, [pa.x, pa.y], [pb.x, pb.y]); if (h) return h; }
    return { x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2 };
  },
  beams(c, L) {
    const k = Render.col;
    for (const b of L.beams) {
      const pa = Level.pad(L, b.a), pb = Level.pad(L, b.b), gray = b.blinkT > 0;
      c.lineCap = "round";
      c.strokeStyle = gray ? k.miss : k.beam; c.lineWidth = 10;
      c.beginPath(); c.moveTo(pa.x, pa.y); c.lineTo(pb.x, pb.y); c.stroke();
      c.save(); c.setLineDash([18, 18]); c.lineDashOffset = Render.reduced ? 0 : -Render.t * 18;   // 0,5 периода в секунду
      c.strokeStyle = gray ? "#d0d4d9" : k["beam-core"]; c.lineWidth = 4;
      c.beginPath(); c.moveTo(pa.x, pa.y); c.lineTo(pb.x, pb.y); c.stroke(); c.restore();
      const cp = Render.crossPoint(L, b);        // кольцо там, где луч режет дорогу
      c.strokeStyle = gray ? k.miss : k.beam; c.lineWidth = 5; Render.circ(c, cp.x, cp.y, 14); c.stroke();
    }
  },
  enemy(c, L, e, last) {
    const k = Render.col, lane = L.lanes[e.lane] || L.lanes[0], pt = Geo.pointAt(lane, e.d);
    let sc = 1;
    if (!e.alive) { if (e.outcome !== "killed" || e.deadT >= 0.3) return; sc = 1 - e.deadT / 0.3; }
    const R = e.armored ? 40 : 30, bob = Render.reduced ? 0 : Math.sin(L.simT * 5 + e.id * 1.3) * 3;
    c.save(); c.translate(pt.x, pt.y + bob); c.scale(sc, sc); c.lineJoin = "round";
    c.fillStyle = "rgba(0,0,0,.2)"; c.beginPath(); c.ellipse(0, R - 2, R * 0.9, 9, 0, 0, Math.PI * 2); c.fill();
    if (!e.armored) {
      for (const pass of [0, 1]) {               // пушистая клякса: сначала обводка, потом заливка
        c.fillStyle = pass ? k.enemy : k.ink;
        const grow = pass ? 0 : 3.5;
        Render.circ(c, 0, 0, R - 2 + grow); c.fill();
        for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; Render.circ(c, Math.cos(a) * (R - 4), Math.sin(a) * (R - 4), 7 + grow); c.fill(); }
      }
      const g = c.createRadialGradient(-8, -10, 4, 0, 0, R); g.addColorStop(0, "rgba(255,255,255,.22)"); g.addColorStop(1, "rgba(0,0,0,.18)");
      c.fillStyle = g; Render.circ(c, 0, 0, R - 2); c.fill();
      c.fillStyle = "#fff"; c.strokeStyle = k.ink; c.lineWidth = 3;
      for (const ex of [-10, 9]) { Render.circ(c, ex, -13, 7.5); c.fill(); c.stroke(); c.fillStyle = k.ink; Render.circ(c, ex + 2.5, -12, 3.6); c.fill(); c.fillStyle = "#fff"; }
      c.strokeStyle = k.ink; c.lineWidth = 3; c.beginPath(); c.arc(-1, -3, 6, 0.2, Math.PI - 0.2); c.stroke();
      c.fillStyle = "#fff"; c.strokeStyle = k.ink; c.lineWidth = 4;          // круглый щит R 30
      Render.circ(c, 6, 14, 30); c.fill(); c.stroke();
      c.strokeStyle = k["enemy-2"]; c.lineWidth = 3; Render.circ(c, 6, 14, 25); c.stroke();
      Render.txt(c, String(e.rem), 6, 15, Render.fit(c, String(e.rem), 42, 34, true), k.ink, null, 0, true);   // двух- и трёхзначные числа сжимаются, чтобы войти
    } else {
      c.fillStyle = k.boss; c.strokeStyle = k.ink; c.lineWidth = 5;           // железный: шлем и квадратный клёпаный щит
      Render.circ(c, 0, 0, R - 2); c.fill(); c.stroke();
      c.fillStyle = "#3d434e"; c.beginPath(); c.arc(0, -4, R - 1, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = k.roof; Render.rr(c, -5, -R - 12, 10, 18, 3); c.fill(); c.stroke();
      c.fillStyle = "#ffd23f"; for (const ex of [-12, 12]) { Render.circ(c, ex, 6, 5.5); c.fill(); }
      c.fillStyle = "#e8ecf1"; c.strokeStyle = k.ink; c.lineWidth = 4;
      Render.rr(c, -26, 8, 64, 58, 10); c.fill(); c.stroke();
      c.fillStyle = k.rivet; c.lineWidth = 2.5;
      for (const [rx, ry] of [[-18, 16], [30, 16], [-18, 58], [30, 58]]) { Render.circ(c, rx + 0, ry, 4.2); c.fill(); c.stroke(); }
      Render.txt(c, String(e.rem), 6, 38, Render.fit(c, String(e.rem), 54, 38, true), k.ink, null, 0, true);
    }
    c.restore();
    if (e.alive && e.note) {                     // «56, а луч даёт 42» уходит вверх; «56 − 35 = 21» висит
      const sticky = e.noteT <= 0, rise = sticky ? 0 : 20 * (1 - e.noteT);
      c.font = "800 30px " + Render.F_BODY;
      const w = c.measureText(e.note).width + 30, h = 44, busy = last.labels.concat(last.notes);
      // Место для надписи: над врагом; если там подпись луча или чужая надпись — под щитом, затем выше и ниже шагами по 50 лп
      // и в стороны. Берётся вариант без наложений, ближайший к «над врагом».
      const cy = (v) => Util.clamp(v, FIELD_TOP + h / 2 + 2, FIELD_BOTTOM - h / 2 - 2), cxx = (v) => Util.clamp(v, w / 2 + 8, W - w / 2 - 8);
      const area = (a, o) => Math.max(0, Math.min(a.x + a.w, o.x + o.w) - Math.max(a.x, o.x) + 8) * Math.max(0, Math.min(a.y + a.h, o.y + o.h) - Math.max(a.y, o.y) + 8);
      const up = pt.y - R - (sticky ? 52 : 26) - rise, down = pt.y + (e.armored ? 66 : 41) + 30 + (sticky ? 0 : 20 - rise);
      let x = cxx(pt.x), y = cy(up), bs = Infinity;
      for (const dx of [0, w / 2 + 40, -(w / 2 + 40)]) for (const [base, dir] of [[up, -1], [down, 1]]) for (let st = 0; st < 7; st++) {
        const bx = cxx(pt.x + dx), by = cy(base + dir * st * 50), bb = { x: bx - w / 2, y: by - h / 2, w, h };
        const score = busy.reduce((m, o) => m + (Render.overlap(bb, o, 4) ? area(bb, o) : 0), 0) * 100 + Math.abs(dx) * 0.4 + st * 6 + (dir > 0 ? 3 : 0);
        if (score < bs) { bs = score; x = bx; y = by; }
      }
      if (sticky) {
        c.fillStyle = k.paper; c.strokeStyle = k.ink; c.lineWidth = 4;
        Render.rr(c, x - w / 2, y - 22, w, 44, 12); c.fill(); c.stroke();
        Render.txt(c, e.note, x, y + 1, 30, k.ink, null, 0, false);
      } else {
        Render.txt(c, e.note, x, y, 30, "#fff", k.ink, 7, false);
      }
      last.notes.push({ enemyId: e.id, text: e.note, x: x - w / 2, y: y - h / 2, w, h });
    }
  },
  enemies(c, L, last) {
    const list = L.enemies.slice().sort((a, b) => a.d - b.d);
    for (const e of list) Render.enemy(c, L, e, last);
  },
  fx(c, L) {
    for (const f of L.fx) {
      c.globalAlpha = Math.max(0, 1 - f.t / f.life);
      c.fillStyle = Render.col.gold; c.strokeStyle = Render.col.ink; c.lineWidth = 3;
      Render.star(c, f.x, f.y, 13, f.rot + f.t * 4); c.fill(); c.stroke();
    }
    c.globalAlpha = 1;
  },

  overlap: (a, b, m) => a.x < b.x + b.w + m && b.x < a.x + a.w + m && a.y < b.y + b.h + m && b.y < a.y + a.h + m,

  // --- подписи «a × b = c» ---
  // Место для плашки пары площадок a–b: на луче в 95 лп от оси дороги к верхнему концу; если занято или плашка касается дороги, к нижнему;
  // затем сдвиг наружу по лучу шагами по 20 лп (до 3). Если и так не вышло, перебираем ещё расстояния (60…200), и только потом «как есть».
  spot(L, a, b, w, h, placed) {
    const pa = Level.pad(L, a), pb = Level.pad(L, b), C = Render.crossPoint(L, { a, b });
    const top = pa.y <= pb.y ? pa : pb, bot = top === pa ? pb : pa;
    const ut = [top.x - C.x, top.y - C.y], ub = [bot.x - C.x, bot.y - C.y];
    const lt = Math.hypot(ut[0], ut[1]) || 1, lb = Math.hypot(ub[0], ub[1]) || 1;
    const at = (u, l, dist) => ({ x: Util.clamp(C.x + (u[0] / l) * dist - w / 2, 8, W - 8 - w), y: Util.clamp(C.y + (u[1] / l) * dist - h / 2, FIELD_TOP + 8, FIELD_BOTTOM - 8 - h), w, h });
    const cands = [];
    for (let i = 0; i <= 3; i++) { cands.push(at(ut, lt, 95 + 20 * i)); cands.push(at(ub, lb, 95 + 20 * i)); }
    for (const dd of [75, 60, 175, 200]) { cands.push(at(ut, lt, dd)); cands.push(at(ub, lb, dd)); }
    // Из кандидатов берётся лучший по штрафу: наложение на другие плашки недопустимо (пока есть выбор), затем башни, затем кромка дороги.
    const towers = L.pads.filter((p) => L.towers[p.id]);
    const towerHit = (q, p) => {                 // цифра башни (диск 36 лп) не закрывается совсем, кромка (до 52 лп) — в крайнем случае
      const dx = Math.max(q.x - p.x, 0, p.x - (q.x + q.w)), dy = Math.max(q.y - p.y, 0, p.y - (q.y + q.h)), d = Math.hypot(dx, dy);
      return d < 36 ? 5000 + (36 - d) * 50 : d < 52 ? (52 - d) * 12 : 0;
    };
    const roadHits = (q) => {                    // сколько из 9 точек плашки ближе 66 лп к оси дороги (кромка 62 + 4)
      let n = 0;
      for (const fx of [0, 0.5, 1]) for (const fy of [0, 0.5, 1]) {
        const x = q.x + q.w * fx, y = q.y + q.h * fy;
        if (L.lanes.some((ln) => Geo.distToLane(ln, x, y) < 66)) n++;
      }
      return n;
    };
    let best = cands[0], bs = Infinity;
    cands.forEach((q, i) => {
      const score = (placed.some((o) => Render.overlap(q, o, 6)) ? 1e6 : 0) + roadHits(q) * 100 + towers.reduce((m, p) => m + towerHit(q, p), 0) + i;
      if (score < bs) { bs = score; best = q; }
    });
    return best;
  },
  labels(c, L, last) {
    const placed = [];
    c.font = "400 34px " + Render.F_NUM;
    for (const b of L.beams.slice().sort((m, n) => m.id - n.id)) {
      const r = Render.spot(L, b.a, b.b, Math.ceil(c.measureText(b.label).width) + 30, 54, placed);
      placed.push(r);
      last.labels.push({ beamId: b.id, text: b.label, x: r.x, y: r.y, w: r.w, h: r.h });
    }
    if (L.phase !== "prep" && L.phase !== "paused") return;
    for (const hn of (L.wave && L.wave.hints) || []) {   // подсказка-путь: пунктир и призрак «7 × 5», пока на паре нет луча
      if (hn.mode === "none" || Build.beamBetween(L, hn.pads[0], hn.pads[1])) continue;
      const e = { card: hn.card, pads: hn.pads.slice(), mode: hn.mode, ghost: hn.mode === "full" ? hn.ghost : null };
      if (e.ghost) {
        const r = Render.spot(L, hn.pads[0], hn.pads[1], Math.ceil(c.measureText(e.ghost).width) + 30, 54, placed);
        placed.push(r); Object.assign(e, { x: r.x, y: r.y, w: r.w, h: r.h });
      }
      last.hints.push(e);
    }
  },
  hintPaths(c, L, last) {                        // пунктир между площадками подсказки (штрих 18/12, без мигания)
    c.save(); c.setLineDash([18, 12]); c.lineCap = "butt"; c.strokeStyle = Render.col.hint; c.lineWidth = 8;
    for (const h of last.hints) {
      const pa = Level.pad(L, h.pads[0]), pb = Level.pad(L, h.pads[1]);
      c.beginPath(); c.moveTo(pa.x, pa.y); c.lineTo(pb.x, pb.y); c.stroke();
    }
    c.restore();
  },
  drawLabels(c, last) {                          // рисуются поверх всего, кроме призрака; раскладка уже в last.labels
    const k = Render.col;
    for (const h of last.hints) {                // бледная призрачная подпись без ответа
      if (!h.ghost) continue;
      c.save(); c.globalAlpha = 0.72; c.fillStyle = k.paper; c.strokeStyle = k.hint; c.lineWidth = 4; c.setLineDash([10, 8]);
      Render.rr(c, h.x, h.y, h.w, h.h, 14); c.fill(); c.stroke(); c.setLineDash([]);
      Render.txt(c, h.ghost, h.x + h.w / 2, h.y + h.h / 2 + 2, 34, k.hint, null, 0, true);
      c.restore();
    }
    for (const r of last.labels) {
      c.fillStyle = k.paper; c.strokeStyle = k.gold; c.lineWidth = 5;
      Render.rr(c, r.x, r.y, r.w, r.h, 14); c.fill(); c.stroke();
