<title>Оборона таблицы</title>

<style>
/* Оборона таблицы: светлое солнечное поле на тёмной «ночной» оболочке (как арена). Поле рисуется на canvas, полосы и кнопки — DOM. */
:root {
  --bg: #0e1d27;
  --panel: #16303d;
  --panel-2: #1d3b4a;
  --line: #2a4d5d;
  --ink: #f2f6ee;
  --muted: #9db3bc;
  --gold: #ffc83d;
  --gold-ink: #2a1d00;
  --good: #5ddc8c;
  --bad: #ff6f61;
  --b0: #2a4d5d; --b1: #ff6f61; --b2: #ff9f4a; --b3: #ffd24a; --b4: #9be27a; --b5: #43c97a;
  --grass-1: #8fd16f; --grass-2: #7cc160;
  --path: #efd49a; --path-edge: #c9a467; --path-a: #6fc3ff; --path-b: #ff9f4a;
  --pad: #d9d2c3; --pad-ring: #9c917c;
  --wood: #b57a4c; --stone: #8e98a6; --roof: #e76f51;
  --beam: #ffd54f; --beam-core: #fffbe6; --beam-grey: #b8c0c8; --beam-hit: #ffa94d;
  --enemy: #8e6cd8; --boss: #5f4b8b; --armor: #9aa8b5;
  --shield: #ffffff; --ink-dark: #1d2b3a;

  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bar-h: 76px;
  --hand-h: 92px;
  --tile: 76px;
  --card: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; }
body { color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--grass-2); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.gone { visibility: hidden !important; pointer-events: none !important; }

/* Кнопки */
.btn { min-height: 64px; padding: 0 26px; border-radius: 18px; border: 3px solid transparent; font-family: var(--f-display); font-size: 22px; letter-spacing: .01em; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 5px 0 #b98a14; }
.btn.gold:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a14; }
.btn.ghost { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
.btn.ghost:active { background: var(--line); }
.btn.round { width: 56px; min-height: 56px; height: 56px; padding: 0; border-radius: 50%; flex: none; }
.btn.round svg { width: 30px; height: 30px; }

/* Верхняя полоса */
#bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar-h); z-index: 5; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel); border-bottom: 2px solid var(--line); }
#hearts { display: flex; align-items: center; gap: 8px; flex: none; }
#hearts svg { width: 38px; height: 36px; transition: opacity .6s; }
#hearts b { font-family: var(--f-display); font-weight: 400; font-size: 30px; min-width: 2ch; font-variant-numeric: tabular-nums; }
#waveNo { flex: none; font-family: var(--f-display); font-size: 19px; color: var(--ink); white-space: nowrap; }
#ribbon { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; }
.rtitle { flex: none; width: 82px; font-weight: 800; font-size: 15px; line-height: 1.1; color: var(--muted); }
.cards { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; padding: 4px 2px; }
.card { position: relative; flex: none; width: var(--card); height: var(--card); display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); border: 3px solid var(--line); font-family: var(--f-display); font-size: calc(var(--card) * .42); line-height: 1; transition: opacity .3s; }
.card.boss { border: 6px double var(--armor); }
.card.boss::before { content: ""; position: absolute; left: 50%; top: -11px; width: 24px; height: 12px; margin-left: -12px; background: var(--armor); border: 2px solid var(--ink-dark); border-bottom: 0; border-radius: 12px 12px 0 0; }
.card.walk { opacity: .45; }
.card.won { border-color: var(--good); }
.card.won::after { content: "✓"; position: absolute; right: 1px; top: -3px; color: var(--good); font: 800 calc(var(--card) * .38) var(--f-body); text-shadow: 0 0 3px var(--panel); }
.card.gate { opacity: .5; }
.card.gate::after { content: ""; position: absolute; right: 3px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--armor); }

/* Рука */
#hand { position: fixed; left: 0; right: 0; bottom: 0; height: var(--hand-h); z-index: 5; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-top: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#tiles { flex: 1 1 auto; display: flex; justify-content: center; gap: 6px; min-width: 0; }
.tile { position: relative; flex: none; width: var(--tile); height: var(--tile); padding: 0; border-radius: 16px; background: var(--panel-2); border: 3px solid var(--line); overflow: hidden; font-family: var(--f-display); font-size: calc(var(--tile) * .5); line-height: 1; color: var(--ink); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: grid; place-items: center; padding-top: 8px; }
.tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--c, var(--gold)); }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
#hand.off .tile { opacity: .45; pointer-events: none; }
#fightBtn { flex: none; width: 190px; }

/* Плашки: пауза, конец волны, тост */
.dock { position: fixed; left: 50%; bottom: calc(var(--hand-h) + 8px); transform: translateX(-50%); z-index: 8; display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-radius: 22px; background: var(--panel); border: 3px solid var(--line); box-shadow: 0 8px 0 rgba(0,0,0,.25); }
#pauseOv { width: min(540px, 96vw); }
#endCard { width: min(660px, 96vw); }
.dock .txt { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.dock .txt b { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.dock .txt span { color: var(--muted); font-weight: 700; font-size: 16px; }
.dock .btn { flex: none; }
#toast { position: fixed; left: 50%; bottom: calc(var(--hand-h) + 8px); transform: translateX(-50%); z-index: 9; max-width: 94vw; padding: 14px 26px; border-radius: 22px; background: var(--panel-2); border: 3px solid var(--gold); font-family: var(--f-display); font-size: 30px; line-height: 1.15; text-align: center; pointer-events: none; }
#toast[hidden] { display: none; }
#ghost { position: fixed; left: 0; top: 0; z-index: 20; width: var(--tile); height: var(--tile); pointer-events: none; margin: 0; }
#ghost[hidden] { display: none; }
#ghost.tile { cursor: grabbing; transform: scale(1.1); box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: .95; }
</style>

</div>
<script>
(function () {
"use strict";

/* ======================================================================
   1. CONST — размеры поля, время, цвета
   ====================================================================== */
const VERSION = "0.1.0";
const DT = 1000 / 60;                       // фиксированный шаг симуляции, мс
const FIELD_W = 1600, FIELD_H = 900;        // поле в условных единицах
const PATH_HALF = 40, PAD_R = 44, TOWER_R = 40, ENEMY_R = 34, BOSS_R = 48;
const LABEL_BAND = 85, LABEL_FONT = 40, PLATE_PAD_X = 14, FORT_R = 70, MAX_BEAMS = 2;
const CATCH_PX = 40, TOWER_TOUCH_PX = 16, DRAG_PX = 12;   // радиусы касания в px
const SPEEDS = { slow: 35, normal: 50, fast: 65 };         // ед./с
const TM = { spark: 400, pass: 1000, reduce: 1500, gate: 2000, knock: 600, grey: 600, hit: 400, win: 300, waveEnd: 1500, bossExtra: 1500, refuse: 1000 };
const COLORS = {
  grass1: "#8fd16f", grass2: "#7cc160", bush: "#6aae52", rock: "#b9b2a3",
  path: "#efd49a", pathEdge: "#c9a467", arch: "#3d3550",
  pad: "#d9d2c3", padRing: "#9c917c", wood: "#b57a4c", stone: "#8e98a6", roof: "#e76f51",
  beam: "#ffd54f", beamCore: "#fffbe6", beamGrey: "#b8c0c8", beamHit: "#ffa94d",
  enemy: "#8e6cd8", boss: "#5f4b8b", armor: "#9aa8b5", shield: "#ffffff", ink: "#1d2b3a",
  gold: "#ffc83d", bad: "#ff6f61", plate: "#fffbe6", shadow: "rgba(0,0,0,.18)"

const DIGIT_COLORS = { 2: "#ef5350", 3: "#ff9800", 4: "#f9c80e", 5: "#66bb6a", 6: "#26a69a", 7: "#42a5f5", 8: "#5c6bc0", 9: "#ab47bc", 10: "#ec407a", 20: "#8d6e63", 30: "#78909c", 40: "#00897b" };

/* ======================================================================
   2. CONTENT — цифры, формы слов, раскладки, демонстрационная волна
   ====================================================================== */
const DIGITS = [2, 3, 4, 5, 6, 7, 8, 9];
// Формы для plural: одна / несколько / много
const WORDS = {
  star: ["звезда", "звезды", "звёзд"], enemy: ["враг", "врага", "врагов"], heart: ["сердечко", "сердечка", "сердечек"],
  level: ["уровень", "уровня", "уровней"], wave: ["волна", "волны", "волн"], fact: ["пример", "примера", "примеров"],
  day: ["день", "дня", "дней"], time: ["раз", "раза", "раз"], second: ["секунда", "секунды", "секунд"]
};
const RAW_LAYOUTS = {
  L1: { id: "L1", name: "Тропа", speedMul: 1, fortress: [1510, 300],
    paths: [[[0, 480], [760, 480], [960, 300], [1440, 300]]],
    pads: { A: [120, 315], B: [380, 645], C: [640, 315], D: [960, 135], E: [1220, 465], F: [1480, 135] },
    links: [{ a: "A", b: "B", labelToward: "A" }, { a: "B", b: "C", labelToward: "B" }, { a: "D", b: "E", labelToward: "D" }, { a: "E", b: "F", labelToward: "E" }] },
  L2: { id: "L2", name: "Развилка", speedMul: 1, fortress: [1510, 450],
    paths: [[[0, 270], [560, 270], [880, 450], [1440, 450]], [[0, 630], [560, 630], [880, 450], [1440, 450]]],
    pads: { A: [60, 105], M: [320, 450], C: [580, 105], D: [60, 795], E: [580, 795], G: [1000, 285], H: [1260, 615], P: [1260, 285] },
    links: [{ a: "A", b: "M", labelToward: "M" }, { a: "M", b: "C", labelToward: "C" }, { a: "D", b: "M", labelToward: "M" }, { a: "M", b: "E", labelToward: "E" }, { a: "G", b: "H", labelToward: "G" }, { a: "P", b: "H", labelToward: "H" }] },
  L3: { id: "L3", name: "Серпантин", speedMul: 1.25, fortress: [190, 690],
    paths: [[[0, 215], [1330, 215], [1330, 690], [260, 690]]],
    pads: { A: [120, 50], B: [380, 380], C: [640, 50], D: [900, 380], E: [1150, 525], F: [890, 855], G: [630, 525], H: [370, 855] },
    links: [{ a: "A", b: "B", labelToward: "A" }, { a: "B", b: "C", labelToward: "B" }, { a: "C", b: "D", labelToward: "C" }, { a: "E", b: "F", labelToward: "E" }, { a: "F", b: "G", labelToward: "F" }, { a: "G", b: "H", labelToward: "G" }] },
  L4: { id: "L4", name: "Ворота деления", speedMul: 1, fortress: [1510, 450],
    paths: [[[0, 450], [1440, 450]]],
    pads: { A: [100, 285], B: [360, 615], C: [620, 285], D: [880, 615], E: [1140, 285], F: [1400, 615] },
    links: [{ a: "A", b: "B", labelToward: "A" }, { a: "B", b: "C", labelToward: "B" }, { a: "C", b: "D", labelToward: "C" }, { a: "D", b: "E", labelToward: "D" }, { a: "E", b: "F", labelToward: "E" }] }
};
// Демонстрационная волна этапа 1: решение записано руками (A 8, B 7, C 6, D 8, E 3, F 6)
const DEMO = {
  id: "demo", layout: "L1", hand: DIGITS, fixed: {}, hearts: 10, demo: true,
  waves: [{
    enemies: [24, 56, 18, 42, 24, 56, 42, 18], gap: 3000,
    solution: { pads: { A: 8, B: 7, C: 6, D: 8, E: 3, F: 6 }, beams: [["A", "B"], ["B", "C"], ["D", "E"], ["E", "F"]] }
  }]
};

/* ======================================================================
   3. LOGIC — чистые функции без DOM, Date.now() и Math.random()
   ====================================================================== */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b > 1 && b < 5) return few;
  return many;
}
function word(n, key) { const w = WORDS[key]; return n + " " + plural(n, w[0], w[1], w[2]); }
function factKey(a, b) { return Math.min(a, b) + "x" + Math.max(a, b); }
function parseKey(key) { return String(key).split("x").map(Number); }
function beamLabel(a, b) { return a + " × " + b + " = " + (a * b); }
function uniqSorted(hand) { return Array.from(new Set(hand)).sort((x, y) => x - y); }
function pairsFor(n, hand) {
  const h = uniqSorted(hand || DIGITS), out = [];
  for (let i = 0; i < h.length; i++) for (let j = i; j < h.length; j++) if (h[i] * h[j] === n) out.push([h[i], h[j]]);
  return out;
}
function products(hand) {
  const h = uniqSorted(hand || DIGITS), set = new Set();
  for (let i = 0; i < h.length; i++) for (let j = i; j < h.length; j++) set.add(h[i] * h[j]);
  return set;
}
// Остаток босса можно добить одним или несколькими лучами (сумма произведений руки)
function canFinish(r, hand) {
  if (!(r > 0)) return false;
  const list = Array.from(products(hand)).filter((p) => p <= r);
  const ok = new Array(r + 1).fill(false);
  ok[0] = true;
  for (let i = 1; i <= r; i++) for (const p of list) if (p <= i && ok[i - p]) { ok[i] = true; break; }
  return ok[r];
}
// Удар луча по врагу. enemy = {value, kind}
function hitResult(enemy, product, hand) {
  const v = enemy.value, p = product;
  if (p === v) return { kind: "kill", newValue: 0, text: "" };
  if (enemy.kind === "boss" && p < v) {
    const r = v - p;
    if (canFinish(r, hand || DIGITS)) return { kind: "reduce", newValue: r, text: v + " − " + p + " = " + r };
    return { kind: "pass", newValue: v, text: "Останется " + r + " — такого луча нет" };
  }
  return { kind: "pass", newValue: v, text: v + ", а луч даёт " + p };
}
function starsFor(hearts) { return hearts >= 8 ? 3 : hearts >= 4 ? 2 : 1; }
function confusionKey(v, p) { return Math.min(v, p) + "|" + Math.max(v, p); }

// Геометрия
function segmentIntersection(p1, p2, p3, p4) {
  const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1], d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-12) return null;
  const ex = p3[0] - p1[0], ey = p3[1] - p1[1];
  const u = (ex * d2y - ey * d2x) / den, v = (ex * d1y - ey * d1x) / den, E = 1e-9;
  if (u < -E || u > 1 + E || v < -E || v > 1 + E) return null;
  return { x: p1[0] + u * d1x, y: p1[1] + u * d1y, u, v };
}
function distPointSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  u = Math.max(0, Math.min(1, u));
  return Math.hypot(px - (ax + u * dx), py - (ay + u * dy));
}
function distPointPath(px, py, path) {
  let d = Infinity;
  for (let i = 0; i < path.pts.length - 1; i++) {
    const a = path.pts[i], b = path.pts[i + 1];
    d = Math.min(d, distPointSeg(px, py, a[0], a[1], b[0], b[1]));
  }
  return d;
}
function pointAt(path, t) {
  const d = Math.max(0, Math.min(1, t)) * path.len;
  let i = 0;
  while (i < path.seg.length - 1 && path.cum[i + 1] < d) i++;
  const a = path.pts[i], b = path.pts[i + 1], u = path.seg[i] ? (d - path.cum[i]) / path.seg[i] : 0;
  return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u };
}
function dirAt(path, t) {
  const t0 = Math.max(0, Math.min(t, 0.999) - 0.001), t1 = t0 + 0.002;
  const a = pointAt(path, t0), b = pointAt(path, t1), l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  return { x: (b.x - a.x) / l, y: (b.y - a.y) / l };
}
// Длины отрезков, пересечения связей с дорожками (cross) и точки подписей (labelAt)
function prepareLayout(raw) {
  const paths = raw.paths.map((pts) => {
    const seg = [], cum = [0];
    for (let i = 0; i < pts.length - 1; i++) {
      seg.push(Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]));
      cum.push(cum[i] + seg[i]);
    }
    return { pts, seg, cum, len: cum[cum.length - 1] };
  });
  const pads = Object.keys(raw.pads).map((id) => ({ id, x: raw.pads[id][0], y: raw.pads[id][1] }));
  const padById = {};
  pads.forEach((p) => { padById[p.id] = p; });
  const links = raw.links.map((l) => {
    const A = padById[l.a], B = padById[l.b], cross = [];
    paths.forEach((path, pi) => {
      for (let i = 0; i < path.seg.length; i++) {
        const r = segmentIntersection([A.x, A.y], [B.x, B.y], path.pts[i], path.pts[i + 1]);
        if (!r) continue;
        const t = (path.cum[i] + r.v * path.seg[i]) / path.len;
        if (cross.some((c) => c.path === pi && Math.abs(c.t - t) < 1e-9)) continue;
        cross.push({ path: pi, t, x: r.x, y: r.y });
      }
    });
    cross.sort((p, q) => p.path - q.path || p.t - q.t);
    let labelAt = null;
    if (cross.length) {

}

    else if (name === "fight") { tone(523, 0, 0.1, "triangle", 0.15); tone(659, 0.1, 0.1, "triangle", 0.15); tone(784, 0.2, 0.14, "triangle", 0.15); }
  }
  return { unlock, play };
})();

let uiSig = "", evOwner = null, evSeen = 0, tmpToast = null;
function buildTiles() {
  els.tiles.textContent = "";
  G.hand.forEach((v) => {
    const b = document.createElement("button");
    b.className = "tile"; b.type = "button"; b.dataset.v = String(v); b.textContent = String(v);
    b.setAttribute("aria-label", "Башня " + v);
    b.style.setProperty("--c", DIGIT_COLORS[v] || "#ffc83d");
    els.tiles.appendChild(b);
  });
  layoutHand();
  uiSig = "";
}
function layoutHand() {
  const n = Math.max(1, G ? G.hand.length : 8);
  const size = Math.max(56, Math.min(76, Math.floor((VIEW.W - 200 - 6 * (n - 1)) / n), VIEW.handH - 10));
  document.documentElement.style.setProperty("--tile", size + "px");
}
function layoutRibbon() {                                  // карточки 60–72 px; если врагов много — сжимаются, заголовок уступает место
  const n = Math.max(1, els.cards.children.length), prep = G.phase === "prep";
  const fit = (titleW) => Math.floor((els.ribbon.clientWidth - titleW - 8 - (n - 1) * 6) / n);
  els.rtitle.style.display = prep ? "" : "none";
  let size = fit(prep ? 92 : 0);
  if (prep && size < 44) { els.rtitle.style.display = "none"; size = fit(0); }
  document.documentElement.style.setProperty("--card", Math.max(34, Math.min(72, VIEW.barH - 12, size)) + "px");
}
function showToast(text, ms) { tmpToast = { text, until: performance.now() + (ms || 2500) }; }
function playNewEvents() {
  if (evOwner !== G) { evOwner = G; evSeen = 0; }
  for (; evSeen < G.events.length; evSeen++) AudioFX.play(G.events[evSeen].type);
}
function syncUI() {
  playNewEvents();
  if (SEL.tower && !G.towers[SEL.tower]) SEL.tower = null;
  if (SEL.beam && !G.beams.some((b) => b.id === SEL.beam)) SEL.beam = null;
  if (SEL.tile != null && !canEdit()) SEL.tile = null;
  const phase = G.phase, edit = canEdit();
  const tmp = tmpToast && performance.now() < tmpToast.until ? tmpToast.text : "";
  const toast = phase === "waveEnd" ? G.toast : tmp;
  const key = [G.id, phase, G.paused, G.hearts, G.waveIndex, G.waves.length, G.ribbon.map((r) => r.status[0]).join(""), SEL.tile, settings.sound, toast, VIEW.W, VIEW.H].join("|");
  if (key === uiSig) return;
  uiSig = key;
  els.heartNum.textContent = G.hearts;
  els.heartIcon.style.opacity = String(G.maxHearts ? 0.3 + 0.7 * (G.hearts / G.maxHearts) : 1);
  els.waveNo.textContent = "Волна " + (G.waveIndex + 1) + " из " + G.waves.length;
  els.cards.textContent = "";
  G.ribbon.forEach((r) => {
    const c = document.createElement("div");
    c.className = "card " + (r.kind === "boss" ? "boss " : "") + r.status;
    c.textContent = String(r.value);
    els.cards.appendChild(c);
  });
  layoutRibbon();
  els.pauseBtn.classList.toggle("gone", !(phase === "battle" && !G.paused));
  els.fightBtn.classList.toggle("gone", phase !== "prep");
  els.hand.classList.toggle("off", !edit);
  Array.prototype.forEach.call(els.tiles.children, (t) => t.classList.toggle("sel", SEL.tile != null && Number(t.dataset.v) === SEL.tile));
  els.pauseOv.classList.toggle("gone", !(phase === "battle" && G.paused));
  els.endCard.classList.toggle("gone", phase !== "levelEnd");
  if (phase === "levelEnd" && G.result) {
    els.endTitle.textContent = G.result.text;
    els.endSub.textContent = "Сохранено " + word(G.result.hearts, "heart") + " из " + G.maxHearts;
  }
  els.toast.hidden = !toast;
  els.toast.textContent = toast;
  els.soundBtn.setAttribute("aria-pressed", String(settings.sound));
  $("soundOff").style.display = settings.sound ? "none" : "";
  $("soundWaves").style.display = settings.sound ? "" : "none";
}

/* ======================================================================
   9. INPUT — Pointer Events: перетаскивание плиток и башен, выбор, лучи
   ====================================================================== */
let press = null;                                   // текущее нажатие {kind, id, x0, y0, moved, ...}
function say(text, padId) {
  const p = G.layout.padById[padId];
  addText(text, p.x, p.y, TM.refuse, { ui: true, dy: -85 });
}
function showGhost(text, color, x, y) {
  els.ghost.hidden = false; els.ghost.textContent = text; els.ghost.style.setProperty("--c", color || "#ffc83d");
  moveGhost(x, y);
}
function moveGhost(x, y) {
  const size = parseFloat(getComputedStyle(els.ghost).width) || 76;
  els.ghost.style.transform = "translate(" + (x - size / 2) + "px," + (y - size / 2) + "px) scale(1.1)";
}
function endPress() {
  if (press && press.el && press.el.releasePointerCapture) { try { press.el.releasePointerCapture(press.id); } catch (e) { /* уже отпущен */ } }
  press = null; els.ghost.hidden = true; SEL.hover = null; SEL.dragFrom = null;
}
function placeFromUI(padId, v) {
  const r = placeTower(padId, v);
  if (r.ok) { SEL.tile = null; SEL.tower = null; }
  return r;
}
function tapTower(id) {
  SEL.beam = null;
  if (SEL.tower === id) { SEL.tower = null; return; }
  if (SEL.tower && G.towers[SEL.tower] && findLink(SEL.tower, id)) {
    const first = SEL.tower, r = makeBeam(first, id);
    if (!r.ok && r.reason === "full") say("У башни уже два луча", beamsOf(id).length >= MAX_BEAMS ? id : first);
    SEL.tower = null;
    return;
  }
  SEL.tower = id;
}
function tapField(cx, cy) {
  if (SEL.beam) {
    const x = crossAtClient(cx, cy);
    if (x) { breakBeam(x); SEL.beam = null; return; }
  }
  if (SEL.tile != null) {
    const pad = padAtClient(cx, cy, CATCH_PX);
    if (pad) placeFromUI(pad.id, SEL.tile); else SEL.tile = null;
    return;
  }
  const bid = beamAtClient(cx, cy);
  if (bid) { SEL.beam = bid; SEL.tower = null; return; }
  const pad = padAtClient(cx, cy, TOWER_TOUCH_PX);
  if (SEL.tower && pad && !G.towers[pad.id] && findLink(SEL.tower, pad.id)) { say("Сначала поставь башню", pad.id); return; }
  SEL.tower = null; SEL.beam = null;
}
els.tiles.addEventListener("pointerdown", (e) => {
  const tile = e.target.closest(".tile");
  if (!tile || press || !e.isPrimary) return;
  AudioFX.unlock();
  if (!canEdit()) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  try { tile.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ }
  const v = Number(tile.dataset.v);
  press = { kind: "tile", id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, v, el: tile };
  showGhost(String(v), DIGIT_COLORS[v], e.clientX, e.clientY);
});
els.tiles.addEventListener("click", (e) => {            // клавиатура: Enter и пробел на плитке
  const tile = e.target.closest(".tile");
  if (tile && e.detail === 0 && canEdit()) { const v = Number(tile.dataset.v); SEL.tile = SEL.tile === v ? null : v; uiSig = ""; }
});
canvas.addEventListener("pointerdown", (e) => {
  if (press || !e.isPrimary) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  AudioFX.unlock();
  if (!canEdit()) {
    if (G.phase === "battle" && !G.hintShown) { G.hintShown = true; showToast("Нажми „Пауза“, чтобы перестроить лучи", 2800); }
    return;
  }
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ }
  press = { kind: "field", id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, el: canvas };
  const tw = SEL.tile == null && !crossAtClient(e.clientX, e.clientY) ? towerAtClient(e.clientX, e.clientY) : null;
  if (tw) { press.kind = "tower"; press.pad = tw.id; }
});
window.addEventListener("pointermove", (e) => {
  if (!press || e.pointerId !== press.id) return;
  if (!press.moved && Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > DRAG_PX) {
    press.moved = true;
    if (press.kind === "tower" && !G.towers[press.pad].fixed) {
      SEL.dragFrom = press.pad;
      showGhost(String(G.towers[press.pad].value), DIGIT_COLORS[G.towers[press.pad].value], e.clientX, e.clientY);
    }
  }
  if (!press.moved) return;
  if (press.kind === "tile" || (press.kind === "tower" && SEL.dragFrom)) {
    moveGhost(e.clientX, e.clientY);
    const pad = padAtClient(e.clientX, e.clientY, CATCH_PX);
    SEL.hover = pad && !(G.towers[pad.id] && G.towers[pad.id].fixed) && pad.id !== SEL.dragFrom ? pad.id : null;
  }
});
window.addEventListener("pointerup", (e) => {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  endPress();
  if (!canEdit()) return;
  if (p.kind === "tile") {
    if (p.moved) { const pad = padAtClient(e.clientX, e.clientY, CATCH_PX); if (pad) placeFromUI(pad.id, p.v); }
    else SEL.tile = SEL.tile === p.v ? null : p.v;
  } else if (p.kind === "tower") {
    if (p.moved) {
      if (G.towers[p.pad] && !G.towers[p.pad].fixed) {
        const pad = padAtClient(e.clientX, e.clientY, CATCH_PX);
        if (!pad) removeTower(p.pad); else if (pad.id !== p.pad) moveTower(p.pad, pad.id);
        SEL.tower = null;
      }
    } else tapTower(p.pad);
  } else if (!p.moved) tapField(e.clientX, e.clientY);
  uiSig = "";
  syncUI();
});
window.addEventListener("pointercancel", (e) => { if (press && e.pointerId === press.id) endPress(); });
$("app").addEventListener("contextmenu", (e) => e.preventDefault());
$("app").addEventListener("dragstart", (e) => e.preventDefault());

// Кнопки
function doFight() { if (fight().ok) { SEL.tower = SEL.beam = SEL.tile = null; AudioFX.play("fight"); } }
function togglePause() {
  if (G.phase !== "battle") return;
  if (G.paused) resume(); else { pause(); SEL.tile = null; }
}
els.fightBtn.addEventListener("click", () => { AudioFX.unlock(); doFight(); syncUI(); });
els.pauseBtn.addEventListener("click", () => { AudioFX.unlock(); togglePause(); syncUI(); });
els.resumeBtn.addEventListener("click", () => { togglePause(); syncUI(); });
els.retryBtn.addEventListener("click", () => { if (retry().ok) { SEL.tower = SEL.beam = SEL.tile = null; } syncUI(); });
els.soundBtn.addEventListener("click", () => { AudioFX.unlock(); settings.sound = !settings.sound; syncUI(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === " " || e.code === "Space") {
    if (G.phase === "battle") { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); togglePause(); syncUI(); }
  }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && G && G.phase === "battle" && !G.paused) pause(); });

/* ======================================================================
   10. LOOP — requestAnimationFrame: накопитель времени, тики, рисование
   ====================================================================== */
let lastNow = 0, acc = 0, manualMode = false;
function loop(now) {
  const dt = Math.min(250, now - (lastNow || now));
  lastNow = now;
  if (G) {
    if (!manualMode && simRunning()) {
      acc += dt;
      for (let n = 0; acc >= DT && n < 30; n++) { tick(); acc -= DT; }
      if (acc > DT * 30) acc = 0;
    } else acc = 0;
    G.uiTexts.forEach((t) => { t.ttl -= dt; });
    G.uiTexts = G.uiTexts.filter((t) => t.ttl > 0);
    syncUI();
    render();
  }
  requestAnimationFrame(loop);
}
function onResize() { computeView(); if (G) { layoutHand(); uiSig = ""; render(); } }
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgKey = ""; });

/* ======================================================================
   11. EXPORT — window.OBORONA: logic, layouts, state(), api, render()
   ====================================================================== */
function loadFixture(fx) {
  const r = startLevel(fx);
  if (!r.ok) return r;
  SEL.tower = SEL.beam = SEL.tile = SEL.hover = SEL.dragFrom = null;
  endPress();
  tmpToast = null; bgKey = "";
  buildTiles();
  return { ok: true };
}
function snapshot() {
  const flash = (b) => { const f = flashOf(b); return f ? f.type : null; };
  const out = {
    version: VERSION, screen: "level", screensSeen: ["level"],
    view: { s: VIEW.s, ox: VIEW.ox, oy: VIEW.oy, barH: VIEW.barH, handH: VIEW.handH, W: VIEW.W, H: VIEW.H },
    phase: G.phase, paused: G.paused, today: null,
    level: { id: G.id, land: G.land, layout: G.layout.id, hand: G.hand.slice(), fixed: Object.assign({}, G.fixed), waveIndex: G.waveIndex, waveCount: G.waves.length, practice: !G.demo },
    hearts: G.hearts, battleMs: Math.round(G.battleTicks * DT), queue: G.plan.length - G.queue,
    towers: Object.keys(G.towers).map((pad) => ({ pad, value: G.towers[pad].value, fixed: G.towers[pad].fixed, beams: beamsOf(pad).length })),
    beams: G.beams.map((b) => {
      const a = G.towers[b.from].value, c = G.towers[b.to].value;
      return { id: b.id, from: b.from, to: b.to, a, b: c, product: a * c, label: beamLabel(a, c), phase: b.phase, edits: G.linkEdits[b.id] || 0, flash: flash(b) };
    }),
    enemies: G.enemies.map((e) => ({ id: e.id, value: e.value, start: e.start, kind: e.kind, card: e.card, path: e.path, t: e.t, x: Math.round(e.x * 10) / 10, y: Math.round(e.y * 10) / 10, state: "walk" })),
    ribbon: G.ribbon.map((r) => ({ value: r.value, kind: r.kind, status: r.status, lamp: r.lamp })),
    texts: G.texts.concat(G.uiTexts).map((t) => ({ text: t.text, x: Math.round(t.x + (t.slot ? t.slot.dx : 0)), y: Math.round(t.y + (t.slot ? t.slot.dy : t.dy)), ttl: Math.round(t.ttl) })),
    textLog: G.textLog.slice(),
    events: G.events.map((e) => Object.assign({}, e)),
    hint: null,
    wave: { cards: Array.from(new Set(G.plan.map((p) => p.card).filter(Boolean))), meta: { demo: G.demo, n: G.plan.length, gap: G.waves[G.waveIndex].gap || 3000 }, solution: waveSolution() },
    frame: { labels: frame.labels.map((l) => Object.assign({}, l)), enemies: frame.enemies.map((e) => Object.assign({}, e)), cross: frame.cross ? Object.assign({}, frame.cross) : null },
    toast: G.toast, result: G.result ? Object.assign({}, G.result) : null, save: null
  };
  return JSON.parse(JSON.stringify(out));
}
const api = {
  manual(on) { manualMode = !!on; acc = 0; return { ok: true, manual: manualMode }; },
  reset() { return loadFixture(DEMO); },
  loadLevel(fx) { return loadFixture(fx || {}); },
  placeTower(pad, value) { return placeTower(pad, value); },
  removeTower(pad) { return removeTower(pad); },
  moveTower(from, to) { return moveTower(from, to); },
  beam(p1, p2) { return makeBeam(p1, p2); },
  breakBeam(a, b) { return breakBeam(a, b); },
  fight() { const r = fight(); if (r.ok) { SEL.tower = SEL.beam = SEL.tile = null; } return r; },
  pause() { return pause(); },
  resume() { return resume(); },
  retry() { return retry(); },
  spawn(value, o) { return spawnNow(value, o); },
  step(ms) { stepMs(ms); return snapshot(); },
  stepUntilWaveEnd(maxMs) { return stepUntilWaveEnd(maxMs); },
  endWave() { return endWave(); },
  solution() { const s = waveSolution(); return s ? JSON.parse(JSON.stringify(s)) : null; },
  applySolution() { return applySolution(); },
  setSetting(key, value) {
    if (key === "speed" && SPEEDS[value]) { settings.speed = value; if (G) G.speed = SPEEDS[value]; return { ok: true }; }
    if (key === "sound" || key === "bigFont") { settings[key] = !!value; return { ok: true }; }
    if (key === "perDay") { settings.perDay = Math.max(1, Math.min(10, Number(value) || 5)); return { ok: true }; }
    return fail("unknown");
  }
};

computeView();
loadFixture(DEMO);
window.OBORONA = {
  version: VERSION, ready: false,
  logic: { plural, word, factKey, parseKey, beamLabel, pairsFor, products, canFinish, hitResult, segmentIntersection, prepareLayout, validateLayout, pointAt, starsFor, confusionKey, DIGITS, RAW_LAYOUTS },
  layouts: LAYOUTS, state: snapshot, api, render: () => { syncUI(); render(); }
};
render();
syncUI();
requestAnimationFrame(loop);
window.OBORONA.ready = true;
})();
</script>
