<title>Оборона таблицы</title>

<style>
/* Оборона таблицы: светлое солнечное поле на тёмной «ночной» оболочке (как арена). Поле рисуется на canvas, полосы и кнопки — DOM. */
:root {
  --bg: #0e1d27;
  --panel: #16303d;
  --panel-2: #1d3b4a;
  --line: #2a4d5d;
  --ink: #f2f6ee;
  --muted: #9db3bc;
  --gold: #ffc83d;
  --gold-ink: #2a1d00;
  --good: #5ddc8c;
  --bad: #ff6f61;
  --b0: #2a4d5d; --b1: #ff6f61; --b2: #ff9f4a; --b3: #ffd24a; --b4: #9be27a; --b5: #43c97a;
  --grass-1: #8fd16f; --grass-2: #7cc160;
  --path: #efd49a; --path-edge: #c9a467; --path-a: #6fc3ff; --path-b: #ff9f4a;
  --pad: #d9d2c3; --pad-ring: #9c917c;
  --wood: #b57a4c; --stone: #8e98a6; --roof: #e76f51;
  --beam: #ffd54f; --beam-core: #fffbe6; --beam-grey: #b8c0c8; --beam-hit: #ffa94d;
  --enemy: #8e6cd8; --boss: #5f4b8b; --armor: #9aa8b5;
  --shield: #ffffff; --ink-dark: #1d2b3a;

  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bar-h: 76px;
  --hand-h: 92px;
  --tile: 76px;
  --card: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; touch-action: none; }
body { color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.35; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--grass-2); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.gone { visibility: hidden !important; pointer-events: none !important; }
[hidden] { display: none !important; }

/* Кнопки */
.btn { min-height: 64px; padding: 0 26px; border-radius: 18px; border: 3px solid transparent; font-family: var(--f-display); font-size: 22px; letter-spacing: .01em; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 5px 0 #b98a14; }
.btn.gold:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a14; }
.btn.ghost { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
.btn.ghost:active { background: var(--line); }
.btn.round { width: 56px; min-height: 56px; height: 56px; padding: 0; border-radius: 50%; flex: none; }
.btn.round svg { width: 30px; height: 30px; }

/* Верхняя полоса */
#bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar-h); z-index: 5; touch-action: none; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel); border-bottom: 2px solid var(--line); }
#hearts { display: flex; align-items: center; gap: 8px; flex: none; }
#hearts svg { width: 38px; height: 36px; transition: opacity .6s; }
#hearts b { font-family: var(--f-display); font-weight: 400; font-size: 30px; min-width: 2ch; font-variant-numeric: tabular-nums; }
#waveNo { flex: none; font-family: var(--f-display); font-size: 19px; color: var(--ink); white-space: nowrap; }
#ribbon { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; }
.rtitle { flex: none; width: 82px; font-weight: 800; font-size: 15px; line-height: 1.1; color: var(--muted); }
.rtitle.pnote { width: 138px; display: grid; gap: 1px; }
.pnote b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.05; color: var(--gold); }
.pnote span { font-weight: 700; font-size: 14px; line-height: 1.1; color: var(--ink); }
#pauseBtn { flex: none; min-width: 150px; }
.cards { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; padding: 4px 2px; }
.card { position: relative; flex: none; width: var(--card); height: var(--card); display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); border: 3px solid var(--line); font-family: var(--f-display); font-size: calc(var(--card) * .42); line-height: 1; transition: opacity .3s; }
.card.boss { border: 6px double var(--armor); }
.card.boss::before { content: ""; position: absolute; left: 50%; top: -11px; width: 24px; height: 12px; margin-left: -12px; background: var(--armor); border: 2px solid var(--ink-dark); border-bottom: 0; border-radius: 12px 12px 0 0; }
.card.walk { opacity: .45; }
.card.won { border-color: var(--good); }
.card.won::after { content: "✓"; position: absolute; right: 1px; top: -3px; color: var(--good); font: 800 calc(var(--card) * .38) var(--f-body); text-shadow: 0 0 3px var(--panel); }
.card.gate { opacity: .5; }
.card.gate::after { content: ""; position: absolute; right: 3px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--armor); }

/* Рука */
#hand { position: fixed; left: 0; right: 0; bottom: 0; height: var(--hand-h); z-index: 5; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--panel); border-top: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#tiles { flex: 1 1 auto; display: flex; justify-content: center; gap: 6px; min-width: 0; }
.tile { position: relative; flex: none; width: var(--tile); height: var(--tile); padding: 0; border-radius: 16px; background: var(--panel-2); border: 3px solid var(--line); overflow: hidden; font-family: var(--f-display); font-size: calc(var(--tile) * .5); line-height: 1; color: var(--ink); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: grid; place-items: center; padding-top: 8px; }
.tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: var(--c, var(--gold)); }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
#hand.off .tile { opacity: .45; pointer-events: none; }
#fightBtn { flex: none; width: 190px; }

/* Конец уровня и тост лежат в полосе руки, на поле ничего не лежит */
#endCard { position: fixed; left: 0; right: 0; bottom: 0; height: var(--hand-h); z-index: 7; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 0 16px; background: var(--panel); border-top: 2px solid var(--line); touch-action: none; }
#endCard .txt { display: grid; gap: 2px; min-width: 0; text-align: right; }
#endCard .txt b { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
#endCard .txt span { color: var(--muted); font-weight: 700; font-size: 17px; }
#endCard .btn { flex: none; }
#toast { position: fixed; left: 50%; bottom: calc((var(--hand-h) - 64px) / 2); transform: translateX(-50%); z-index: 9; max-width: 94vw; padding: 10px 26px; border-radius: 22px; background: var(--panel-2); border: 3px solid var(--gold); font-family: var(--f-display); font-size: 26px; line-height: 1.15; text-align: center; pointer-events: none; touch-action: none; }
#toast[hidden] { display: none; }
#rotate { display: none; position: fixed; inset: 0; z-index: 60; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; background: var(--bg); text-align: center; touch-action: none; }
#rotate svg { width: 120px; height: 120px; }
#rotate b { font-family: var(--f-display); font-weight: 400; font-size: 38px; }
#rotate span { color: var(--muted); font-weight: 700; font-size: 20px; }
@media (orientation: portrait) { #rotate { display: flex; } }
@keyframes tilt { 0%, 15% { transform: rotate(0); } 50%, 65% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
#rotate svg { animation: tilt 2.6s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
.card.pop { animation: pop .45s ease-out; }
#ghost { position: fixed; left: 0; top: 0; z-index: 20; width: var(--tile); height: var(--tile); pointer-events: none; margin: 0; }
#ghost[hidden] { display: none; }
#ghost.tile { cursor: grabbing; transform: scale(1.1); box-shadow: 0 8px 0 rgba(0,0,0,.25); opacity: .95; }
</style>

<script>

/* ======================================================================

   ====================================================================== */
const VERSION = "0.1.0";

const SPEEDS = { slow: 35, normal: 50, fast: 65 };         // ед./с
const TM = { spark: 650, fly: 800, pass: 1000, reduce: 1500, gate: 2000, knock: 600, grey: 600, hit: 400, win: 300, waveEnd: 1500, bossExtra: 1500, refuse: 1000 };
const COLORS = {
  grass1: "#8fd16f", grass2: "#7cc160", bush: "#6aae52", rock: "#b9b2a3",
  path: "#efd49a", pathEdge: "#c9a467", arch: "#3d3550",
  pad: "#d9d2c3", padRing: "#9c917c", wood: "#b57a4c", stone: "#8e98a6", roof: "#e76f51",
  beam: "#ffd54f", beamCore: "#fffbe6", beamGrey: "#b8c0c8", beamHit: "#ffa94d",
  enemy: "#8e6cd8", boss: "#5f4b8b", armor: "#9aa8b5", shield: "#ffffff", ink: "#1d2b3a",
  gold: "#ffc83d", bad: "#ff6f61", plate: "#fffbe6", shadow: "rgba(0,0,0,.18)"
};
const DIGIT_COLORS = { 2: "#ef5350", 3: "#ff9800", 4: "#f9c80e", 5: "#66bb6a", 6: "#26a69a", 7: "#42a5f5", 8: "#5c6bc0", 9: "#ab47bc", 10: "#ec407a", 20: "#8d6e63", 30: "#78909c", 40: "#00897b" };

/* ======================================================================
   2. CONTENT — цифры, формы слов, раскладки, демонстрационная волна
   ====================================================================== */
const DIGITS = [2, 3, 4, 5, 6, 7, 8, 9];
// Формы для plural: одна / несколько / много
const WORDS = {
  star: ["звезда", "звезды", "звёзд"], enemy: ["враг", "врага", "врагов"], heart: ["сердечко", "сердечка", "сердечек"],
  level: ["уровень", "уровня", "уровней"], wave: ["волна", "волны", "волн"], fact: ["пример", "примера", "примеров"],

};
const RAW_LAYOUTS = {
  L1: { id: "L1", name: "Тропа", speedMul: 1, fortress: [1510, 300],
    paths: [[[0, 480], [760, 480], [960, 300], [1440, 300]]],

  L2: { id: "L2", name: "Развилка", speedMul: 1, fortress: [1510, 450],

};

/* ======================================================================
   3. LOGIC — чистые функции без DOM, Date.now() и Math.random()
   ====================================================================== */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b > 1 && b < 5) return few;
  return many;
}
function word(n, key) { const w = WORDS[key]; return n + " " + plural(n, w[0], w[1], w[2]); }
function factKey(a, b) { return Math.min(a, b) + "x" + Math.max(a, b); }
function parseKey(key) { return String(key).split("x").map(Number); }
function beamLabel(a, b) { return a + " × " + b + " = " + (a * b); }
function uniqSorted(hand) { return Array.from(new Set(hand)).sort((x, y) => x - y); }
function pairsFor(n, hand) {
  const h = uniqSorted(hand || DIGITS), out = [];
  for (let i = 0; i < h.length; i++) for (let j = i; j < h.length; j++) if (h[i] * h[j] === n) out.push([h[i], h[j]]);
  return out;
}
function products(hand) {
  const h = uniqSorted(hand || DIGITS), set = new Set();
  for (let i = 0; i < h.length; i++) for (let j = i; j < h.length; j++) set.add(h[i] * h[j]);
  return set;
}
// Остаток босса можно добить одним или несколькими лучами (сумма произведений руки)
function canFinish(r, hand) {
  if (!(r > 0)) return false;
  const list = Array.from(products(hand)).filter((p) => p <= r);
  const ok = new Array(r + 1).fill(false);
  ok[0] = true;
  for (let i = 1; i <= r; i++) for (const p of list) if (p <= i && ok[i - p]) { ok[i] = true; break; }
  return ok[r];
}
// Удар луча по врагу. enemy = {value, kind}
function hitResult(enemy, product, hand) {
  const v = enemy.value, p = product;
  if (p === v) return { kind: "kill", newValue: 0, text: "" };
  if (enemy.kind === "boss" && p < v) {
    const r = v - p;
    if (canFinish(r, hand || DIGITS)) return { kind: "reduce", newValue: r, text: v + " − " + p + " = " + r };
    return { kind: "pass", newValue: v, text: "Останется " + r + " — такого луча нет" };
  }
  return { kind: "pass", newValue: v, text: v + ", а луч даёт " + p };
}
function starsFor(hearts) { return hearts >= 8 ? 3 : hearts >= 4 ? 2 : 1; }
function confusionKey(v, p) { return Math.min(v, p) + "|" + Math.max(v, p); }

// Геометрия
function segmentIntersection(p1, p2, p3, p4) {
  const d1x = p2[0] - p1[0], d1y = p2[1] - p1[1], d2x = p4[0] - p3[0], d2y = p4[1] - p3[1];
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-12) return null;
  const ex = p3[0] - p1[0], ey = p3[1] - p1[1];
  const u = (ex * d2y - ey * d2x) / den, v = (ex * d1y - ey * d1x) / den, E = 1e-9;
  if (u < -E || u > 1 + E || v < -E || v > 1 + E) return null;
  return { x: p1[0] + u * d1x, y: p1[1] + u * d1y, u, v };
}
function distPointSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  u = Math.max(0, Math.min(1, u));
  return Math.hypot(px - (ax + u * dx), py - (ay + u * dy));
}
function distPointPath(px, py, path) {
  let d = Infinity;
  for (let i = 0; i < path.pts.length - 1; i++) {
    const a = path.pts[i], b = path.pts[i + 1];
    d = Math.min(d, distPointSeg(px, py, a[0], a[1], b[0], b[1]));
  }
  return d;
}
function pointAt(path, t) {
  const d = Math.max(0, Math.min(1, t)) * path.len;
  let i = 0;
  while (i < path.seg.length - 1 && path.cum[i + 1] < d) i++;
  const a = path.pts[i], b = path.pts[i + 1], u = path.seg[i] ? (d - path.cum[i]) / path.seg[i] : 0;
  return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u };
}

// Длины отрезков, пересечения связей с дорожками (cross) и точки подписей (labelAt)

function rectOf(cx, cy, w, h) { return { x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 }; }

  const inside = (p) => p[0] >= r.x0 && p[0] <= r.x1 && p[1] >= r.y0 && p[1] <= r.y1;

// Список нарушений раскладки (пустой — всё хорошо)
function validateLayout(L, o) {
  o = o || {};
  const pw = o.plateW || 320, ph = o.plateH || 66, bad = [];
  L.pads.forEach((p) => {
    L.paths.forEach((path, i) => {
      if (distPointPath(p.x, p.y, path) < 150 - 1e-6) bad.push("площадка " + p.id + " ближе 150 к дорожке " + i);
    });
  });
  const plates = [];
  L.links.forEach((l) => {
    const per = {};
    l.cross.forEach((c) => { per[c.path] = (per[c.path] || 0) + 1; });
    if (!l.cross.length) bad.push("связь " + l.id + " не пересекает дорожку");
    Object.keys(per).forEach((k) => { if (per[k] > 1) bad.push("связь " + l.id + " пересекает дорожку " + k + " дважды"); });
    if (l.labelAt) plates.push({ id: l.id, r: rectOf(l.labelAt.x, l.labelAt.y, pw, ph) });
  });

    const r = pl.r;
    if (r.x0 < 0 || r.y0 < 0 || r.x1 > FIELD_W || r.y1 > FIELD_H) bad.push("плашка " + pl.id + " за краем поля");
    for (let j = i + 1; j < plates.length; j++) if (rectsOverlap(r, plates[j].r)) bad.push("плашки " + pl.id + " и " + plates[j].id + " пересекаются");
    L.paths.forEach((path, pi) => {
      for (let k = 0; k < path.seg.length; k++) {
        if (rectSegDist(r, path.pts[k], path.pts[k + 1]) < PATH_HALF + 4) { bad.push("плашка " + pl.id + " на дорожке " + pi); break; }
      }

}

const LAYOUTS = {};
Object.keys(RAW_LAYOUTS).forEach((k) => { LAYOUTS[k] = prepareLayout(RAW_LAYOUTS[k]); });

/* ======================================================================
   4. MODEL — объект уровня G, башни, лучи, проверки (без DOM)
   ====================================================================== */
const settings = { speed: "normal", sound: true, bigFont: false, perDay: 5 };
let G = null;
const fail = (reason) => ({ ok: false, reason });

function makeLevel(fx) {
  const layout = LAYOUTS[fx.layout || "L1"];
  if (!layout) return null;
  const g = {
    id: fx.id || "fixture", land: fx.land || 1, layout, hand: (fx.hand || DIGITS).slice(), fixed: Object.assign({}, fx.fixed || {}),
    maxHearts: fx.hearts == null ? 10 : fx.hearts, speed: fx.speed || SPEEDS[settings.speed], hold: !!fx.hold, track: !!fx.track, demo: !!fx.demo,
    waves: fx.waves && fx.waves.length ? fx.waves : [{ enemies: [], gap: 3000 }],
    waveIndex: 0, phase: "prep", paused: false, simTicks: 0, battleTicks: 0, endTicks: 0,
    towers: {}, beams: [], linkEdits: {}, plan: [], queue: 0, enemies: [], ribbon: [], nextId: 1,
    texts: [], uiTexts: [], textLog: [], events: [], fx: [], cues: [], soundLog: [], endAt: 0, toast: "", result: null, waveStat: { won: 0, total: 0 }
  };
  g.hearts = g.maxHearts;
  Object.keys(g.fixed).forEach((p) => { if (layout.padById[p]) g.towers[p] = { value: g.fixed[p], fixed: true }; });
  return g;
}
function startLevel(fx) {

  return { ok: true };
}
// Подготовка волны: план появления врагов, лента, счётчики правок лучей
function loadWave(i) {

    const o = typeof e === "number" ? { value: e } : e, kind = o.kind || "normal";
    if (kind === "boss" && idx > 0) t += TM.bossExtra;
    const at = t;
    t += gap;
    const pr = pairsFor(o.value, G.hand)[0];
    return { value: o.value, kind, path: o.path || 0, card: o.card || (pr ? factKey(pr[0], pr[1]) : null), spawnAt: at, idx };
  });
  G.queue = 0; G.enemies = []; G.fx = []; G.texts = []; G.uiTexts = [];
  G.battleTicks = 0; G.endTicks = 0; G.paused = false; G.phase = "prep"; G.result = null; G.toast = ""; G.endAt = 0;
  G.ribbon = G.plan.map((p) => ({ value: p.value, kind: p.kind, status: "wait", lamp: false }));

}
function canEdit() { return !!G && (G.phase === "prep" || (G.phase === "battle" && G.paused)); }
function findLink(a, b) { return G.layout.links.find((l) => (l.a === a && l.b === b) || (l.a === b && l.b === a)) || null; }

function addText(text, x, y, ttl, o) {

  const tx = { text, x, y, ttl, max: ttl, follow: o.follow || 0, dy: o.dy == null ? -90 : o.dy, slot: null, ui: !!o.ui, quiet: !!o.quiet, rad: o.rad || 0, dir: o.dir || null };   // (x, y) — якорь, плашка рисуется рядом; rad > 0 — рисовать хвостик к врагу
  (tx.ui ? G.uiTexts : G.texts).push(tx);
  G.textLog.push(text);

}

function placeTower(pad, value) {
  if (!G.layout.padById[pad]) return fail("no-pad");
  const cur = G.towers[pad];
  if (cur && cur.fixed) return fail("fixed");
  if (!G.hand.includes(value)) return fail("not-in-hand");
  if (!canEdit()) return fail("locked");
  if (!cur) { G.towers[pad] = { value, fixed: false, born: animNow() }; return { ok: true, changed: true }; }
  if (cur.value === value) return { ok: true, changed: false };
  cur.value = value; cur.pop = animNow();                                    // луч остаётся, произведение и подпись пересчитываются
  beamsOf(pad).forEach((b) => { G.linkEdits[b.id] = (G.linkEdits[b.id] || 0) + 1; if (G.phase === "battle") b.phase = "battle"; });
  return { ok: true, changed: true };
}
function removeTower(pad) {
  if (!G.layout.padById[pad]) return fail("no-pad");
  const cur = G.towers[pad];
  if (cur && cur.fixed) return fail("fixed");
  if (!cur) return fail("no-tower");

}
function moveTower(from, to) {

  const a = G.towers[from], b = G.towers[to];
  if ((a && a.fixed) || (b && b.fixed)) return fail("fixed");
  if (!a) return fail("no-tower");

  if (!canEdit()) return fail("locked");
  const link = findLink(p1, p2);

  if (!G.towers[p1] || !G.towers[p2]) return fail("no-tower");

  if (beamsOf(p1).length >= MAX_BEAMS || beamsOf(p2).length >= MAX_BEAMS) return fail("full");

}
function fight() {
  if (G.phase !== "prep") return fail("not-prep");
  G.beams.forEach((b) => { b.phase = "prep"; b.fk = null; });
  G.phase = "battle"; G.paused = false; G.battleTicks = 0; G.queue = 0;
  return { ok: true };
}
function pause() {
  if (G.phase !== "battle") return fail("not-battle");
  G.paused = true;
  return { ok: true };
}
function resume() {
  if (G.phase !== "battle" || !G.paused) return fail("not-paused");
  G.paused = false;
  return { ok: true };
}
function retry() {
  if (G.phase === "waveEnd" || (G.phase === "battle" && !G.paused)) return fail("busy");
  G.hearts = G.maxHearts;
  loadWave(0);
  return { ok: true };
}

  Object.keys(G.towers).forEach((p) => { if (!G.towers[p].fixed) delete G.towers[p]; });
  G.beams = []; G.linkEdits = {};

  s.beams.forEach((pair) => makeBeam(pair[0], pair[1]));

/* ======================================================================
   5. SIM — один шаг симуляции (16,667 мс): появление, ход, лучи, крепость
   ====================================================================== */
function placeEnemy(e) {
  const p = pointAt(G.layout.paths[e.path], e.t);
  e.x = p.x; e.y = p.y;
}
function spawnEnemy(value, kind, pathIdx, t, idx, card) {
  if (!G.layout.paths[pathIdx]) pathIdx = 0;
  const pr = pairsFor(value, G.hand)[0];
  const e = { id: G.nextId++, idx: idx == null ? -1 : idx, value, start: value, kind: kind || "normal", path: pathIdx, t: t || 0, x: 0, y: 0, cracks: 0,
    card: card === undefined ? (pr ? factKey(pr[0], pr[1]) : null) : card };
  placeEnemy(e);
  G.enemies.push(e);
  if (e.idx >= 0) G.ribbon[e.idx].status = "walk";
  return e;
}
function pushEvent(type, e, product, beamId, extra) {
  G.events.push(Object.assign({ type, enemy: e.id, value: e.value, product: product == null ? null : product, beam: beamId || null, ms: Math.round(G.battleTicks * DT) }, extra || {}));
}
// Звуковые сигналы: sim только просит, играет интерфейс; soundLog — журнал запросов (виден тестам даже при выключенном звуке)
function cue(name) {
  G.cues.push(name); G.soundLog.push(name);
  if (G.cues.length > 40) G.cues.shift();
}
// Есть ли впереди на дорожке луч, который побьёт врага (победа или удар по броне): тогда «мимо» лучей позади — рабочий проход, а не ошибка
function goodBeamAhead(e, tFrom) {
  const L = G.layout;
  return G.beams.some((b) => L.linkById[b.id].cross.some((c) => {
    if (c.path !== e.path || !(c.t > tFrom + 1e-9)) return false;
    const k = hitResult({ value: e.value, kind: e.kind }, beamProduct(b), G.hand).kind;
    return k === "kill" || k === "reduce";
  }));
}
function dropEnemy(e) { G.enemies = G.enemies.filter((x) => x !== e); }
function moveEnemy(e) {
  const L = G.layout, path = L.paths[e.path];
  const sp = G.speed * L.speedMul * (e.kind === "boss" ? 0.8 : 1);
  const tPrev = e.t, tNew = tPrev + sp * DT / 1000 / path.len;
  const hits = [];
  G.beams.forEach((b) => {
    L.linkById[b.id].cross.forEach((c) => { if (c.path === e.path && c.t > tPrev && c.t <= tNew) hits.push({ t: c.t, b }); });
  });
  hits.sort((p, q) => p.t - q.t);

    const prod = beamProduct(h.b), r = hitResult({ value: e.value, kind: e.kind }, prod, G.hand);
    e.t = h.t; placeEnemy(e);
    const off = e.kind === "boss" ? 130 : 104, rad = e.kind === "boss" ? BOSS_R : ENEMY_R, dir = dirAt(path, e.t);
    if (r.kind === "kill") {
      pushEvent("kill", e, prod, h.b.id);
      h.b.fk = "win"; h.b.f0 = G.simTicks; h.b.fq = 1;
      cue("kill");
      G.fx.push({ type: "spark", x: e.x, y: e.y, t0: G.simTicks, dur: TM.spark });
      if (e.idx >= 0) G.fx.push({ type: "fly", x: e.x, y: e.y, t0: G.simTicks, dur: TM.fly, idx: e.idx, value: e.start });
      if (e.idx >= 0) G.ribbon[e.idx].status = "won";
      dropEnemy(e);
      return;
    }
    if (r.kind === "reduce") {
      e.value = r.newValue; e.cracks++;
      pushEvent("reduce", e, prod, h.b.id);
      h.b.fk = "hit"; h.b.f0 = G.simTicks; h.b.fq = 1;
      cue("reduce");
      addText(r.text, e.x, e.y, TM.reduce, { follow: e.id, dy: -off, rad, dir });
    } else {
      // Проход «мимо». Если впереди есть луч с нужным произведением, это обычная часть боя: текст бледнее, вспышка луча слабее, звука нет
      const quiet = goodBeamAhead(e, h.t);
      pushEvent("pass", e, prod, h.b.id, quiet ? { quiet: true } : null);
      h.b.fk = "grey"; h.b.f0 = G.simTicks; h.b.fq = quiet ? 0.35 : 1;

// Враг дошёл до крепости: одно сердечко, спокойный текст с разложением, без позора
function reachGate(e) {

  const text = pr ? e.start + " = " + pr[0] + " × " + pr[1] : String(e.start);
  pushEvent("gate", e, null, null);
  cue("gate");
  addText(text, G.layout.fortress[0], G.layout.fortress[1], TM.gate, { dy: 105 });
  G.fx.push({ type: "knock", x: e.x, y: e.y, t0: G.simTicks, dur: TM.knock, value: e.start, kind: e.kind, path: e.path });
  if (e.idx >= 0) G.ribbon[e.idx].status = "gate";

function stepTexts() {
  G.texts.forEach((t) => {
    t.ttl -= DT;
    if (t.follow) { const e = G.enemies.find((x) => x.id === t.follow); if (e) { t.x = e.x; t.y = e.y; } else t.follow = 0; }
  });
  G.texts = G.texts.filter((t) => t.ttl > 0);
  G.fx = G.fx.filter((f) => (G.simTicks - f.t0) * DT < f.dur);
}
function finishWave() {
  const total = G.ribbon.length, won = G.ribbon.filter((r) => r.status === "won").length;

  G.toast = won === total ? "Волна отбита!" : "Волна позади: " + won + " из " + total;

}
function afterWaveEnd() {

  G.result = { won: G.waveStat.won, total: G.waveStat.total, hearts: G.hearts, stars: starsFor(G.hearts), text: G.toast, alts: [], newRewards: [] };
}
function tick() {

  }

  while (G.queue < G.plan.length && G.plan[G.queue].spawnAt <= now + 1e-6) {
    const p = G.plan[G.queue++];
    spawnEnemy(p.value, p.kind, p.path, 0, p.idx, p.card);
  }

function simRunning() { return G.phase === "waveEnd" || (G.phase === "battle" && !G.paused); }
function stepMs(ms) {

  while (n < limit && (G.phase === "battle" || G.phase === "waveEnd")) { tick(); n++; }

    const p = 1 - t.ttl / t.max, rise = still ? 0 : RISE * p, alpha = (t.ttl < 200 ? Math.max(0, t.ttl / 200) : 1) * (t.quiet ? 0.5 : 1);

// Нужен ли ещё кадр, пока ввод ничего не менял: идёт бой, анимации, всплывающие тексты, искры лучей, пульс выбора

  if (G.uiTexts.length) return true;

// Поиск цели под указателем (px окна)
function padAtClient(cx, cy, extra) {
  const p = toField(cx, cy);
  let best = null, bd = Infinity;
  G.layout.pads.forEach((pad) => {
    const d = Math.hypot(p.x - pad.x, p.y - pad.y) * VIEW.s;
    if (d <= PAD_R * VIEW.s + extra && d < bd) { best = pad; bd = d; }
  });
  return best;
}
function towerAtClient(cx, cy) {
  const pad = padAtClient(cx, cy, TOWER_TOUCH_PX);
  return pad && G.towers[pad.id] ? pad : null;
}
function crossAtClient(cx, cy) {
  if (!frame.cross) return null;
  const q = fieldToPx(frame.cross.x, frame.cross.y);
  return Math.hypot(cx - q.x, cy - q.y) <= Math.max(frame.cross.r * VIEW.s, 24) + 4 ? frame.cross.beam : null;
}
function beamAtClient(cx, cy) {
  let best = null, bd = Infinity;
  frame.labels.forEach((l) => {
    const q = fieldToPx(l.x, l.y), hw = l.w * VIEW.s / 2 + 8, hh = l.h * VIEW.s / 2 + 8;
    if (Math.abs(cx - q.x) <= hw && Math.abs(cy - q.y) <= hh) { const d = Math.hypot(cx - q.x, cy - q.y); if (d < bd) { best = l.beam; bd = d; } }
  });
  if (best) return best;
  G.beams.forEach((b) => {
    const A = fieldToPx(G.layout.padById[b.from].x, G.layout.padById[b.from].y), B = fieldToPx(G.layout.padById[b.to].x, G.layout.padById[b.to].y);
    const d = distPointSeg(cx, cy, A.x, A.y, B.x, B.y);
    if (d <= 20 && d < bd) { best = b.id; bd = d; }
  });
  return best;
}

// Звук: короткие синтезированные тоны, контекст создаётся по первому касанию

  }
  function tone(freq, at, dur, type, vol) {
    if (!ac || !settings.sound) return;
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);

  }
  function play(name) {
    if (name === "kill") { tone(660, 0, 0.09, "triangle", 0.15); tone(880, 0.09, 0.09, "triangle", 0.15); }
    else if (name === "pass") tone(220, 0, 0.12, "sine", 0.12);
    else if (name === "reduce") { tone(440, 0, 0.06, "triangle", 0.15); tone(330, 0.06, 0.06, "triangle", 0.15); }
    else if (name === "gate") tone(150, 0, 0.2, "sine", 0.05);
    else if (name === "fanfare") { tone(523, 0, 0.12, "triangle", 0.16); tone(659, 0.12, 0.12, "triangle", 0.16); tone(784, 0.24, 0.12, "triangle", 0.16); tone(1047, 0.36, 0.45, "triangle", 0.17); tone(784, 0.36, 0.45, "sine", 0.07); }
    else if (name === "chime") { tone(659, 0, 0.14, "triangle", 0.12); tone(784, 0.14, 0.26, "triangle", 0.12); }
    else if (name === "fight") { tone(523, 0, 0.1, "triangle", 0.15); tone(659, 0.1, 0.1, "triangle", 0.15); tone(784, 0.2, 0.14, "triangle", 0.15); }
  }

})();

  if (SEL.tower && G.towers[SEL.tower] && findLink(SEL.tower, id)) {
    const first = SEL.tower, r = makeBeam(first, id);
    if (!r.ok && r.reason === "full") say("У башни уже два луча", beamsOf(id).length >= MAX_BEAMS ? id : first);

/* ======================================================================
   10. LOOP — requestAnimationFrame: накопитель времени, тики, рисование
   ====================================================================== */
let lastNow = 0, acc = 0, manualMode = false;
function loop(now) {
  const dt = Math.min(250, now - (lastNow || now));

  if (G) {
    if (!manualMode && simRunning()) {
      acc += dt;
      for (let n = 0; acc >= DT && n < 30; n++) { tick(); acc -= DT; }
      if (acc > DT * 30) acc = 0;
    } else acc = 0;
    G.uiTexts.forEach((t) => { t.ttl -= dt; });
    G.uiTexts = G.uiTexts.filter((t) => t.ttl > 0);
