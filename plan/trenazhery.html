<title>Тренировочная арена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Russo+One&display=swap">
<style>
/* Layout: a single-column game screen. Night-pitch arena, chunky display numerals, gold for progress. One committed dark look. */
:root {
  --bg: #0e1d27;
  --panel: #16303d;
  --panel-2: #1d3b4a;
  --line: #2a4d5d;
  --ink: #f2f6ee;
  --muted: #9db3bc;
  --gold: #ffc83d;
  --gold-ink: #2a1d00;
  --good: #5ddc8c;
  --bad: #ff6f61;
  --blue: #6fc3ff;
  --paper: #fbfaf3;
  --paper-line: #b9c9e6;
  --paper-ink: #1d3b8f;
  --b1: #ff6f61; --b2: #ff9f4a; --b3: #ffd24a; --b4: #9be27a; --b5: #43c97a; --b0: #2a4d5d;

  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brand { display: grid; gap: 2px; }
.brand h1 { font-size: 1.45rem; letter-spacing: 0.01em; }
.brand .muted { font-size: 0.85rem; }
.trophies { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px; }
.trophies svg { width: 28px; height: 28px; flex: none; }
.trophies b { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.trophies span { font-size: 0.8rem; color: var(--muted); line-height: 1.1; }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--panel); padding: 5px; border-radius: var(--r); }
.tabs button { border: 0; background: transparent; padding: 10px 2px; border-radius: 12px; font-weight: 800; font-size: clamp(0.78rem, 3.4vw, 0.95rem); cursor: pointer; color: var(--muted); min-height: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--gold); color: var(--gold-ink); }
.today { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; font-weight: 700; color: var(--muted); }
.chip.on { border-color: var(--good); color: var(--good); }

/* Panels */
section[role="tabpanel"] { display: grid; gap: 16px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 2px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 8px 12px; font-weight: 700; cursor: pointer; min-height: 42px; }
.seg button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.btn { border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 1.05rem; cursor: pointer; min-height: 52px; }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 #b9861a; }
.btn.gold:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9861a; }
.btn.ghost { background: var(--panel-2); border: 2px solid var(--line); }
.btn.good { background: var(--good); color: #062512; }
.btn.bad { background: var(--bad); color: #2b0703; }
.btn[disabled] { opacity: 0.45; cursor: default; }

/* Math */
.problem { font-family: var(--f-display); font-size: clamp(2.8rem, 13vw, 5rem); text-align: center; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.answer { font-family: var(--f-display); font-size: clamp(2.2rem, 10vw, 3.4rem); text-align: center; min-height: 1.3em; color: var(--gold); border-bottom: 3px dashed var(--line); width: 4.2ch; margin: 0 auto; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--line); }
.dots i.ok { background: var(--good); border-color: var(--good); }
.dots i.no { background: var(--bad); border-color: var(--bad); }
.dots i.cur { border-color: var(--gold); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; width: 100%; margin: 0 auto; }
.pad button { border: 0; background: var(--panel-2); border-radius: 14px; font-family: var(--f-display); font-size: 1.7rem; min-height: 60px; cursor: pointer; box-shadow: 0 3px 0 #0b1a22; }
.pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1a22; }
.pad .ok { background: var(--gold); color: var(--gold-ink); font-size: 1.2rem; }
.pad .del { font-size: 1.2rem; }
.feedback { text-align: center; display: grid; gap: 8px; justify-items: center; }
.feedback .big { font-family: var(--f-display); font-size: 2rem; }
.feedback.good .big { color: var(--good); }
.feedback.bad .big { color: var(--bad); }
.hint { background: var(--panel-2); border-radius: 14px; padding: 12px 14px; max-width: 46ch; }
.newfact { background: var(--panel-2); border: 2px dashed var(--gold); border-radius: 14px; padding: 14px; text-align: center; display: grid; gap: 6px; }
.newfact b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; color: var(--gold); }

.map { display: grid; grid-template-columns: 28px repeat(8, 1fr); gap: 4px; font-variant-numeric: tabular-nums; max-width: 420px; }
.map div { aspect-ratio: 1; display: grid; place-items: center; border-radius: 7px; font-size: 0.8rem; font-weight: 800; min-width: 0; }
.map .h { color: var(--muted); font-family: var(--f-display); font-weight: 400; aspect-ratio: auto; min-height: 22px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--panel-2); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.85rem; color: var(--muted); }

/* Reading */
.text-list { display: grid; gap: 8px; }
.text-item { display: flex; gap: 10px; justify-content: space-between; align-items: center; background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
.text-item b { font-weight: 800; }
.text-item .muted { font-size: 0.85rem; }
.reader { background: var(--paper); color: #1b2333; border-radius: 14px; padding: 18px 18px; font-size: 1.35rem; line-height: 1.75; font-family: var(--f-body); font-weight: 700; }
.reader.big { font-size: 1.6rem; }
.reader.spaced { letter-spacing: 0.08em; word-spacing: 0.2em; }
.reader .w { border-radius: 6px; padding: 0 1px; cursor: default; }
.reader.marking .w { cursor: pointer; }
.reader .w.err { background: #ffd2cc; color: #9b1c10; text-decoration: line-through; text-decoration-thickness: 2px; }
.reader .w.say { background: #fff0b3; }
.timer { font-family: var(--f-display); font-size: 2.4rem; text-align: center; color: var(--gold); font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; font-size: 0.9rem; }
.bar .track { height: 18px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--blue); border-radius: 6px; }
.bar .fill.best { background: var(--gold); }
.bar b { font-family: var(--f-display); font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
textarea, input[type="text"] { font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
textarea { min-height: 140px; resize: vertical; }
label.f { display: grid; gap: 6px; font-weight: 700; }
.qs { display: grid; gap: 6px; background: var(--panel-2); border-radius: 14px; padding: 12px 14px; }

/* Number line */
.nl { position: relative; height: 96px; margin: 8px 18px 0; cursor: crosshair; touch-action: none; }
.nl-line { position: absolute; left: 0; right: 0; top: 44px; height: 6px; border-radius: 3px; background: var(--ink); }
.nl-end { position: absolute; top: 58px; transform: translateX(-50%); font-family: var(--f-display); color: var(--muted); }
.nl-end::before { content: ""; position: absolute; left: 50%; top: -22px; width: 3px; height: 18px; background: var(--ink); transform: translateX(-50%); }
.nl-mark { position: absolute; top: 22px; width: 4px; height: 50px; border-radius: 2px; transform: translateX(-50%); }
.nl-mark.you { background: var(--blue); }
.nl-mark.true { background: var(--gold); }
.nl-mark.true em { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-style: normal; font-family: var(--f-display); color: var(--gold); }
.goal { text-align: center; font-weight: 800; color: var(--muted); }
.goal.met { color: var(--good); }
.errn { font-size: 0.8rem; color: var(--bad); font-weight: 800; white-space: nowrap; }
.errn.ok { color: var(--good); }
/* Word problems */
.problem-text { background: var(--paper); color: #1b2333; border-radius: 14px; padding: 16px 18px; font-size: 1.3rem; line-height: 1.6; font-weight: 700; }
.ask { font-family: var(--f-display); font-size: 1.25rem; text-align: center; }
.ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 460px; width: 100%; margin: 0 auto; }
.ops button { border: 2px solid var(--line); background: var(--panel-2); border-radius: 14px; padding: 10px 4px; cursor: pointer; display: grid; gap: 2px; justify-items: center; min-height: 76px; box-shadow: 0 3px 0 #0b1a22; }
.ops button b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1; color: var(--gold); }
.ops button span { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.ops button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b1a22; }
.opchip { background: var(--panel-2); border: 2px solid var(--good); color: var(--good); border-radius: 999px; padding: 4px 12px; font-weight: 800; }
.solution { background: var(--panel-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.solution span { font-family: var(--f-display); font-size: 1.2rem; }
details.names summary { cursor: pointer; font-weight: 700; }
.names-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
.author .target { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; color: var(--gold); }

/* Hunt and word family */
.modebar { margin-bottom: 4px; }
.sentence { background: var(--paper); color: #1b2333; border-radius: 14px; padding: 16px; font-size: 1.4rem; line-height: 2.1; font-weight: 700; }
.sentence .tok { font: inherit; color: inherit; background: transparent; border: 2px solid transparent; border-radius: 8px; padding: 0 3px; cursor: pointer; line-height: 1.4; }
.sentence .tok:hover { border-color: #c9d3e6; }
.sentence .tok.sel { background: #ffe9a8; border-color: #e0a92a; }
.sentence .tok.found { background: #c9f2d8; border-color: #2e9e5b; }
.sentence .tok.missed { border: 2px dashed #e07a1f; background: #ffe7cf; }
.sentence .tok.fp { background: #e7e9ee; color: #737b8c; text-decoration: line-through; }
.sentence .tok.cur { outline: 3px solid #2457d6; outline-offset: 1px; }
.sentence .tok[disabled] { cursor: default; }
.sentence .punct { margin-left: -5px; }
.sentence .hot, .big-word .hot { background: var(--gold); color: var(--gold-ink); border-radius: 5px; padding: 0 2px; }
.sentence .gapw.cur { outline: 3px solid #2457d6; border-radius: 6px; padding: 0 2px; }
.sentence .gap, .big-word .gap { display: inline-block; min-width: 1.1em; border-bottom: 3px solid #e0a92a; text-align: center; color: #e0a92a; }
.big-word { font-family: var(--f-display); font-size: clamp(2rem, 9vw, 3rem); text-align: center; letter-spacing: 0.04em; }
.hunt-card { display: grid; gap: 10px; background: var(--panel-2); border-radius: 14px; padding: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chipwrap { display: inline-flex; gap: 2px; align-items: center; }
.chipw { border: 2px solid var(--line); background: var(--paper); color: #1b2333; border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 1.15rem; cursor: pointer; }
.chipw.static { cursor: default; }
.chipw.imp { background: var(--panel-2); color: var(--muted); text-decoration: line-through; }
.spk { border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; padding: 4px; }
.acc { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; text-decoration-color: #e0a92a; }
.btn.chk { font-size: 1.25rem; }
.big-end { font-family: var(--f-display); font-size: 1.6rem; min-width: 110px; }
.lg { display: inline-block; padding: 1px 8px; border-radius: 6px; margin-right: 6px; color: #1b2333; }
.lg.found { background: #c9f2d8; } .lg.missed { background: #ffe7cf; border: 1px dashed #e07a1f; } .lg.fp { background: #e7e9ee; text-decoration: line-through; }

/* Match budget and wheel */
.pools { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.pool { background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
.pool.active { border-color: var(--gold); }
.pool-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pool-h span:first-child { font-weight: 800; }
.pool-h b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; color: var(--gold); line-height: 1; margin-left: auto; font-variant-numeric: tabular-nums; }
.pool-h b.neg { color: var(--bad); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 4px; }
.slots i { aspect-ratio: 1; border-radius: 4px; border: 2px solid var(--line); }
.slots i.used { background: var(--gold); border-color: var(--gold); }
.slots i.over { background: var(--bad); border-color: var(--bad); }
.today-box { display: grid; gap: 10px; justify-items: center; text-align: center; background: var(--panel-2); border-radius: 14px; padding: 14px; }
.today-n { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; color: var(--gold); }
.wheel-wrap { position: relative; width: min(320px, 100%); margin: 6px auto 0; aspect-ratio: 1; }
.wheel { width: 100%; height: 100%; display: block; overflow: hidden; }
#wheel { transform-origin: 0 0; }
.wheel-pin { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--ink); z-index: 2; filter: drop-shadow(0 2px 0 #0b1a22); }
.wheel-t { font-family: var(--f-body); font-weight: 800; font-size: 8.5px; fill: #13202a; }
.wheel-res { text-align: center; min-height: 2.2em; }
.wheel-res b { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; color: var(--gold); }
.acts span { display: inline-flex; align-items: center; gap: 4px; }
.acts .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 2px; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 700; }

/* Stories */
.story .seg { flex-wrap: wrap; }
.st-preview { display: grid; gap: 10px; border-top: 2px dashed var(--line); padding-top: 14px; }
.st-text { font-size: 1.2rem; }
.reader .tw, .st-text .tw { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.cov { font-weight: 800; font-size: 0.9rem; padding: 2px 9px; border-radius: 999px; border: 2px solid var(--line); }
.cov.ok { color: var(--good); border-color: var(--good); }
.cov.no { color: var(--bad); border-color: var(--bad); }
.st-preview textarea { min-height: 160px; }

/* Derived facts */
.bosses { display: flex; flex-wrap: wrap; gap: 6px; }
.boss { font-family: var(--f-display); font-size: 1rem; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel-2); font-variant-numeric: tabular-nums; }
.boss.l1 { border-color: var(--b2); }
.boss.l2 { border-color: var(--b3); }
.boss.won { border-color: var(--b5); background: var(--b5); color: #062512; }
.arr-wrap { display: grid; justify-items: center; gap: 6px; }
.dots-arr { height: auto; }
.dots-arr .dp0 { fill: var(--ink); opacity: 0.85; }
.dots-arr .dp1 { fill: var(--gold); }
.dots-arr .dp2 { fill: var(--blue); }
.dots-arr .cut { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 6 4; }
.arr-lab { font-family: var(--f-display); text-align: center; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.arr-lab .k1, .arr-lab .k2 { display: inline-block; width: 14px; height: 14px; border-radius: 50%; }
.arr-lab .k1 { background: var(--gold); } .arr-lab .k2 { background: var(--blue); margin-left: 10px; }
.area { display: flex; width: min(100%, 420px); height: 90px; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); }
.area > div { display: grid; place-items: center; min-width: 0; }
.area b { font-family: var(--f-display); font-weight: 400; font-size: 1.05rem; color: #13202a; white-space: nowrap; }
.ar0 { background: var(--panel-2); } .ar0 b { color: var(--ink); }
.ar1 { background: var(--gold); } .ar2 { background: var(--blue); border-left: 3px dashed var(--bad); }
.steps-done { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

/* Clocks and money */
.clock-wrap { display: grid; justify-items: center; }
.clock { width: min(260px, 100%); height: auto; display: block; }
.clock.set { touch-action: none; cursor: pointer; }
.c-face { fill: var(--paper); stroke: var(--gold); stroke-width: 5; }
.c-tick { stroke: #a3afbd; stroke-width: 1.5; }
.c-tick5 { stroke: #1b2333; stroke-width: 3.5; }
.c-num { font-family: var(--f-display); font-size: 21px; fill: #1b2333; }
.c-h, .c-m, .c-ghost { stroke-linecap: round; }
.c-h { stroke: #1b2333; stroke-width: 9; }
.c-m { stroke: #2f6fd6; stroke-width: 5; }
.c-h.on, .c-m.on { stroke: #e0611f; }
.c-ghost { stroke: #43c97a; opacity: 0.6; }
.c-gh { stroke-width: 9; } .c-gm { stroke-width: 5; }
.c-pin { fill: #1b2333; }
.hand-ctl { display: grid; grid-template-columns: auto auto auto; gap: 8px; justify-content: center; align-items: center; }
.hand-ctl span { font-weight: 800; color: var(--muted); }
.ans-row { display: flex; justify-content: center; align-items: baseline; gap: 10px; }
.ans-row .answer { margin: 0; }
.unit { font-family: var(--f-display); font-size: 1.4rem; color: var(--muted); }
.btn.right { border-color: var(--good); color: var(--good); opacity: 1; }
.btn.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.tray { min-height: 76px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; background: var(--panel-2); border: 2px dashed var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.purse { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.money { font-family: var(--f-display); font-size: 1.05rem; color: #2a1d00; border: 0; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.money.coin { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #e5b740 60%, #b9861a); box-shadow: inset 0 0 0 3px #b9861a; }
.money.v1, .money.v2 { width: 46px; height: 46px; background: radial-gradient(circle at 35% 30%, #ffffff, #c9d2da 60%, #8e9aa6); box-shadow: inset 0 0 0 3px #8e9aa6; }

  function questValid(q) {

      "\nТребования:\n- Простые частые слова уровня 3 класса, короткие предложения до 12 слов.\n- Безупречная орфография и пунктуация, буква ё там, где нужна.\n- Без названий настоящих игр, брендов, фильмов и знаменитостей. Без страшного и без грубых слов.\n";

      'Ответь только JSON: {"title": "Название", "roles": ["роль мальчика", "роль взрослого"], "lines": [{"who": 0, "text": "реплика мальчика"}, {"who": 1, "text": "реплика взрослого"}]}';
    return base + "- Это выпуск для короткого видео: ведущий говорит прямо в камеру, как блогер или диктор новостей.\n- 7–10 строк, каждая строка — одно-два коротких предложения, всего 60–110 слов.\n- Начало с приветствием, в середине интересные факты или смешные события, в конце прощание.\n- Если это факты о мире, они должны быть правдой.\n\n" +

        '<div class="pools">' + poolHTML("Будни", s.budget.wd, wdUsed, !weekend) + poolHTML("Выходные", s.budget.we, weUsed, weekend) + "</div>" +
        '<div class="today-box">' +
          '<p class="muted">Сегодня ' + WD_NAMES[d.getDay()] + ": <b class=\"today-n\">" + today.n + "</b> " + plural(today.n, "матч", "матча", "матчей") + "</p>" +
          '<div class="row" style="justify-content:center"><button class="btn gold" id="g-plus" type="button">+1 матч</button><button class="btn ghost" id="g-minus" type="button"' + (today.n ? "" : " disabled") + ">Отменить</button></div>" +
          '<p class="hint">' + esc(hint) + "</p>" +
          '<button class="btn ' + (today.self ? "good" : "ghost") + '" id="g-self" type="button" aria-pressed="' + !!today.self + '">' + (today.self ? "⭐ Сегодня выключил сам" : "Выключил сам после последнего матча") + "</button>" +
          '<p class="muted small">Звёзды — не валюта: их не меняют на матчи. Это просто видно, что получается.</p>' +
        "</div>" +
        '<p class="note">Перед последним матчем скажи вслух: «Это последний». Доиграй его и сам положи планшет на зарядку.</p>' +
      "</div>" +
      '<div class="panel">' +
        "<h2>Чем заняться?</h2>" +
        '<p class="muted">Планшет выключен, а что теперь? Крути колесо: в нём ваш семейный список дел.</p>' +
        '<div class="wheel-wrap"><div class="wheel-pin" aria-hidden="true"></div><svg class="wheel" viewBox="-110 -110 220 220" aria-hidden="true"><g id="wheel" style="transform:rotate(' + games.rot + 'deg)">' + wheelSVG(s.acts) + "</g></svg></div>" +
        '<div class="wheel-res" id="wheel-res" aria-live="polite">' + (games.result ? '<b>' + esc(games.result) + "</b>" : "") + "</div>" +
        '<div class="row" style="justify-content:center">' +
          (games.result ? '<button class="btn gold" id="w-go" type="button">Погнали!</button>' + (games.respins > 0 ? '<button class="btn ghost" id="w-re" type="button">Перекрутить (осталась 1 попытка)</button>' : "") : '<button class="btn gold" id="w-spin" type="button">Крутить</button>') +
        "</div>" +
        '<details class="names"><summary class="muted">Наш список дел (' + s.acts.length + ")</summary>" +
          '<div class="wordlist acts">' + s.acts.map(function (a, i) { return '<span>' + esc(a) + ' <button type="button" class="x" data-del="' + i + '" aria-label="Убрать">×</button></span>'; }).join("") + "</div>" +
          '<div class="row"><input type="text" id="act-new" maxlength="40" placeholder="Новое дело"><button class="btn ghost" id="act-add" type="button">Добавить</button></div>' +
          '<p class="note">Составьте список вместе: от 3 до 12 дел, которые ему правда нравятся. Пустота без замены — главная причина срывов после выключения.</p>' +
        "</details>" +
      "</div>" + quizPanelHTML() +
      '<div class="panel">' +
        '<details class="names"><summary class="muted">Для взрослых: сколько матчей в неделю</summary>' +
          '<div class="names-grid">' +
            '<label class="f" for="b-wd">На будни (пн–пт)<input type="text" inputmode="numeric" id="b-wd" maxlength="2" value="' + s.budget.wd + '"></label>' +
            '<label class="f" for="b-we">На выходные (сб+вс)<input type="text" inputmode="numeric" id="b-we" maxlength="2" value="' + s.budget.we + '"></label>' +
          "</div>" +
          '<p class="note">Договоритесь о числах на семейном совете, лучше пусть их предложит он. Ориентир из плана: 5–6 матчей в будний день и 2 блока по 6–8 в выходные. Лимит в настройках планшета остаётся страховкой.</p>' +
          '<div class="row"><button class="btn ghost" id="b-save" type="button">Сохранить</button><span class="muted small" id="b-msg"></span></div>' +
        "</details>" +
      "</div>";
    $("g-plus").addEventListener("click", function () { var day = s.days[t] || { n: 0, self: false }; day.n = Math.min(60, day.n + 1); s.days[t] = day; trimDays(); save("screen"); renderGames(); });
    $("g-minus").addEventListener("click", function () { var day = s.days[t]; if (!day || !day.n) return; day.n--; save("screen"); renderGames(); });
    $("g-self").addEventListener("click", function () { var day = s.days[t] || { n: 0, self: false }; day.self = !day.self; s.days[t] = day; save("screen"); renderGames(); });
    if ($("w-spin")) $("w-spin").addEventListener("click", spin);
    if ($("w-re")) $("w-re").addEventListener("click", function () { games.respins--; spin(); });
    if ($("w-go")) $("w-go").addEventListener("click", function () { games.result = null; games.respins = 1; renderGames(); });
    v.querySelectorAll("[data-del]").forEach(function (b) { b.addEventListener("click", function () { if (s.acts.length <= 3) return; s.acts.splice(+b.getAttribute("data-del"), 1); save("screen"); renderGames(); openActs(); }); });
    $("act-add").addEventListener("click", function () {
      var val = $("act-new").value.trim().slice(0, 40); if (!val || s.acts.length >= 12) return;
      s.acts.push(val); save("screen"); renderGames(); openActs();
    });
    $("b-save").addEventListener("click", function () {
      var wd = parseInt($("b-wd").value, 10), we = parseInt($("b-we").value, 10);
      if (!(wd >= 0 && wd <= 60 && we >= 0 && we <= 60)) { $("b-msg").textContent = "Числа от 0 до 60."; return; }
      s.budget = { wd: wd, we: we }; save("screen"); renderGames();
    });
    bindQuizPanel();
  }
  function openActs() { var d = document.querySelector("#view-games details.names"); if (d) d.open = true; }
  function trimDays() { var s = scr(), ks = Object.keys(s.days).sort(); while (ks.length > 140) delete s.days[ks.shift()]; }
  var WHEEL_COLORS = ["#ffc83d", "#6fc3ff", "#5ddc8c", "#ff9f4a", "#c79bff", "#ff7aa2"];
  function wheelSVG(acts) {
    var n = acts.length, seg = 360 / n, out = "";
    acts.forEach(function (a, i) {
      var a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180, r = 100;
      var x0 = Math.cos(a0) * r, y0 = Math.sin(a0) * r, x1 = Math.cos(a1) * r, y1 = Math.sin(a1) * r;
      var col = WHEEL_COLORS[i % WHEEL_COLORS.length];
      if (n % WHEEL_COLORS.length === 1 && i === n - 1) col = WHEEL_COLORS[1];
      out += '<path d="M0,0 L' + x0.toFixed(2) + "," + y0.toFixed(2) + " A" + r + "," + r + " 0 " + (seg > 180 ? 1 : 0) + ",1 " + x1.toFixed(2) + "," + y1.toFixed(2) + ' Z" fill="' + col + '" stroke="#0e1d27" stroke-width="1.5"/>';
      var mid = (i + 0.5) * seg - 90, label = a.length > 15 ? a.slice(0, 14) + "…" : a;
      out += '<text transform="rotate(' + mid.toFixed(2) + ') translate(56,0)" text-anchor="middle" dominant-baseline="middle" class="wheel-t">' + esc(label) + "</text>";
    });
    return out + '<circle r="14" fill="#0e1d27" stroke="#ffc83d" stroke-width="3"/>';
  }
  function spin() {
    if (games.spinning) return;
    var acts = scr().acts, n = acts.length, idx = Math.floor(Math.random() * n), seg = 360 / n;
    // the pointer is at the top: segment idx's middle must land at 0 degrees
    var targetMod = (360 - ((idx + 0.5) * seg)) % 360, cur = ((games.rot % 360) + 360) % 360;
    var delta = (targetMod - cur + 360) % 360 + 360 * 5;
    games.rot += delta; games.spinning = true;
    var w = $("wheel"), reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (w) { w.style.transition = reduce ? "none" : "transform 3.2s cubic-bezier(0.17, 0.67, 0.21, 1)"; w.style.transform = "rotate(" + games.rot + "deg)"; }
    var b = $("w-spin") || $("w-re"); if (b) b.disabled = true;
    setTimeout(function () { games.spinning = false; games.result = acts[idx]; if (current === "games") renderGames(); }, reduce ? 50 : 3300);
  }
  function gamesProgressHTML() {
    var s = scr(), t = dayKey(), ws = weekStart(t), rows = "";
    for (var w = 0; w < 4; w++) {
      var st = addDays(ws, -7 * w), ks = weekKeys(st), u1 = used(ks.slice(0, 5)), u2 = used(ks.slice(5)), z = stars(ks);
      if (w > 0 && !u1 && !u2 && !z) continue;
      rows += "<tr><td>" + (w === 0 ? "эта неделя" : rangeLabel(st)) + "</td><td>" + u1 + " / " + s.budget.wd + "</td><td>" + u2 + " / " + s.budget.we + "</td><td>" + (z ? "⭐ " + z : "—") + "</td></tr>";
    }
    return '<div class="panel"><h3>Матчи</h3><div class="tbl"><table><thead><tr><th>Неделя</th><th>Будни</th><th>Выходные</th><th>Выключил сам</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<p class="muted small">Числа — сыгранные матчи из бюджета. Хвалите за звёзды «выключил сам», а не за то, что матчей было мало.</p></div>';
  }

  /* =====================================================================
     PROGRESS (for the parent)
     ===================================================================== */
  function renderProgress() {
    var v = $("view-prog");
    var days = [], set = {};
    (data.math.sessions || []).forEach(function (s) { set[s.d] = 1; });
    (data.words.sessions || []).forEach(function (s) { set[s.d] = 1; });
    (data.reading.runs || []).forEach(function (s) { set[s.d] = 1; });
    [data.reading.ql, data.reading.takes, data.family.quiz && data.family.quiz.games, data.math.wp, data.words.hunt, data.words.fam, data.math.df && data.math.df.sessions, data.math.cm && data.math.cm.sessions, data.math.race && data.math.race.games].forEach(function (a) { (a || []).forEach(function (s) { set[s.d] = 1; }); });
    var t = dayKey();
    for (var i = 13; i >= 0; i--) days.push(addDays(t, -i));
    var active = days.filter(function (d) { return set[d]; }).length;

    var mastered = 0; PAIRS.forEach(function (p) { var s = data.math.facts[factKey("m", p[0], p[1])]; if (s && s.b >= 4) mastered++; });
    var msess = (data.math.sessions || []).slice(-10);
    var wprog = data.words.prog || {};
    var byCat = {}; allWords().forEach(function (w) { var c = w.cat; byCat[c] = byCat[c] || { n: 0, m: 0 }; byCat[c].n++; if (wprog[w.id] && wprog[w.id].b >= 4) byCat[c].m++; });
    var hardWords = allWords().filter(function (w) { var s = wprog[w.id]; return s && s.n >= 2 && s.b <= 2; }).map(function (w) { return plain(w.w); });
    var bestBy = {}; (data.reading.runs || []).forEach(function (r) { bestBy[r.tid] = Math.max(bestBy[r.tid] || 0, r.wcpm); });
    var nlLast = (data.math.nl || []).slice(-1)[0];
    var meds = msess.map(function (s) { return s.med; }).filter(function (x) { return x > 0; });

    v.innerHTML =
      '<div class="panel"><h2>Прогресс</h2>' +
        '<p class="muted">Это экран для взрослого. Здесь видно, что получается и над чем работать.</p>' +
        '<div><p class="small muted" style="margin-bottom:6px">Дни с тренировками за 2 недели: ' + active + " из 14</p><div class=\"days\">" + days.map(function (d) { return '<i class="' + (set[d] ? "on" : "") + '" title="' + d + '"></i>'; }).join("") + "</div></div>" +
        '<div class="stats">' + stat(String(trophyCount()), "трофеев") + stat(mastered + " / " + PAIRS.length, "примеров умножения освоено") + stat(String(Object.keys(bestBy).length), "текстов прочитано") + (nlLast ? stat(nlLast.err.toFixed(1).replace(".", ",") + "%", "промах на числовой прямой 0–" + nlLast.range) : "") + "</div>" +
      "</div>" + reportPanelHTML() + dailyProgressHTML() +
      '<div class="panel"><h3>Счёт: последние раунды</h3>' +
        (msess.length ? '<div class="bars">' + msess.map(function (s) {
          return '<div class="bar"><span class="muted">' + s.d.slice(8) + "." + s.d.slice(5, 7) + '</span><div class="track"><div class="fill" style="width:' + Math.round(s.ok / Math.max(1, s.n) * 100) + '%;background:var(--good)"></div></div><b>' + s.ok + "/" + s.n + "</b></div>";
        }).join("") + '</div><p class="muted small">Полоса — доля верных ответов. Время ответа ребёнку не показывается, оно только для вас: обычное время в последнем раунде ' + (meds.length ? fmtSec(meds[meds.length - 1]) : "—") + (meds.length > 1 ? ", в первом из показанных " + fmtSec(meds[0]) : "") + ". Уверенное знание — около 3 секунд.</p>" : '<p class="muted">Раундов пока не было. Первый раунд — на вкладке «Счёт».</p>') +
        mapHTML("m") + legendHTML() +
      "</div>" +
      gamesProgressHTML() + dfProgressHTML() + wpProgressHTML() + cmProgressHTML() + raceProgressHTML() + quizProgressHTML() + huntProgressHTML() +
      '<div class="panel"><h3>Слова</h3><div class="stats">' + ["dict", "check", "tsya", "own"].filter(function (c) { return byCat[c]; }).map(function (c) { return stat(byCat[c].m + " / " + byCat[c].n, CATS[c].toLowerCase() + " освоено"); }).join("") + "</div>" +
        (hardWords.length ? '<p class="muted">Трудные слова (ошибался несколько раз):</p><div class="wordlist">' + hardWords.map(function (w) { return '<span data-b="1">' + esc(w) + "</span>"; }).join("") + "</div>" : '<p class="muted">Трудных слов пока нет.</p>') +
      "</div>" +
      '<div class="panel"><h3>Чтение: рекорды по текстам</h3>' +
        (Object.keys(bestBy).length ? '<div class="bars">' + textsAll().filter(function (tx) { return bestBy[tx.id]; }).map(function (tx) {
          var mx = Math.max.apply(null, Object.keys(bestBy).map(function (k) { return bestBy[k]; }));
          return '<div class="bar"><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(tx.title) + '</span><div class="track"><div class="fill best" style="width:' + Math.round(bestBy[tx.id] / mx * 100) + '%"></div></div><b>' + bestBy[tx.id] + "</b></div>";
        }).join("") + '</div><p class="muted small">Слов в минуту, прочитанных верно. Норм здесь нет: сравниваем его только с ним самим.</p>' : '<p class="muted">Чтений пока не было.</p>') +
      "</div>" + questProgressHTML() + theatreProgressHTML() +
      '<div class="panel"><h3>Как пользоваться</h3><ul class="tips">' +
        "<li>1–2 тренировки в день по 5 минут. Это учебное время, а не развлекательное, и оно не входит в матчи Brawl Stars.</li>" +
        "<li>Не перед сном: последний час без экранов остаётся в силе.</li>" +
        "<li>Трофеи — это счёт выученного, а не валюта. Не меняйте их на планшет или подарки.</li>" +
        "<li>В «Словах» выбирайте одну тему за раз — ту, что сейчас по плану. Слова пишите на бумаге, если логопед не советует иначе.</li>" +
        "<li>Покажите логопеду экран «Прогресс» и спросите, какие слова добавить в «Мои слова».</li>" +
        "<li>Хвалите за процесс: «Ты сам нашёл ошибку», «Сегодня быстрее, чем вчера».</li>" +
        "<li>В чтении сначала точность: если ошибок больше двух, не торопите, а возьмите текст попроще.</li>" +
        "<li>Таблица Шульте — просто игра на внимание. Чтение она не улучшает, поэтому не заменяйте ею тексты.</li>" +
        "<li>Если за 6–8 недель регулярных занятий сдвига почти нет, обсудите это с учителем и логопедом.</li>" +
      "</ul><p class=\"note\" id=\"store-note\"></p></div>";
    var note = $("store-note");
    bindReportPanel();
    if (note) note.textContent = store.mode === "db" ? "Прогресс хранится вместе со страницей: его видно на любом устройстве, где вы её откроете." : store.mode === "readonly" ? "Общий прогресс сохранить не получилось, поэтому он сохраняется только в этом браузере." : "Прогресс сохраняется в этом браузере.";
  }

  function wpProgressHTML() {
    var t = data.math.wpt || {}, keys = ["+", "−", "×", ":", "2"].filter(function (k) { return t[k] && t[k].n; });
    if (!keys.length) return '<div class="panel"><h3>Задачи</h3><p class="muted">Задач пока не было. Они на вкладке «Счёт», внизу.</p></div>';
    var names = { "+": "на сложение", "−": "на вычитание", "×": "на умножение", ":": "на деление", "2": "в два действия" };
    return '<div class="panel"><h3>Задачи: где сбой</h3><div class="bars">' + keys.map(function (k) {
      var x = t[k], op = Math.round(x.op / x.n * 100), an = Math.round(x.ans / x.n * 100);
      return '<div class="bar"><span class="muted">' + names[k] + '</span><div class="track"><div class="fill" style="width:' + op + '%"></div></div><b>' + op + '%</b><span class="errn ok">ответ ' + an + "%</span></div>";
    }).join("") + '</div><p class="muted small">Полоса — как часто действие выбрано сразу верно, справа — как часто верен ответ. Если действие выбирается плохо, дело в понимании условия: читайте задачу вместе и рисуйте схему. Если плохо со счётом — больше таблицы и примеров.</p></div>';
  }

  /* ---------- boot ---------- */
  function typingIn(id) { var ae = document.activeElement; return !!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && $(id) && $(id).contains(ae)); }
  function renderAll() { renderHeader(); if (!math.round && !math.wp && !math.nl && !math.df && !math.cm && !math.race) renderMath(); if (reading.view === "list") renderRead(); if (!words.round && !words.hunt && !words.fam) renderWords(); if (current === "prog" && !typingIn("view-prog")) renderProgress(); if (current === "games" && !games.spinning && !typingIn("view-games")) renderGames(); }
  renderAll();
  try { var tab = localStorage.getItem(LS + "tab"); if (tab && ["math", "read", "words", "games", "prog"].indexOf(tab) >= 0) showTab(tab); } catch (e) {}
  try { var hs = (location.hash || "").slice(1); if (["math", "read", "words", "games", "prog"].indexOf(hs) >= 0) showTab(hs); } catch (e) {}

  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("db").then(function (db) {
        if (!db) return;
        store.mode = "db";
        DOCS.forEach(function (k) {
          store.refs[k] = db.doc("arena/" + k);
          store.refs[k].onSnapshot(function (snap) {
            if (store.timers[k] || store.writing[k]) return;
            if (snap.exists) {
              var d = snap.data() || {};
              var copy = JSON.parse(JSON.stringify(d));
              data[k] = Object.assign({}, data[k], copy);
              try { localStorage.setItem(LS + k, JSON.stringify(data[k])); } catch (e) {}
              if (!busy()) renderAll(); else renderHeader();
            }
          }, function () { store.mode = "readonly"; });
        });
      }, function () {});
    }
  } catch (e) {}
})();
</script>
