<title>Ферма у реки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Russo+One&display=swap">
<style>
/* Ферма у реки: вид сверху, светлая гамма, бумажные панели. Мир рисуется на canvas, всё нажимаемое — DOM-кнопки от 60 px. */
:root {
  --grass: #6dbb4a; --path: #d8b779; --soil: #8a5a33; --water: #3f8fd8; --wood: #a0673a; --roof: #c8463d;
  --paper: #fffaf0; --ink: #2b2118; --line: #d9c7a3; --gold: #ffc83d; --gold-dark: #b9861a;
  --good: #4caf6a; --warn: #e0763a; --frame: #2f4a2a; --hud: rgba(43, 33, 24, 0.82); --hud-ink: #fff8e8;
  --note: #fff3c4; --night: #1a2a5a;
  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--frame); overflow: hidden; }
/* Планшет: двойное касание не увеличивает, долгое нажатие не открывает меню, выделения текста нет; на карте жесты браузера выключены. */
body { font-family: var(--f-body); font-weight: 700; color: var(--ink); -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app, #stage, #app * { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.15; }
h1 { font-size: 44px; } h2 { font-size: 28px; } h3 { font-size: 20px; margin-top: 10px; }
p { margin: 6px 0; }
#app { position: fixed; inset: 0; background: var(--frame); }
#stage { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; transform-origin: 0 0; overflow: hidden; background: var(--frame); font-size: 22px; line-height: 1.4; }
#app.big #stage { font-size: 26px; }
#cv { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; display: block; image-rendering: pixelated; touch-action: none; }

/* кнопки */
.btn { min-width: 64px; min-height: 64px; padding: 8px 20px; border: 4px solid var(--line); border-radius: 18px; background: var(--paper); font-weight: 800; font-size: 1em; line-height: 1.1; text-align: center; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12); }
.btn.gold { background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 4px 0 var(--gold-dark); }
.btn.sel { border-color: var(--good); background: #e3f4e6; }
.btn:disabled { background: #e8e1d2; color: #7d7364; box-shadow: none; cursor: default; border-color: #d3cab8; }
.btn small { font-size: 16px; font-weight: 700; line-height: 1.1; }
.btn.sq { padding: 0; width: 64px; font-size: 32px; }

/* верхняя полоса */
#hud { position: absolute; left: 0; top: 0; width: 1024px; height: 96px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 130px; background: var(--hud); color: var(--hud-ink); z-index: 3; }
#clockBtn { position: absolute; left: 8px; top: 0; width: 112px; height: 112px; padding: 0; border: 0; border-radius: 50%; background: none; z-index: 4; }
#clock { display: block; }
.chip { height: 64px; padding: 0 12px; display: flex; align-items: center; border-radius: 14px; background: rgba(255, 248, 232, 0.14); font-weight: 800; white-space: nowrap; font-size: 20px; }
#moneyChip { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--gold); }
.hudbtn { min-width: 64px; height: 64px; padding: 0 14px; border-radius: 14px; border: 3px solid rgba(255, 248, 232, 0.5); background: transparent; color: var(--hud-ink); font-weight: 800; position: relative; overflow: hidden; }
#tasksBtn { border-color: var(--gold); color: var(--gold); }
#adultBtn { margin-left: auto; opacity: 0.7; }
.hbar { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: var(--gold); }
#peekBubble { position: absolute; left: 8px; top: 98px; padding: 8px 16px; border: 4px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); font-weight: 800; z-index: 4; }

/* нижняя полоса */
#bottom { position: absolute; left: 0; bottom: 0; width: 1024px; height: 84px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--hud); color: var(--hud-ink); z-index: 3; }
#where { font-family: var(--f-display); font-size: 28px; }
#sleepBtn { height: 64px; min-width: 150px; color: var(--ink); }

/* кнопки у объекта */
#ctx { position: absolute; width: 300px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
#ctx .title { background: var(--paper); border: 4px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 19px; line-height: 1.25; }
#ctx .btn { width: 300px; min-height: 64px; }
#rotate { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: 90vw; padding: 14px 22px; border: 4px solid var(--gold-dark); border-radius: 18px; background: var(--paper); color: var(--ink); font-size: 22px; text-align: center; z-index: 20; pointer-events: none; display: flex; align-items: center; gap: 16px; }
#rotate[hidden], #smallHint[hidden] { display: none; }
#rotate .rot { flex: none; width: 34px; height: 54px; border: 5px solid var(--ink); border-radius: 8px; transform: rotate(90deg); background: var(--gold); }
#smallHint { position: absolute; left: 250px; bottom: 6px; width: 520px; height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 0 18px; border: 4px solid var(--gold-dark); border-radius: 16px; background: var(--paper); z-index: 7; font-size: 20px; }
#smallHint .btn { min-height: 64px; padding: 4px 16px; }

/* диалоги и экраны */
#dlg { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(26, 42, 90, 0.45); }
#dlg[hidden], #screen[hidden], #ctx[hidden], #peekBubble[hidden] { display: none; }
.card { background: var(--paper); border: 4px solid var(--line); border-radius: 18px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15); padding: 20px 26px; width: 880px; max-width: 1000px; max-height: 736px; overflow: auto; }
.card.narrow { width: 640px; }
.reply { margin: 10px 0 0; padding: 8px 14px; border-radius: 10px; background: var(--note); border-left: 8px solid var(--gold); font-weight: 800; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; align-items: stretch; }
.card { touch-action: pan-y; }
.planrow { display: flex; gap: 20px; align-items: center; }
.sign { padding: 12px 18px; margin: 10px 0; border-radius: 10px; background: var(--wood); border: 4px solid #6f4424; color: #fff8e8; font-family: var(--f-display); font-size: 24px; line-height: 1.3; text-align: center; }
.shelf { display: flex; gap: 12px; margin-top: 10px; }
.shopcard { flex: 1; border: 4px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; background: #fffdf6; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 19px; }
.shopcard .qty { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.shopcard .qty b { font-family: var(--f-display); font-weight: 400; font-size: 32px; min-width: 30px; }
.money { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 68px; padding: 6px; border-radius: 12px; background: rgba(0, 0, 0, 0.05); }
.coin, .note { border: 4px solid rgba(0, 0, 0, 0.28); font-family: var(--f-display); font-weight: 400; font-size: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
.coin { width: 64px; height: 64px; border-radius: 50%; }
.note { width: 112px; height: 64px; border-radius: 8px; }
.coin.c1 { background: #d9dde3; } .coin.c2 { background: #f2c94c; } .coin.c3 { background: #d08a4a; }
.note.n1 { background: #7fb3e0; } .note.n2 { background: #c9a27a; } .note.n3 { background: #b38ad6; }
.coin:disabled, .note:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
.slot { position: relative; display: inline-flex; }
.cnt { position: absolute; right: -6px; top: -8px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--ink); color: #fff8e8; font-style: normal; font-size: 16px; line-height: 28px; text-align: center; font-weight: 800; }
.tasks { list-style: none; margin: 8px 0; padding: 0; }
.task { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 12px; margin: 6px 0; border: 4px solid var(--line); border-radius: 14px; background: #fffdf6; font-size: 24px; font-weight: 800; }
.task.next { border-color: var(--gold-dark); background: var(--note); }
.task.done { color: #6a5d49; background: #eef6ea; border-color: #b9d9b4; }
.tk { flex: none; width: 34px; height: 34px; border: 4px solid var(--ink); border-radius: 8px; background: #fff; position: relative; }
.task.done .tk { background: var(--good); border-color: #2f7d47; }
.task.done .tk::after { content: ""; position: absolute; left: 8px; top: 1px; width: 9px; height: 17px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(40deg); }
.goal h3 { margin-top: 14px; }
.pips { display: flex; gap: 8px; margin: 8px 0; }
.pip { flex: 1; height: 22px; border: 4px solid var(--ink); border-radius: 11px; background: #fff; }
.pip.on { background: #f08a24; }
.first { margin: 8px 0; padding: 12px 16px; border-radius: 14px; background: var(--gold); border: 4px solid var(--gold-dark); font-size: 26px; }
.stack { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; }
.digGrid { display: grid; grid-template-columns: 40px repeat(8, 50px); grid-template-rows: 32px repeat(6, 50px); gap: 4px; margin: 10px 0; touch-action: none; }
.digGrid i { font-style: normal; text-align: center; font-weight: 800; color: #8a7a60; line-height: 46px; font-size: 18px; }
.digGrid i.on { color: var(--ink); }
.dc { border-radius: 6px; background: #e5d9b8; border: 0; }
.dc.sel { background: var(--soil); }
.dc.hd { background: var(--gold); box-shadow: inset 0 0 0 3px var(--gold-dark); }
.scr { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(47, 74, 42, 0.92); }
.scr.dark { background: var(--night); color: #fff8e8; flex-direction: column; gap: 14px; text-align: center; }
.scr.dark h1 { font-size: 48px; }
.moon { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 72% 38%, var(--night) 0 38px, transparent 39px), #fff3c4; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.skill { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 16px; line-height: 1.25; padding: 3px 0; border-bottom: 2px solid var(--line); }
.skill small { color: #6a5d49; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
.opts .btn { min-height: 64px; padding: 4px 14px; font-size: 18px; }
.btn[data-hold] { position: relative; overflow: hidden; }
ul.ev { margin: 6px 0; padding-left: 26px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1024" height="768"></canvas>
    <div id="hud">
      <button id="clockBtn" class="clockbtn" data-call="peek" aria-label="Часы"><canvas id="clock" width="112" height="112"></canvas></button>
      <div id="dateChip" class="chip"></div>
      <div id="moneyChip" class="chip"></div>
      <button id="tasksBtn" class="hudbtn" data-call="openTasks">Дела</button>
      <button id="bagBtn" class="hudbtn" data-call="openBag">Рюкзак</button>
      <button id="adultBtn" class="hudbtn" data-hold="2000" data-hold-call="openAdult">Взрослым<i class="hbar"></i></button>
    </div>
    <div id="peekBubble" hidden></div>
    <div id="ctx" hidden></div>
    <div id="bottom">
      <div id="where">Двор</div>
      <button id="sleepBtn" class="btn gold" data-call="askSleep">Спать</button>
    </div>
    <div id="dlg" hidden><div class="card"></div></div>
    <div id="screen" hidden></div>
    <div id="smallHint" hidden><span>Разверните окно пошире</span><button class="btn gold" data-call="hintOk">Понятно</button></div>
  </div>
  <div id="rotate" hidden><span class="rot"></span><span><b>Поверни планшет</b><br>Так игра станет крупнее.</span></div>
</div>
<script>
(function () {

const $ = (id) => document.getElementById(id);

        '</b><button class="btn sq" data-call="cart" data-arg="' + c + '" data-arg2="' + (n + 1) + '"' + (n >= 9 ? " disabled" : "") + ' aria-label="Больше">+</button></div></div>';
    }).join("");
    return ps(d.lines) + '<div class="shelf">' + shelf + "</div>";
  }
  if (d.kind === "pay") {
    const laid = d.data.laid, ds = LOGIC.denoms(S.flags);
    const onC = Object.keys(laid).map(Number).sort((a, b) => b - a).map((k) => '<span class="stack"><button class="' + moneyCls(k) + '" data-call="uncoin" data-arg="' + k + '">' + fmtMoney(k) + "</button>× " + laid[k] + "</span>").join("");
    const tray = ds.map((k) => { const n = walletLeft(d, k); return '<span class="slot"><button class="' + moneyCls(k) + '" data-call="coin" data-arg="' + k + '"' + (n > 0 ? "" : " disabled") + ">" + fmtMoney(k) + '</button><i class="cnt">' + n + "</i></span>"; }).join("");
    return ps(d.lines) + "<h3>Прилавок</h3><div class=\"money\">" + onC + "</div><h3>Кошелёк</h3><div class=\"money\">" + tray + "</div>";
  }
  if (d.kind === "dig") {
    let g = '<div class="digGrid" id="digGrid"><i></i>';
    for (let c = 1; c <= 8; c++) g += '<i class="' + (c <= d.data.cols ? "on" : "") + '">' + c + "</i>";
    for (let r = 1; r <= 6; r++) {
      g += '<i class="' + (r <= d.data.rows ? "on" : "") + '">' + r + "</i>";
      for (let c = 1; c <= 8; c++) g += '<div class="dc' + (r <= d.data.rows && c <= d.data.cols ? " sel" : "") + (r === d.data.rows && c === d.data.cols ? " hd" : "") + '" data-r="' + r + '" data-c="' + c + '"></div>';
    }
    return ps(d.lines) + g + "</div>";
  }
  if (d.kind === "bag") {
    const coins = LOGIC.denoms(S.flags).slice().reverse().filter((k) => S.wallet[k] > 0).map((k) => '<span class="stack"><span class="' + moneyCls(k) + '">' + fmtMoney(k) + "</span>× " + S.wallet[k] + "</span>").join("");
    return ps(d.lines) + "<h3>Кошелёк: " + esc(fmtMoney(money())) + '</h3><div class="money">' + coins + "</div>";
  }
  return ps(d.lines);
}
function renderCtx() {
  const m = S.ui.menu, c = $("ctx");
  if (!m || S.ui.dialog || S.ui.screen) { c.hidden = true; return; }
  c.innerHTML = '<div class="title">' + esc(m.title) + "</div>" + m.buttons.map((b) =>
    '<button class="btn' + (b.act ? " act" : "") + '" data-call="' + (b.id === "close" ? "close" : "act") + '"' + (b.id === "close" ? "" : ' data-arg="' + b.id + '"') + (b.enabled ? "" : " disabled") + "><span>" + esc(b.label) + "</span>" + (b.reason && !b.enabled ? "<small>" + esc(b.reason) + "</small>" : "") + "</button>").join("");
  c.hidden = false;
  const h = c.offsetHeight, st = WORLD.standOf(m.obj, S);
  // над точкой стояния; у верхних объектов — под ней, чтобы не закрывать грядку
  c.style.left = clamp(st[0] * 32 + 16 - 150, 8, 1024 - 308) + "px";
  c.style.top = (st[1] < 12 ? clamp(st[1] * 32 + 40, 104, 768 - 84 - h - 6) : clamp(st[1] * 32 - h - 8, 104, 768 - h - 8)) + "px";
}
function renderDlg() {
  const d = S.ui.dialog, box = $("dlg");
  if (!d || S.ui.screen) { box.hidden = true; return; }
  const card = box.firstElementChild;
  card.className = "card" + (d.kind === "night" || d.kind === "confirm" || d.kind === "bag" ? " narrow" : "");
  card.innerHTML = (d.title ? "<h2>" + esc(d.title) + "</h2>" : "") + bodyHtml(d) + (d.reply ? '<div class="reply">' + esc(d.reply) + "</div>" : "") + buttonsHtml(d.buttons);
  box.hidden = false;
  const pc = $("planClock"); if (pc) drawClock(fitCanvas(pc, 120), d.data.time, 120);
  card.querySelectorAll("canvas.ico").forEach(drawCropIcon);
}
let screenKey = "";
function renderScreen() {
  const s = S.ui.screen, box = $("screen");
  if (!s) { box.hidden = true; screenKey = ""; return; }
  const key = s + JSON.stringify([S.ui.dayEnd, S.settings, S.skills, S.real, S.ui.back, S.beds]);
  box.hidden = false; if (key === screenKey) return; screenKey = key;
  const hold = '<button class="hudbtn" data-hold="2000" data-hold-call="openAdult" style="position:absolute;right:16px;bottom:16px;color:#fff8e8">Взрослым<i class="hbar"></i></button>';
  let html = "";
  if (s === "start") html = '<div class="card narrow" style="text-align:center"><h1>Ферма у реки</h1><div class="row" style="justify-content:center"><button class="btn gold" data-call="closeScreen">Играть</button></div></div>';
  else if (s === "dayEnd") {
    const e = S.ui.dayEnd || { events: [] }, li = (a) => a.map((t) => "<li>" + esc(t) + "</li>").join("");
    html = '<div class="card"><h2>' + esc(e.title) + "</h2>" + (e.first ? '<div class="first"><b>' + esc(e.first.title) + "</b> " + esc(e.first.text) + "</div>" : "") +
      (e.events.length ? '<h3>Сделано сегодня</h3><ul class="ev">' + li(e.events) + "</ul>" : "") + (e.night && e.night.length ? '<h3>Ночью на ферме</h3><ul class="ev">' + li(e.night) + "</ul>" : "") +
      "<p>" + esc(e.wallet) + "</p><p>" + esc(e.tomorrow) + '</p><div class="row"><button class="btn gold" data-call="wake">Доброе утро!</button></div></div>';
  } else if (s === "sleep") {
    const ripe = S.beds.filter((b) => b.crop && b.growth >= CROPS[b.crop].days).map((b) => cropName(b.crop));
    html = '<div class="moon"></div><h1>Куры спят, приходи завтра.</h1>' + (ripe.length ? "<p>На ферме ждёт урожай: " + esc(ripe.filter((c, i) => ripe.indexOf(c) === i).join(", ")) + ".</p>" : "") + hold;
  } else if (s === "adult") {
    const sk = SKILLS.map((p) => {
      const v = S.skills[p[0]], last = v && v.errors.length ? v.errors[v.errors.length - 1] : null;
      return '<div class="skill"><span>' + esc(p[1]) + (last ? "<br><small>день " + last.day + " — " + esc(last.t) + "</small>" : "") + "</span><b>" +
        (v && v.n ? v.hist.reduce((a, x) => a + x, 0) + " из " + v.hist.length + " · уровень " + v.level : "ещё не было") + "</b></div>";
    }).join("");
    const tog = (k, label) => '<button class="btn' + (S.settings[k] ? " sel" : "") + '" data-call="setSetting" data-arg="' + k + '" data-arg2="' + !S.settings[k] + '">' + label + ": " + (S.settings[k] ? "вкл" : "выкл") + "</button>";
    html = '<div class="card" style="width:900px"><h2>Для взрослых</h2><h3>Точность по навыкам</h3><div class="skills">' + sk + '</div><h3>Настройки</h3><div class="opts"><span>Игровых дней в сутки:</span>' +
      [1, 2, 3].map((n) => '<button class="btn' + (S.settings.daysPerReal === n ? " sel" : "") + '" data-call="setSetting" data-arg="daysPerReal" data-arg2="' + n + '">' + n + "</button>").join("") + "</div>" +
      '<div class="opts">' + tog("peekUnlimited", "Цифровое время без ограничения") + tog("split", "Записки по предложениям") + tog("sound", "Звук") + tog("bigFont", "Крупный шрифт") + "</div>" +
      '<div class="row">' + (S.ui.back === "sleep" ? '<button class="btn gold" data-call="allowMore">Разрешить ещё один день сегодня</button>' : "") +
      '<button class="btn" data-hold="3000" data-hold-call="resetGame">Начать игру заново<small>Весь прогресс фермы удалится</small><i class="hbar"></i></button>' +
      '<button class="btn gold" data-call="closeScreen">Закрыть</button></div></div>';
  }
  box.className = "scr" + (s === "sleep" ? " dark" : ""); box.innerHTML = html;
}
function renderUI() {
  const dt = LOGIC.dateOfDay(S.day), pb = $("peekBubble");
  $("dateChip").textContent = dt.short + " · " + LOGIC.dayPart(S.time) + " · " + WEATHER_WORD[LOGIC.weatherOf(S.day)];
  $("moneyChip").textContent = fmtMoney(money());
  const tk = LOGIC.todayTasks(S); $("tasksBtn").textContent = "Дела " + tk.items.filter((i) => i.done).length + "/" + tk.items.length;
  $("where").textContent = S.scene === "farm" ? "Двор" : "Деревня";
  $("app").classList.toggle("big", !!S.settings.bigFont);
  drawClock(fitCanvas($("clock"), CLOCK), S.time, CLOCK);
  pb.hidden = !S.ui.peekText; pb.textContent = S.ui.peekText || "";
  renderCtx(); renderDlg(); renderScreen();
}

/* ---------- 8. INPUT: касание, удержание, клавиатура ---------- */
let scale = 1, hold = null, audio = null;
let hintSeen = false;
try { hintSeen = localStorage.getItem("ferma-hint-small") === "1"; } catch (e) {}
// Масштаб сцены. В портрете показывается плашка «Поверни планшет» (игра работает и так); в маленьком окне один раз — «Разверните окно пошире».
function layout() {
  scale = Math.min(innerWidth / 1024, innerHeight / 768);
  $("stage").style.transform = "translate(" + (innerWidth - 1024 * scale) / 2 + "px," + (innerHeight - 768 * scale) / 2 + "px) scale(" + scale + ")";
  const portrait = innerHeight > innerWidth;
  $("rotate").hidden = !portrait; $("smallHint").hidden = !(scale < 0.8 && !portrait && !hintSeen);
}
function beep(kind) {
  if (!audio || !S.settings.sound) return;
  const tones = { coin: [[880, 0], [1320, 0.06]], done: [[523, 0], [659, 0], [784, 0]], no: [[330, 0]] }[kind];
  tones.forEach((t) => {
    const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t[1];
    o.frequency.value = t[0]; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.15, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.13);
    o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + 0.15);
  });
}
function cancelHold() {
  if (!hold) return;
  clearTimeout(hold.timer); if (hold.bar) { hold.bar.style.transition = "none"; hold.bar.style.width = "0"; } hold = null;
}
function initInput() {
  $("stage").addEventListener("click", (e) => {
    if (S.ui.screen === "sleep") api.checkDate();   // касание экрана сна сверяет настоящую дату
    const b = e.target.closest("button[data-call]"); if (!b || b.disabled) return;
    const args = [b.dataset.arg, b.dataset.arg2].filter((v) => v !== undefined).map(parseArg);
    api[b.dataset.call].apply(null, args);
  });
  document.addEventListener("pointerdown", (e) => {
    try { if (!audio && (window.AudioContext || window.webkitAudioContext)) audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (x) {}
    const t = e.target.closest("[data-hold]"); if (!t) return;
    const ms = +t.dataset.hold, bar = t.querySelector(".hbar");
    if (bar) { bar.style.transition = REDUCED ? "none" : "width " + ms + "ms linear"; bar.style.width = "100%"; }
    t.addEventListener("pointerleave", cancelHold, { once: true });
    hold = { bar, timer: setTimeout(() => { const call = t.dataset.holdCall; cancelHold(); api[call](); }, ms) };
  });
  ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, cancelHold));
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  // касание мира: засчитывается, если палец сдвинулся меньше чем на 12 px
  let down = null;
  cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener("pointerup", (e) => {
    const d0 = down; down = null; if (!d0 || Math.hypot(e.clientX - d0.x, e.clientY - d0.y) >= 12) return;
    const r = cv.getBoundingClientRect(), k = r.width / 1024;
    api.tap(Math.floor((e.clientX - r.left) / k / TILE), Math.floor((e.clientY - r.top) / k / TILE));
  });
  // растягивание грядки: ручка в правом нижнем углу, работает пальцем, пером и мышью
  let drag = false;
  const cellAt = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest(".dc"); return c ? [+c.dataset.r, +c.dataset.c] : null; };
  const dlg = $("dlg");
  dlg.addEventListener("pointerdown", (e) => {
    const c = e.target.closest(".dc"); if (!c) return;
    drag = true; try { dlg.setPointerCapture(e.pointerId); } catch (x) {}
    api.digSize(+c.dataset.r, +c.dataset.c);
  });
  dlg.addEventListener("pointermove", (e) => {
    if (!drag) return; const c = cellAt(e), d = S.ui.dialog;
    if (c && d && d.kind === "dig" && (c[0] !== d.data.rows || c[1] !== d.data.cols)) api.digSize(c[0], c[1]);
  });
  ["pointerup", "pointercancel"].forEach((ev) => dlg.addEventListener(ev, () => { drag = false; }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") api.close(); });
  const relayout = () => { layout(); renderUI(); };
  window.addEventListener("resize", relayout); window.addEventListener("orientationchange", relayout);
  // планшет вернулся из фона или на следующий день: сон сверяется с датой без перезагрузки страницы
  document.addEventListener("visibilitychange", () => { if (!document.hidden) api.checkDate(); });
  window.addEventListener("focus", () => { api.checkDate(); });
}

/* ---------- 9. BOOT: загрузка, цикл кадров, window.FERMA ---------- */
function boot() {
  const ld = STORE.load(), today = STORE.todayKey();
  S = ld.state; S.ui = freshUi();
  if (ld.fresh) { S.real = { date: today, daysToday: 0 }; S.ui.screen = "start"; }
  else {
    if (S.real.date !== today) S.real = { date: today, daysToday: 0 };
    if (S.real.daysToday >= S.settings.daysPerReal) S.ui.screen = "sleep"; else if (S.time >= DAY_END) openNight();
  }
  layout(); initInput(); renderUI(); STORE.save(S);
  STORE.connect(() => S, (remote) => {
    if (S.ui.dialog || S.ui.screen || walker) return;
    const ui = S.ui; S = remote; S.ui = ui; STORE.save(S); renderUI();
  });
  // Кадр в try/catch: одна ошибка не должна остановить холст навсегда. Сообщение пишется один раз.
  let last = 0, reported = false;
  const loop = (t) => {
    try { const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t; stepWalker(dt); drawScene(); }
    catch (e) { if (!reported) { reported = true; console.error("ferma: ошибка кадра", e); } }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { invalidateBg(); renderUI(); });
}
window.FERMA = {
  version: "0.1.0", ready: false,
  logic: LOGIC,
  data: { MAPS, OBJECTS, HOURS, CROPS, NOUNS, WEEKDAYS, SKILLS },
  world: { standOf: (id) => WORLD.standOf(id, S), grid: (scene) => WORLD.grid(scene, S) },
  state: () => Object.assign(JSON.parse(JSON.stringify(S)), { money: money() }),
  api,
  render: () => { renderUI(); drawScene(); }
};
boot();
window.FERMA.ready = true;
})();
</script>
