<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4a2a">
<link rel="manifest" href="manifest-ferma.webmanifest">
<link rel="icon" type="image/png" href="icons/ferma-192.png">
<link rel="apple-touch-icon" href="icons/ferma-180.png">
<meta name="apple-mobile-web-app-title" content="Ферма у реки">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Ферма у реки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Russo+One&display=swap">
<style>
/* Ферма у реки: вид сверху, светлая гамма, бумажные панели. Мир рисуется на canvas, всё нажимаемое — DOM-кнопки от 60 px. */
:root {
  --grass: #6dbb4a; --path: #d8b779; --soil: #8a5a33; --water: #3f8fd8; --wood: #a0673a; --roof: #c8463d;
  --paper: #fffaf0; --ink: #2b2118; --line: #d9c7a3; --gold: #ffc83d; --gold-dark: #b9861a;
  --good: #4caf6a; --warn: #e0763a; --frame: #2f4a2a; --hud: rgba(43, 33, 24, 0.82); --hud-ink: #fff8e8;
  --note: #fff3c4; --night: #1a2a5a;
  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--frame); overflow: hidden; }
/* Планшет: двойное касание не увеличивает, долгое нажатие не открывает меню, выделения текста нет; на карте жесты браузера выключены. */
body { font-family: var(--f-body); font-weight: 700; color: var(--ink); -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app, #stage, #app * { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.15; }
h1 { font-size: 44px; } h2 { font-size: 28px; } h3 { font-size: 20px; margin-top: 10px; }
p { margin: 6px 0; }
#app { position: fixed; inset: 0; background: var(--frame); }
#stage { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; transform-origin: 0 0; overflow: hidden; background: var(--frame); font-size: 22px; line-height: 1.4; }
#app.big #stage { font-size: 26px; }
#cv { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; display: block; image-rendering: pixelated; touch-action: none; }

/* кнопки */
.btn { min-width: 64px; min-height: 64px; padding: 8px 20px; border: 4px solid var(--line); border-radius: 18px; background: var(--paper); font-weight: 800; font-size: 1em; line-height: 1.1; text-align: center; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12); }
.btn.gold { background: var(--gold); border-color: var(--gold-dark); box-shadow: 0 4px 0 var(--gold-dark); }
.btn.sel { border-color: var(--good); background: #e3f4e6; }
.btn:disabled { background: #e8e1d2; color: #7d7364; box-shadow: none; cursor: default; border-color: #d3cab8; }
.btn small { font-size: 16px; font-weight: 700; line-height: 1.1; }
.btn.sq { padding: 0; width: 64px; font-size: 32px; }

/* верхняя полоса */
#hud { position: absolute; left: 0; top: 0; width: 1024px; height: 96px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 126px; background: var(--hud); color: var(--hud-ink); z-index: 3; }
#clockBtn { position: absolute; left: 8px; top: 0; width: 112px; height: 112px; padding: 0; border: 0; border-radius: 50%; background: none; z-index: 4; }
#clock { display: block; }
.chip { height: 64px; padding: 0 10px; display: flex; align-items: center; border-radius: 14px; background: rgba(255, 248, 232, 0.14); font-weight: 800; white-space: nowrap; font-size: 18px; }
#moneyChip { font-family: var(--f-display); font-weight: 400; font-size: 24px; color: var(--gold); }
.hudbtn { min-width: 64px; height: 64px; padding: 0 10px; white-space: nowrap; font-size: 18px; border-radius: 14px; border: 3px solid rgba(255, 248, 232, 0.5); background: transparent; color: var(--hud-ink); font-weight: 800; position: relative; overflow: hidden; }
#tasksBtn { border-color: var(--gold); color: var(--gold); }
#adultBtn { margin-left: auto; opacity: 0.7; }
.hbar { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: var(--gold); }
#peekBubble { position: absolute; left: 8px; top: 98px; padding: 8px 16px; border: 4px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); font-weight: 800; z-index: 4; }

/* нижняя полоса */
#bottom { position: absolute; left: 0; bottom: 0; width: 1024px; height: 84px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--hud); color: var(--hud-ink); z-index: 3; }
#where { font-family: var(--f-display); font-size: 28px; }
#sleepBtn { height: 64px; min-width: 150px; color: var(--ink); }

/* кнопки у объекта */
#ctx { position: absolute; width: 300px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
#ctx .title { background: var(--paper); border: 4px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 19px; line-height: 1.25; }
#ctx .btn { width: 300px; min-height: 64px; }
#rotate { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: 90vw; padding: 14px 22px; border: 4px solid var(--gold-dark); border-radius: 18px; background: var(--paper); color: var(--ink); font-size: 22px; text-align: center; z-index: 20; pointer-events: none; display: flex; align-items: center; gap: 16px; }
#rotate[hidden], #smallHint[hidden] { display: none; }
#rotate .rot { flex: none; width: 34px; height: 54px; border: 5px solid var(--ink); border-radius: 8px; transform: rotate(90deg); background: var(--gold); }
#smallHint { position: absolute; left: 250px; bottom: 6px; width: 520px; height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 0 18px; border: 4px solid var(--gold-dark); border-radius: 16px; background: var(--paper); z-index: 7; font-size: 20px; }
#smallHint .btn { min-height: 64px; padding: 4px 16px; }

/* диалоги и экраны */
#dlg { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; background: rgba(26, 42, 90, 0.45); }
#dlg[hidden], #screen[hidden], #ctx[hidden], #peekBubble[hidden] { display: none; }
.card { background: var(--paper); border: 4px solid var(--line); border-radius: 18px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15); padding: 20px 26px; width: 880px; max-width: 1000px; max-height: 736px; overflow: auto; }
.card.narrow { width: 640px; }
.reply { margin: 10px 0 0; padding: 8px 14px; border-radius: 10px; background: var(--note); border-left: 8px solid var(--gold); font-weight: 800; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; align-items: stretch; }
.card { touch-action: pan-y; }
.planrow { display: flex; gap: 20px; align-items: center; }
.sign { padding: 12px 18px; margin: 10px 0; border-radius: 10px; background: var(--wood); border: 4px solid #6f4424; color: #fff8e8; font-family: var(--f-display); font-size: 24px; line-height: 1.3; text-align: center; }
.shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.shopcard { border: 4px solid var(--line); border-radius: 14px; padding: 6px 10px; background: #fffdf6; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 2px 10px; font-size: 17px; line-height: 1.2; }
.shopcard .txt { display: flex; flex-direction: column; }
.shopcard .txt b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.shopcard .qty { display: flex; align-items: center; gap: 8px; }
.shopcard .qty b { font-family: var(--f-display); font-weight: 400; font-size: 30px; min-width: 26px; text-align: center; }
.money { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 68px; padding: 6px; border-radius: 12px; background: rgba(0, 0, 0, 0.05); }
.coin, .note { border: 4px solid rgba(0, 0, 0, 0.28); font-family: var(--f-display); font-weight: 400; font-size: 20px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2); }
.coin { width: 64px; height: 64px; border-radius: 50%; }
.note { width: 112px; height: 64px; border-radius: 8px; }
.coin.c1 { background: #d9dde3; } .coin.c2 { background: #f2c94c; } .coin.c3 { background: #d08a4a; }
.note.n1 { background: #7fb3e0; } .note.n2 { background: #c9a27a; } .note.n3 { background: #b38ad6; }
.coin:disabled, .note:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
.slot { position: relative; display: inline-flex; }
.cnt { position: absolute; right: -6px; top: -8px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 14px; background: var(--ink); color: #fff8e8; font-style: normal; font-size: 16px; line-height: 28px; text-align: center; font-weight: 800; }
.tasks { list-style: none; margin: 8px 0; padding: 0; }
.task { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 6px 12px; margin: 6px 0; border: 4px solid var(--line); border-radius: 14px; background: #fffdf6; font-size: 24px; font-weight: 800; }
.task.next { border-color: var(--gold-dark); background: var(--note); }
.task.done { color: #6a5d49; background: #eef6ea; border-color: #b9d9b4; }
.tk { flex: none; width: 34px; height: 34px; border: 4px solid var(--ink); border-radius: 8px; background: #fff; position: relative; }
.task.done .tk { background: var(--good); border-color: #2f7d47; }
.task.done .tk::after { content: ""; position: absolute; left: 8px; top: 1px; width: 9px; height: 17px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(40deg); }
.goal h3 { margin-top: 14px; }
.pips { display: flex; gap: 8px; margin: 8px 0; }
.pip { flex: 1; height: 22px; border: 4px solid var(--ink); border-radius: 11px; background: #fff; }
.pip.on { background: #f08a24; }
.first { margin: 8px 0; padding: 12px 16px; border-radius: 14px; background: var(--gold); border: 4px solid var(--gold-dark); font-size: 26px; }
.stack { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; }
.digGrid { display: grid; grid-template-columns: 40px repeat(8, 50px); grid-template-rows: 32px repeat(6, 50px); gap: 4px; margin: 10px 0; touch-action: none; }
.digGrid i { font-style: normal; text-align: center; font-weight: 800; color: #8a7a60; line-height: 46px; font-size: 18px; }
.digGrid i.on { color: var(--ink); }
.dc { border-radius: 6px; background: #e5d9b8; border: 0; }
.dc.sel { background: var(--soil); }
.dc.hd { background: var(--gold); box-shadow: inset 0 0 0 3px var(--gold-dark); }
.scr { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(47, 74, 42, 0.92); }
.scr.dark { background: var(--night); color: #fff8e8; flex-direction: column; gap: 14px; text-align: center; }
.scr.dark h1 { font-size: 48px; }
.moon { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 72% 38%, var(--night) 0 38px, transparent 39px), #fff3c4; }
.skills { column-count: 2; column-gap: 28px; }
.skill { break-inside: avoid; }
.skill { font-size: 16px; line-height: 1.25; padding: 5px 0 6px; border-bottom: 2px solid var(--line); }
.skill .sk1 { display: flex; justify-content: space-between; gap: 10px; }
.skill small { color: #6a5d49; }
.sbar { height: 10px; margin: 3px 0; border-radius: 5px; background: #e5d9b8; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--good); }
.errs { margin: 2px 0 0; padding-left: 18px; font-size: 15px; color: #5a4a35; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; align-items: center; }
.opts .btn { min-height: 64px; padding: 4px 14px; font-size: 18px; }
.btn[data-hold] { position: relative; overflow: hidden; }
ul.ev { margin: 6px 0; padding-left: 26px; }
.bookrow { display: flex; gap: 24px; align-items: flex-start; margin-top: 6px; }
.bookrow .side { flex: 1; min-width: 270px; }
.padval { height: 64px; margin: 6px 0; padding: 0 16px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; font-family: var(--f-display); font-size: 40px; line-height: 56px; text-align: right; letter-spacing: 2px; }
.pad { display: grid; grid-template-columns: repeat(3, 88px); gap: 8px; }
.btn.key { min-width: 88px; width: 88px; height: 72px; padding: 0; font-family: var(--f-display); font-weight: 400; font-size: 32px; }
.btn.key.gold { font-size: 20px; }
.btn.notecard { width: 220px; min-height: 150px; padding: 12px; align-items: flex-start; justify-content: flex-start; text-align: left; background: var(--note); border-color: var(--gold-dark); font-size: 21px; font-weight: 800; transform: rotate(-1deg); }
.btn.notecard:nth-child(even) { transform: rotate(1deg); }
.btn.notecard small { margin-top: auto; font-size: 17px; color: #6a5d49; }
@media (prefers-reduced-motion: reduce) { .btn.notecard, .btn.notecard:nth-child(even) { transform: none; } }
.paper { padding: 18px 22px; border-radius: 6px; background: var(--note); border: 3px solid var(--gold-dark); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12); font-size: 24px; font-weight: 800; line-height: 1.45; }
.paper p { margin: 4px 0; }
.orow { display: flex; align-items: center; gap: 14px; margin: 6px 0; font-size: 22px; }
.orow span { flex: 1; }
.orow b { font-family: var(--f-display); font-weight: 400; font-size: 30px; min-width: 44px; text-align: center; }
.btn.bsel { min-height: 64px; padding: 6px 14px; font-size: 19px; }
.btn.wt { min-width: 72px; height: 72px; padding: 0 8px; font-size: 20px; border-radius: 14px; background: #cfd3d8; border-color: #8f959b; }
#scaleCv { display: block; width: 560px; height: 236px; flex: none; }
.wrow { display: flex; gap: 12px; align-items: flex-start; }
.wside { flex: 1; }
.wside h3 { margin-top: 0; }
.wshelf { display: flex; flex-wrap: wrap; gap: 12px 8px; }
.wline { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 4px; }
.wline .stp { margin: 0 0 0 auto; }
.small { margin: 6px 0 0; font-size: 18px; }
.bar { height: 28px; margin: 10px 0; border: 4px solid var(--ink); border-radius: 14px; background: #fff; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); }
.saleRow { display: flex; gap: 20px; align-items: flex-start; margin-top: 6px; }
.cust { text-align: center; min-width: 90px; }
.cust canvas { display: block; margin: 0 auto 4px; }
.saleRow .side { flex: 1; }
.bubble { padding: 12px 16px; border-radius: 14px; background: var(--note); border: 4px solid var(--gold-dark); font-weight: 800; font-size: 24px; line-height: 1.3; }
.paid { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
table.pt { border-collapse: collapse; width: 100%; font-size: 18px; margin: 6px 0; }
table.pt th, table.pt td { border: 2px solid var(--line); padding: 4px 6px; text-align: center; }
table.pt td:first-child { text-align: left; white-space: nowrap; }
table.pt th { background: #f3e8cc; }
table.pt .today { background: var(--note); box-shadow: inset 0 0 0 3px var(--gold-dark); }
.stp { display: flex; align-items: center; gap: 14px; margin: 8px 0; font-size: 24px; }
.stp b { font-family: var(--f-display); font-weight: 400; font-size: 34px; min-width: 56px; text-align: center; }
.bks { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.bskt { width: 150px; padding: 8px; border: 4px solid var(--line); border-radius: 14px; background: #f6e7c8; text-align: center; }
.bskt b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 30px; }
.bskt.warn { border-color: var(--warn); background: #fde3cf; }
.bskt.hl { border-color: var(--gold-dark); background: var(--note); }
.bskt .bb { display: flex; gap: 8px; justify-content: center; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; min-height: 36px; align-content: flex-start; }
.ap { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.35); }
.ap.rd { background: #e0453a; } .ap.gr { background: #8cc63f; }
.ap.big { display: inline-block; width: 44px; height: 44px; border-width: 3px; }
.dragsrc { display: inline-flex; align-items: center; gap: 12px; min-height: 64px; margin-top: 8px; padding: 6px 18px; border: 4px dashed var(--gold-dark); border-radius: 16px; background: var(--note); font-size: 19px; font-weight: 800; touch-action: none; cursor: grab; }
.ghost { position: fixed; z-index: 60; pointer-events: none; border-radius: 50%; border: 3px solid rgba(0, 0, 0, 0.35); }
#tapeCv, #packCv, #calCv { display: block; }
#tapeCv.tcut { touch-action: none; cursor: pointer; margin: 10px 0; }
.fcrow { display: flex; gap: 12px; margin: 8px 0; }
.fc { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px; border: 4px solid var(--line); border-radius: 14px; background: #fffdf6; font-size: 18px; }
.fc.today { border-color: var(--gold-dark); background: var(--note); }
.fc b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.fc small { color: #6a5d49; font-size: 15px; }
.packrow { display: flex; gap: 20px; align-items: flex-start; margin-top: 6px; }
.packrow .pcol { flex: 1; min-width: 0; }
.fieldrow { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.btn.pf { width: 100%; flex-direction: row; justify-content: space-between; font-size: 22px; padding: 4px 18px; }
.btn.pf b { font-family: var(--f-display); font-weight: 400; font-size: 36px; min-width: 90px; text-align: right; }
.pile { padding: 6px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.05); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="1024" height="768"></canvas>
    <div id="hud">
      <button id="clockBtn" class="clockbtn" data-call="peek" aria-label="Часы"><canvas id="clock" width="112" height="112"></canvas></button>
      <div id="dateChip" class="chip"></div>
      <div id="moneyChip" class="chip"></div>
      <button id="tasksBtn" class="hudbtn" data-call="openTasks">Дела</button>
      <button id="ordersBtn" class="hudbtn" data-call="openOrders">Заказы</button>
      <button id="bagBtn" class="hudbtn" data-call="openBag">Рюкзак</button>
      <button id="adultBtn" class="hudbtn" data-hold="2000" data-hold-call="openAdult">Взрослым<i class="hbar"></i></button>
    </div>
    <div id="peekBubble" hidden></div>
    <div id="ctx" hidden></div>
    <div id="bottom">
      <div id="where">Двор</div>
      <button id="sleepBtn" class="btn gold" data-call="askSleep">Спать</button>
    </div>
    <div id="dlg" hidden><div class="card"></div></div>
    <div id="screen" hidden></div>
    <div id="smallHint" hidden><span>Разверните окно пошире</span><button class="btn gold" data-call="hintOk">Понятно</button></div>
  </div>
  <div id="rotate" hidden><span class="rot"></span><span><b>Поверни планшет</b><br>Так игра станет крупнее.</span></div>
</div>
<script>
(function () {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------- 1. CONTENT: таблицы без логики ---------- */
const TILE = 32, MW = 32, MH = 24, DAY_START = 420, DAY_END = 1260, ROAD = 30;
const PAL = {
  grass: "#6dbb4a", grass2: "#5aa63e", tuft: "#4b8f33", path: "#d8b779", pathDark: "#c19a5b",
  soil: "#8a5a33", soilWet: "#4a2f1b", furrow: "#6e4527", water: "#3f8fd8", waterLight: "#6fb5ef", waterDark: "#2f6fb0",
  wood: "#a0673a", woodDark: "#6f4424", roof: "#c8463d", roofDark: "#9a3029", wall: "#f1e3c6", wallShade: "#d9c49c", window: "#9fd3f0",
  crown: "#3e8e3a", crownLight: "#57a94a", trunk: "#7a4f2c", carrot: "#f08a24", leaf: "#49b04a", cabbage: "#9ad77a", zucchini: "#3f8f3f",
  appleRed: "#e0453a", appleGreen: "#8cc63f", skin: "#f2c49b", hair: "#6b3e1f", shirt: "#e85d3a", overall: "#3f6fb5",
  highlight: "#ffd23f", night: "#1a2a5a", ink: "#2b2118", paper: "#fffaf0"
};

/* ---------- 4. WORLD: карты, объекты, поиск пути ---------- */
let S = STORE.defaultState();
const WORLD = (function () {
  const maps = {}; ["farm", "village"].forEach((s) => { maps[s] = LOGIC.parseMap(MAPS[s], s); });
  const bedOf = (st, n) => st.beds.find((b) => b.id === n);
  function standOf(id, st) {
    const o = OBJECTS[id];
    if (!o.bed) return o.stand;
    const b = bedOf(st, o.bed), p = PLOTS[o.bed];
    return b && b.rows ? [p[0] + Math.floor(b.cols / 2), p[1] + b.rows] : [p[0] + 3, p[1] + 4];
  }
  // Сетка проходимости: карта минус клетки грядок.
  function grid(scene, st) {
    const g = maps[scene].walk.map((r) => r.slice());
    if (scene === "farm") st.beds.forEach((b) => { for (let i = 0; i < b.rows * b.cols; i++) g[PLOTS[b.plot][1] + Math.floor(i / b.cols)][PLOTS[b.plot][0] + (i % b.cols)] = false; });
    return g;
  }
  function objAt(scene, x, y) {
    for (const id in OBJECTS) { const o = OBJECTS[id]; if (o.scene === scene && !(o.needs && !S.flags[o.needs]) && o.tiles.some((t) => t[0] === x && t[1] === y)) return id; }
    return null;
  }
  // Куда идти по нажатию на тайл: объект → его точка стояния; проходимый тайл → он сам; иначе ближайший проходимый сосед.
  function routeTo(st, tx, ty) {
    if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return null;
    const g = grid(st.scene, st), from = [st.player.x, st.player.y], id = objAt(st.scene, tx, ty);
    if (id) { const path = LOGIC.bfs(g, from, standOf(id, st)); return path ? { path, obj: id } : null; }
    if (g[ty][tx]) { const path = LOGIC.bfs(g, from, [tx, ty]); return path ? { path, obj: null } : null; }
    let best = null;
    [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach((d) => {
      const x = tx + d[0], y = ty + d[1];
      if (x < 0 || y < 0 || x >= MW || y >= MH || !g[y][x]) return;
      const path = LOGIC.bfs(g, from, [x, y]);

    return best ? { path: best, obj: null } : null;
  }

})();

/* --- меню у объекта --- */
function bedTitle(b) {
  const head = "Грядка " + b.id;
  if (!b.rows) return head + ". Земля не размечена.";
  if (!b.crop) return head + ": " + rowsBy(b.rows, b.cols) + ".";
  const c = CROPS[b.crop], left = c.days - b.growth, name = head + ": " + c.name.toLowerCase() + ". ";
  if (left <= 0) return name + "Урожай созрел!";
  return name + "Созреет через " + nounPhrase(left, "день") + ", " + LOGIC.weekdayForm(LOGIC.dateOfDay(S.day + left).wd, "в") + "." + (b.watered ? "" : " Сегодня не полита — без полива не растёт.");
}
// Причина, по которой «Посеять» серая. Кнопка живая, только если есть семена и хотя бы одну культуру успеем посеять до 21:00.
function sowReason(b, only) {
  if (!b.rows) return "Сначала размети грядку";
  const crops = (only ? [only] : CROP_LIST).filter((c) => seedsOf(c) > 0);
  if (!crops.length) return "Нужны семена — купи в магазине";
  const can = crops.some((c) => !timeReason(15 * LOGIC.sow(b.rows, b.cols, seedsOf(c), only ? b.sown : null).rowsUsed));
  return can ? "" : "До 21:00 не успеть";
}
function buildMenu(id) {

    const b = bedById(o.bed), rain = LOGIC.weatherOf(S.day) === "rain";
    title = bedTitle(b);

    if (!b.crop) {
      btns.push(mb("dig", timeReason(ACTIONS.dig.min)));
      btns.push(mb("sow", sowReason(b)));
    } else if (b.highlight.length) {
      btns.push(mb("resow", b.sownDay !== S.day ? "Досеять нельзя: остальные уже растут." : sowReason(b, b.crop)));
    }
    // Одна кнопка на всю грядку: полив — 10 минут за ряд, сбор — 5 минут за ряд (время считается как за рядами, но нажатие одно).

    if (d.kind === "tape" && id === "cut") return submitTape(d);
    if (d.kind === "pack" && id === "next") { const t = d.data, n = LOGIC.divParts(t.total, packSize(t)).full; t.step = Math.min(n, t.step + 1); d.reply = null; return OK(); }
    if (d.kind === "book" && id === "next") { d.data.step = Math.min(d.data.h.rows, d.data.step + 1); d.reply = d.data.step >= d.data.h.rows ? "Теперь запиши, сколько всего." : null; return OK(); }
    return OK();

  coin(den) {

      const o = orderById(d.data.oid), ch = d.data.offer.change; if (!o || d.data.done) return fail("Нет сдачи");

  basketTap(i) {

  // basketMove(из, в): -1 — куча (в «поровну») или рюкзак (в корзинках по числу).

      return '<div class="shopcard"><canvas class="ico" data-crop="' + c + '" width="48" height="48"></canvas><div class="txt"><b>' + cr.name + "</b><span>пакетик — " + nounPhrase(packetOf(c), "семя") + "</span><span>" +
        fmtMoney(cr.price) + " · растёт " + nounPhrase(cr.days, "день") + '</span></div><div class="qty"><button class="btn sq" data-call="cart" data-arg="' + c + '" data-arg2="' + (n - 1) + '"' + (n <= 0 ? " disabled" : "") + ' aria-label="Меньше">−</button><b>' + n +
        '</b><button class="btn sq" data-call="cart" data-arg="' + c + '" data-arg2="' + (n + 1) + '"' + (n >= 9 ? " disabled" : "") + ' aria-label="Больше">+</button></div></div>';
    }).join("");

  }
  if (d.kind === "pay") {

    const tray = ds.map((k) => { const n = walletLeft(d, k); return '<span class="slot"><button class="' + moneyCls(k) + '" data-call="coin" data-arg="' + k + '"' + (n > 0 ? "" : " disabled") + ">" + fmtMoney(k) + '</button><i class="cnt">' + n + "</i></span>"; }).join("");
    return ps(d.lines) + "<h3>Прилавок</h3><div class=\"money\">" + onC + "</div><h3>" + (d.data.env ? "Конверт с деньгами" : "Кошелёк") + "</h3><div class=\"money\">" + tray + "</div>";
  }
  if (d.kind === "errandShop") {
    const shelf = Object.keys(ERRANDS).map((k) => {
      const n = d.data.cart[k] || 0, e = ERRANDS[k];
      return '<div class="shopcard"><span></span><div class="txt"><b>' + e.label + "</b><span>" + (e.unit === "мешок" ? "мешок" : "пакетик") + " — " + fmtMoney(e.price) + '</span></div><div class="qty"><button class="btn sq" data-call="cartErrand" data-arg="' + k + '" data-arg2="' + (n - 1) + '"' + (n <= 0 ? " disabled" : "") + ' aria-label="Меньше">−</button><b>' + n + '</b><button class="btn sq" data-call="cartErrand" data-arg="' + k + '" data-arg2="' + (n + 1) + '"' + (n >= 9 ? " disabled" : "") + ' aria-label="Больше">+</button></div></div>';
    }).join("");
    return ps(d.lines) + '<div class="shelf">' + shelf + "</div>";
  }
  if (d.kind === "dig") {
    let g = '<div class="digGrid" id="digGrid"><i></i>';
    for (let c = 1; c <= 8; c++) g += '<i class="' + (c <= d.data.cols ? "on" : "") + '">' + c + "</i>";
    for (let r = 1; r <= 6; r++) {
      g += '<i class="' + (r <= d.data.rows ? "on" : "") + '">' + r + "</i>";
      for (let c = 1; c <= 8; c++) g += '<div class="dc' + (r <= d.data.rows && c <= d.data.cols ? " sel" : "") + (r === d.data.rows && c === d.data.cols ? " hd" : "") + '" data-r="' + r + '" data-c="' + c + '"></div>';
    }
    return ps(d.lines) + g + "</div>";
  }
  if (d.kind === "bag") {
    const coins = LOGIC.denoms(S.flags).slice().reverse().filter((k) => S.wallet[k] > 0).map((k) => '<span class="stack"><span class="' + moneyCls(k) + '">' + fmtMoney(k) + "</span>× " + S.wallet[k] + "</span>").join("");
    return ps(d.lines) + "<h3>Кошелёк: " + esc(fmtMoney(money())) + '</h3><div class="money">' + coins + "</div>";
  }
  return ps(d.lines);
}
function renderCtx() {
  const m = S.ui.menu, c = $("ctx");
  if (!m || S.ui.dialog || S.ui.screen) { c.hidden = true; return; }
  c.innerHTML = '<div class="title">' + esc(m.title) + "</div>" + m.buttons.map((b) =>
    '<button class="btn' + (b.act ? " act" : "") + '" data-call="' + (b.id === "close" ? "close" : "act") + '"' + (b.id === "close" ? "" : ' data-arg="' + b.id + '"') + (b.enabled ? "" : " disabled") + "><span>" + esc(b.label) + "</span>" + (b.reason && !b.enabled ? "<small>" + esc(b.reason) + "</small>" : "") + "</button>").join("");
  c.hidden = false;
  const h = c.offsetHeight, st = WORLD.standOf(m.obj, S);
  // над точкой стояния; у верхних объектов — под ней, чтобы не закрывать грядку
  c.style.left = clamp(st[0] * 32 + 16 - 150, 8, 1024 - 308) + "px";
  c.style.top = (st[1] < 12 ? clamp(st[1] * 32 + 40, 104, 768 - 84 - h - 6) : clamp(st[1] * 32 - h - 8, 104, 768 - h - 8)) + "px";
}
function renderDlg() {
  const d = S.ui.dialog, box = $("dlg");

  card.className = "card" + (d.kind === "night" || d.kind === "confirm" || d.kind === "bag" ? " narrow" : "");

  const bk = $("bookCv"); if (bk) drawBook(bk, d.data);
  const pk = $("packCv"); if (pk) drawPack(pk, d.data);
  const cal = $("calCv"); if (cal) drawCalendar(cal);

  card.querySelectorAll("canvas.wi").forEach((cv) => { const g = cv.getContext("2d"); g.clearRect(0, 0, 80, 64); drawWeatherIcon(g, cv.dataset.w, 40, 32, 1.7); });
  const sc = $("scaleCv"); if (sc) { sc._c = fitRect(sc, 560, 236); drawScale(); }
  card.querySelectorAll("canvas.fig").forEach((c) => drawFig(c, c.dataset.name));
}
let screenKey = "";
function renderScreen() {
  const s = S.ui.screen, box = $("screen");
  if (!s) { box.hidden = true; screenKey = ""; return; }
  const key = s + JSON.stringify([S.ui.dayEnd, S.settings, S.skills, S.real, S.ui.back, S.beds, S.log.days.length, S.stats]);
  box.hidden = false; if (key === screenKey) return; screenKey = key;
  const hold = '<button class="hudbtn" data-hold="2000" data-hold-call="openAdult" style="position:absolute;right:16px;bottom:16px;color:#fff8e8">Взрослым<i class="hbar"></i></button>';
  let html = "";
  if (s === "start") html = '<div class="card narrow" style="text-align:center"><h1>Ферма у реки</h1><div class="row" style="justify-content:center"><button class="btn gold" data-call="closeScreen">Играть</button></div></div>';
  else if (s === "dayEnd") {
    const e = S.ui.dayEnd || { events: [] }, li = (a) => a.map((t) => "<li>" + esc(t) + "</li>").join("");
    html = '<div class="card"><h2>' + esc(e.title) + "</h2>" + (e.first ? '<div class="first"><b>' + esc(e.first.title) + "</b> " + esc(e.first.text) + "</div>" : "") +
      (e.events.length ? '<h3>Сделано сегодня</h3><ul class="ev">' + li(e.events) + "</ul>" : "") + (e.night && e.night.length ? '<h3>Ночью на ферме</h3><ul class="ev">' + li(e.night) + "</ul>" : "") +
      "<p>" + esc(e.wallet) + "</p>" + (e.piggy ? "<p>" + esc(e.piggy) + "</p>" : "") + "<p>" + esc(e.tomorrow) + "</p>" + (e.orders ? "<p>" + esc(e.orders) + "</p>" : "") + '<div class="row"><button class="btn gold" data-call="wake">Доброе утро!</button></div></div>';
  } else if (s === "sleep") {
    const ripe = S.beds.filter((b) => b.crop && b.growth >= CROPS[b.crop].days).map((b) => cropName(b.crop));
    html = '<div class="moon"></div><h1>Куры спят, приходи завтра.</h1>' + (ripe.length ? "<p>На ферме ждёт урожай: " + esc(ripe.filter((c, i) => ripe.indexOf(c) === i).join(", ")) + ".</p>" : "") + hold;
  } else if (s === "adult") {
    // По каждому навыку: точность за последние 20 попыток, уровень, когда был последний раз и примеры ошибок (последние три).
    const sk = SKILLS.map((p) => {
      const v = S.skills[p[0]], h = v ? v.hist.slice(-20) : [], n = h.length, ok = sumArr(h), errs = v ? v.errors.slice(-3).reverse() : [];
      return '<div class="skill"><div class="sk1"><b>' + esc(p[1]) + "</b><span>" + (n ? ok + " из " + n + " · уровень " + v.level + ": " + esc(LEVEL_TEXT[p[0]][v.level - 1]) : "ещё не было") + '</span></div><div class="sbar"><i style="width:' + (n ? Math.round(ok / n * 100) : 0) + '%"></i></div>' +
        (n ? "<small>последний раз: день " + v.last + "</small>" : "") + (errs.length ? '<ul class="errs">' + errs.map((e) => "<li>день " + e.day + " — " + esc(e.t) + "</li>").join("") + "</ul>" : "") + "</div>";
    }).join("");
    // Дни по реальным датам: сколько игровых дней сыграно и сколько заработано.
    const byDate = {}; S.log.days.forEach((x) => { const k = x.date || "—"; (byDate[k] = byDate[k] || { n: 0, earned: 0 }); byDate[k].n++; byDate[k].earned += x.earned || 0; });
    const dates = Object.keys(byDate).sort().slice(-7).reverse(), daysTable = dates.length ? '<h3>Дни</h3><table class="pt"><tr><th>Дата</th><th>Игровых дней</th><th>Заработано</th></tr>' + dates.map((k) => "<tr><td>" + esc(k.split("-").reverse().join(".")) + "</td><td>" + byDate[k].n + "</td><td>" + esc(fmtMoney(byDate[k].earned)) + "</td></tr>").join("") + "</table>" : "";
    const st = S.stats, stats = "<p class=\"small\">Выполнено заказов: " + st.ordersDone + ". Продаж покупателям: " + st.sold + ". Записано урожая: " + nounPhrase(st.harvested, "штука") + ".</p>";
    const tog = (k, label) => '<button class="btn' + (S.settings[k] ? " sel" : "") + '" data-call="setSetting" data-arg="' + k + '" data-arg2="' + !S.settings[k] + '">' + label + ": " + (S.settings[k] ? "вкл" : "выкл") + "</button>";
    // Сверху настройки и кнопки, ниже точность по навыкам, сводка и дни: родителю не надо прокручивать, чтобы изменить настройку.
    html = '<div class="card" style="width:900px"><h2>Для взрослых</h2><div class="opts"><span>Игровых дней в сутки:</span>' +
      [1, 2, 3].map((n) => '<button class="btn' + (S.settings.daysPerReal === n ? " sel" : "") + '" data-call="setSetting" data-arg="daysPerReal" data-arg2="' + n + '">' + n + "</button>").join("") + "</div>" +
      '<div class="opts">' + tog("peekUnlimited", "Цифровое время без ограничения") + tog("split", "Записки по предложениям") + tog("sound", "Звук") + tog("bigFont", "Крупный шрифт") + "</div>" +
      '<div class="row">' + (S.ui.back === "sleep" ? '<button class="btn gold" data-call="allowMore">Разрешить ещё один день сегодня</button>' : "") +
      '<button class="btn" data-hold="3000" data-hold-call="resetGame">Начать игру заново<small>Весь прогресс фермы удалится</small><i class="hbar"></i></button>' +
      '<button class="btn gold" data-call="closeScreen">Закрыть</button></div>' +
      '<h3>Точность по навыкам (последние 20 попыток)</h3><div class="skills">' + sk + "</div>" + stats + daysTable + "</div>";
  }
  box.className = "scr" + (s === "sleep" ? " dark" : ""); box.innerHTML = html;
}
function renderUI() {
  const dt = LOGIC.dateOfDay(S.day), pb = $("peekBubble");
  $("dateChip").textContent = dt.short + " · " + LOGIC.dayPart(S.time) + " · " + WEATHER_WORD[LOGIC.weatherOf(S.day)];
  $("moneyChip").textContent = fmtMoney(money());
  const tk = LOGIC.todayTasks(S); $("tasksBtn").textContent = "Дела " + tk.items.filter((i) => i.done).length + "/" + tk.items.length;
  $("ordersBtn").textContent = S.orders.active.length ? "Заказы " + S.orders.active.length : "Заказы";
  $("where").textContent = S.scene === "farm" ? "Двор" : "Деревня";
  $("app").classList.toggle("big", !!S.settings.bigFont);
  drawClock(fitCanvas($("clock"), CLOCK), S.time, CLOCK);

  renderCtx(); renderDlg(); renderScreen();
}

/* ---------- 8. INPUT: касание, удержание, клавиатура ---------- */
let scale = 1, hold = null, audio = null;
let hintSeen = false;
try { hintSeen = localStorage.getItem("ferma-hint-small") === "1"; } catch (e) {}
// Масштаб сцены. В портрете показывается плашка «Поверни планшет» (игра работает и так); в маленьком окне один раз — «Разверните окно пошире».
function layout() {
  scale = Math.min(innerWidth / 1024, innerHeight / 768);
  $("stage").style.transform = "translate(" + (innerWidth - 1024 * scale) / 2 + "px," + (innerHeight - 768 * scale) / 2 + "px) scale(" + scale + ")";
  const portrait = innerHeight > innerWidth;
  $("rotate").hidden = !portrait; $("smallHint").hidden = !(scale < 0.8 && !portrait && !hintSeen);
}
function beep(kind) {
  if (!audio || !S.settings.sound) return;
  const tones = { coin: [[880, 0], [1320, 0.06]], done: [[523, 0], [659, 0], [784, 0]], no: [[330, 0]] }[kind];
  tones.forEach((t) => {
    const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t[1];
    o.frequency.value = t[0]; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.15, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.13);
    o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at + 0.15);
  });
}
function cancelHold() {
  if (!hold) return;
  clearTimeout(hold.timer); if (hold.bar) { hold.bar.style.transition = "none"; hold.bar.style.width = "0"; } hold = null;
}
function initInput() {
  $("stage").addEventListener("click", (e) => {
    if (S.ui.screen === "sleep") api.checkDate();   // касание экрана сна сверяет настоящую дату
    const b = e.target.closest("button[data-call]"); if (!b || b.disabled) return;
    const args = [b.dataset.arg, b.dataset.arg2].filter((v) => v !== undefined).map(parseArg);
    api[b.dataset.call].apply(null, args);
  });
  document.addEventListener("pointerdown", (e) => {
    try { if (!audio && (window.AudioContext || window.webkitAudioContext)) audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (x) {}
    const t = e.target.closest("[data-hold]"); if (!t) return;
    const ms = +t.dataset.hold, bar = t.querySelector(".hbar");
    if (bar) { bar.style.transition = REDUCED ? "none" : "width " + ms + "ms linear"; bar.style.width = "100%"; }
    t.addEventListener("pointerleave", cancelHold, { once: true });
    hold = { bar, timer: setTimeout(() => { const call = t.dataset.holdCall; cancelHold(); api[call](); }, ms) };
  });
  ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, cancelHold));
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  // касание мира: засчитывается, если палец сдвинулся меньше чем на 12 px
  let down = null;
  cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener("pointerup", (e) => {
    const d0 = down; down = null; if (!d0 || Math.hypot(e.clientX - d0.x, e.clientY - d0.y) >= 12) return;
    const r = cv.getBoundingClientRect(), k = r.width / 1024;
    api.tap(Math.floor((e.clientX - r.left) / k / TILE), Math.floor((e.clientY - r.top) / k / TILE));
  });
  // растягивание грядки: ручка в правом нижнем углу, работает пальцем, пером и мышью
  let drag = false;
  const cellAt = (e) => { const t = document.elementFromPoint(e.clientX, e.clientY), c = t && t.closest && t.closest(".dc"); return c ? [+c.dataset.r, +c.dataset.c] : null; };
  const dlg = $("dlg");
  // метка пилы: нажми или проведи по доске на ленте (палец, перо, мышь)
  let sawDrag = false, appleDrag = null;
  const moveGhost = (e) => { if (appleDrag) { appleDrag.style.left = e.clientX - appleDrag.offsetWidth / 2 + "px"; appleDrag.style.top = e.clientY - appleDrag.offsetHeight / 2 + "px"; } };
  const dropApple = (e, cancel) => {
    if (!appleDrag) return;
    const g = appleDrag; appleDrag = null; g.remove(); if (cancel) return;
    const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest ? el.closest(".bskt") : null;
    if (b) api.basketTap(+b.dataset.i);
  };
  const sawAt = (e) => { const cvt = $("tapeCv"); if (cvt && cvt.classList.contains("tcut")) { const r = cvt.getBoundingClientRect(); api.tapeMark(((e.clientX - r.left) / r.width * 800 - 10) / 2.6); } };
  dlg.addEventListener("pointerdown", (e) => {
    const srcEl = e.target.closest("[data-drag]");
    if (srcEl) {
      const d0 = S.ui.dialog, green = d0 && d0.data && d0.data.sort === "apple:green", g = document.createElement("div"), sz = 44 * scale;
      g.className = "ghost ap " + (green ? "gr" : "rd"); g.style.width = g.style.height = sz + "px"; document.body.appendChild(g); appleDrag = g; moveGhost(e);
      try { dlg.setPointerCapture(e.pointerId); } catch (x) {} return;
    }
    if (e.target.closest("canvas.tcut")) { sawDrag = true; try { dlg.setPointerCapture(e.pointerId); } catch (x) {} sawAt(e); return; }
    const c = e.target.closest(".dc"); if (!c) return;
    drag = true; try { dlg.setPointerCapture(e.pointerId); } catch (x) {}
    api.digSize(+c.dataset.r, +c.dataset.c);
  });
  dlg.addEventListener("pointermove", (e) => {
    if (appleDrag) { moveGhost(e); return; }
    if (sawDrag) { sawAt(e); return; }
    if (!drag) return; const c = cellAt(e), d = S.ui.dialog;
    if (c && d && d.kind === "dig" && (c[0] !== d.data.rows || c[1] !== d.data.cols)) api.digSize(c[0], c[1]);
  });
  dlg.addEventListener("pointerup", (e) => { dropApple(e, false); drag = false; sawDrag = false; });
  dlg.addEventListener("pointercancel", (e) => { dropApple(e, true); drag = false; sawDrag = false; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { api.close(); return; }
    const d = S.ui.dialog; if (!d || S.ui.screen || !(d.kind === "book" || d.kind === "share" || d.kind === "pack" || d.kind === "tape")) return;
    if (/^\d$/.test(e.key)) api.padKey(+e.key); else if (e.key === "Backspace") api.padKey("del"); else if (e.key === "Enter") api.submit();
  });
  const relayout = () => { layout(); renderUI(); };
  window.addEventListener("resize", relayout); window.addEventListener("orientationchange", relayout);
  // планшет вернулся из фона или на следующий день: сон сверяется с датой без перезагрузки страницы
  document.addEventListener("visibilitychange", () => { if (!document.hidden) api.checkDate(); });
  window.addEventListener("focus", () => { api.checkDate(); });
}

/* ---------- 9. BOOT: загрузка, цикл кадров, window.FERMA ---------- */
function boot() {
  const ld = STORE.load(), today = STORE.todayKey();
  S = ld.state; S.ui = freshUi();
  if (ld.fresh) { S.real = { date: today, daysToday: 0 }; S.ui.screen = "start"; }
  else {
    if (S.real.date !== today) S.real = { date: today, daysToday: 0 };
    if (S.real.daysToday >= S.settings.daysPerReal) S.ui.screen = "sleep"; else if (S.time >= DAY_END) openNight();
  }
  // Первый настоящий запуск (и сохранение, которое ни разу не начинало день): утренние записки и покупатель уже в первый день.
  if (S.orders.genDay !== S.day) startDay();
  layout(); initInput(); renderUI(); STORE.save(S);
  STORE.connect(() => S, (remote) => {
    if (S.ui.dialog || S.ui.screen || walker) return;
    const ui = S.ui; S = remote; S.ui = ui; STORE.save(S); renderUI();
  });
  // Кадр в try/catch: одна ошибка не должна остановить холст навсегда. Сообщение пишется один раз.
  let last = 0, reported = false;
  const loop = (t) => {
    try { const dt = Math.min(0.1, (t - last) / 1000 || 0); last = t; stepWalker(dt); drawScene(); drawScale(); }
    catch (e) { if (!reported) { reported = true; console.error("ferma: ошибка кадра", e); } }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { invalidateBg(); renderUI(); });
}
window.FERMA = {
  version: "1.0.1", ready: false,
  logic: LOGIC,
  data: { MAPS, OBJECTS, HOURS, CROPS, NOUNS, WEEKDAYS, SKILLS, GOALS, LEVEL_TEXT, ITEMS, SCHEMA: STORE.SCHEMA },
  world: { standOf: (id) => WORLD.standOf(id, S), grid: (scene) => WORLD.grid(scene, S) },
  state: () => Object.assign(JSON.parse(JSON.stringify(S)), { money: money() }),
  api,
  render: () => { renderUI(); drawScene(); }
};
boot();
window.FERMA.ready = true;
})();
