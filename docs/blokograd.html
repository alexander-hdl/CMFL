<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<link rel="manifest" href="manifest-blok.webmanifest">
<link rel="icon" type="image/png" href="icons/blok-192.png">
<link rel="apple-touch-icon" href="icons/blok-180.png">
<meta name="apple-mobile-web-app-title" content="Блокоград">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Блокоград</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Russo+One&display=swap">
<style>
/* Layout: a full-screen voxel island under a thin top bar and a chunky bottom toolbar; dialogs are big cream "boards" with 48px+ controls.
   One committed look for the game: daytime sky, warm wood panels, parchment boards, grass-green accent, coin gold. */
:root {
  --sky: #8fd3ff;
  --wood: #6b4423;
  --wood-2: #8a5a2e;
  --wood-line: #3f2814;
  --board: #fff6dc;
  --board-2: #f3e6bf;
  --board-line: #c9b27c;
  --ink: #2a1d0e;
  --muted: #6e5a3c;
  --grass: #4caf50;
  --grass-ink: #0c2a0e;
  --gold: #ffc83d;
  --gold-ink: #3a2a00;
  --warn: #ff9f1c;
  --bad: #e5484d;
  --good: #2e9d5c;
  --blue: #2f80ed;
  --f-display: "Russo One", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--sky); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.35; font-weight: 600; -webkit-text-size-adjust: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }

#app { position: fixed; inset: 0; overflow: hidden; }
#c3d { position: absolute; inset: 0; }
#c3d canvas { display: block; width: 100%; height: 100%; }

/* Top bar */
#top { position: absolute; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
.chip { display: flex; align-items: center; gap: 8px; background: var(--board); border: 3px solid var(--wood); border-radius: 999px; padding: 6px 14px 6px 10px; min-height: 48px; box-shadow: 0 3px 0 var(--wood-line); font-family: var(--f-display); font-size: 1.25rem; }
.chip svg { width: 30px; height: 30px; flex: none; }
.chip b { font-weight: 400; font-variant-numeric: tabular-nums; }
.chip .lbl { font-family: var(--f-body); font-size: 0.85rem; color: var(--muted); line-height: 1.1; }
#sunchip { padding-right: 16px; }
#sunarc { width: 96px; height: 40px; }
.ibtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.ibtn { width: 52px; height: 52px; border-radius: 14px; border: 3px solid var(--wood); background: var(--board); box-shadow: 0 3px 0 var(--wood-line); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem; padding: 0; }
.ibtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-line); }
.ibtn svg { width: 28px; height: 28px; }
.ibtn[aria-pressed="true"] { background: var(--gold); }

/* Hint line */
#hint { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(72px + env(safe-area-inset-top, 0px)); max-width: min(92vw, 640px); background: rgba(42, 29, 14, 0.82); color: #fff; padding: 8px 16px; border-radius: 12px; font-size: 1.05rem; text-align: center; pointer-events: none; transition: opacity .25s; }
#hint.off { opacity: 0; }

/* Bottom toolbar */
#tools { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; gap: 8px; pointer-events: none; }
#tools button { pointer-events: auto; flex: 1 1 0; max-width: 128px; min-width: 56px; min-height: 68px; border-radius: 14px; border: 3px solid var(--wood-line); background: var(--wood-2); color: #fff3d6; box-shadow: 0 4px 0 var(--wood-line); display: grid; gap: 2px; place-items: center; padding: 6px 4px; font-size: 0.95rem; font-weight: 800; line-height: 1; }
#tools button svg { width: 30px; height: 30px; }
#tools button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-line); }
#tools button .badge { position: absolute; }
#tools button { position: relative; }
.badge { position: absolute; top: -8px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--bad); color: #fff; font-size: 0.85rem; display: grid; place-items: center; padding: 0 6px; border: 2px solid #fff; }

/* Frame HUD: labels float over the 3D frame, actions sit above the toolbar */
.flabel { position: absolute; z-index: 5; transform: translate(-50%, -50%); background: var(--board); border: 3px solid var(--grass-ink); color: var(--ink); border-radius: 10px; padding: 2px 10px; font-family: var(--f-display); font-size: 1.35rem; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.flabel.part { background: #fff; border-color: var(--blue); font-size: 1.05rem; }
#frameact { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
#frameact[hidden] { display: none; }
.btn { min-height: 52px; padding: 8px 18px; border-radius: 14px; border: 3px solid var(--wood-line); background: var(--board); box-shadow: 0 4px 0 var(--wood-line); font-weight: 800; font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-line); }
.btn.primary { background: var(--grass); color: #fff; border-color: #1f5a24; box-shadow: 0 4px 0 #1f5a24; }
.btn.gold { background: var(--gold); color: var(--gold-ink); }
.btn.ghost { background: transparent; box-shadow: none; border-color: var(--board-line); }
.btn.big { min-height: 64px; font-size: 1.3rem; padding: 10px 28px; }
.btn.sq { min-width: 56px; padding: 8px; font-family: var(--f-display); font-size: 1.3rem; font-weight: 400; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn.on { background: var(--gold); color: var(--gold-ink); }

/* Toasts that float out of the world */
.toast { position: absolute; z-index: 7; transform: translate(-50%, -50%); background: #fff; border: 3px solid var(--wood); border-radius: 12px; padding: 6px 14px; font-weight: 800; font-size: 1.15rem; pointer-events: none; animation: rise 1.8s ease-out forwards; white-space: nowrap; }
.toast.bad { border-color: var(--bad); color: var(--bad); }
.toast.good { border-color: var(--good); color: var(--good); }
@keyframes rise { 0% { opacity: 0; translate: 0 10px; } 15% { opacity: 1; translate: 0 0; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -40px; } }

/* Modal boards */
#modal { position: absolute; inset: 0; z-index: 50; background: rgba(20, 30, 40, 0.45); display: grid; place-items: center; padding: 12px; overflow: auto; }
#modal[hidden] { display: none; }
.board { width: min(100%, 720px); min-width: 0; max-width: 100%; max-height: calc(100% - 8px); overflow: auto; background: var(--board); border: 4px solid var(--wood); border-radius: 22px; box-shadow: 0 8px 0 var(--wood-line), 0 20px 40px rgba(0,0,0,0.35); padding: 18px; display: grid; gap: 14px; }
.board.wide { width: min(100%, 860px); }
.bhead { display: flex; align-items: center; gap: 12px; }
.bhead .who { width: 56px; height: 56px; flex: none; image-rendering: pixelated; border-radius: 12px; background: var(--board-2); }
.bhead h2 { flex: 1; min-width: 0; }
.bubble { background: #fff; border: 3px solid var(--board-line); border-radius: 16px; padding: 12px 16px; font-size: 1.15rem; position: relative; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.close { margin-left: auto; }

/* Number entry: big readout, keypad and stacks of ten */
.readout { font-family: var(--f-display); font-size: 3rem; text-align: center; background: #fff; border: 3px solid var(--wood); border-radius: 14px; padding: 6px; min-height: 76px; font-variant-numeric: tabular-nums; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad .btn { min-height: 56px; font-family: var(--f-display); font-size: 1.5rem; font-weight: 400; }
.stacks { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; min-height: 56px; padding: 6px; background: var(--board-2); border-radius: 12px; }
.stack { display: grid; gap: 1px; }
.stack i { display: block; width: 12px; height: 5px; background: #c58a3c; border: 1px solid #7a4e1c; }
.stack.one i { background: #ffd56a; }
.entry { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 520px) { .entry { grid-template-columns: 1fr; } }

/* Word work */
.slots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 64px; }
.slot { min-width: 52px; height: 60px; border-radius: 10px; border: 3px dashed var(--board-line); background: #fff; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; padding: 0 10px; }
.slot.filled { border-style: solid; border-color: var(--wood); }
.slot.hole { border-color: var(--bad); background: #ffe9ea; border-style: solid; }
.slot.lit { border-color: var(--gold); background: #fff3c4; box-shadow: 0 0 0 4px #ffe08a; }
.slot.stress { color: var(--bad); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { min-width: 56px; min-height: 56px; border-radius: 12px; border: 3px solid var(--wood-line); background: #e9c893; box-shadow: 0 4px 0 var(--wood-line); font-family: var(--f-display); font-size: 1.5rem; padding: 4px 12px; }
.tile.used { opacity: 0.25; pointer-events: none; }
.tile.part { background: #cfe8ff; }
.tile.gap { background: #ffd9d9; }
.bigword { font-family: var(--f-display); font-size: 2.6rem; text-align: center; letter-spacing: 0.04em; padding: 10px; background: #fff; border-radius: 14px; border: 3px solid var(--wood); min-height: 86px; display: grid; place-items: center; }
.bigword .syl { color: var(--blue); }
.recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.recipe { border: 3px solid var(--board-line); background: #fff; border-radius: 14px; padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.recipe img, .recipe canvas { width: 64px; height: 64px; image-rendering: pixelated; }
.recipe b { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; }
.recipe.done { opacity: 0.55; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs .btn { min-height: 46px; font-size: 1rem; }

/* Trade */
.coins { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.coin { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #a67c00; background: radial-gradient(circle at 35% 35%, #ffe48a, #e0a800); font-family: var(--f-display); font-size: 1.3rem; color: #3a2a00; box-shadow: 0 4px 0 #7a5a00; display: grid; place-items: center; }
.coin.bill { border-radius: 10px; width: 92px; height: 56px; background: linear-gradient(135deg, #cfe9c8, #8fcf8a); border-color: #3a7a3a; color: #10351a; box-shadow: 0 4px 0 #2a5a2a; }
.counter { min-height: 80px; background: #e6d6b2; border: 3px solid var(--wood); border-radius: 14px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.counter .coin { width: 44px; height: 44px; font-size: 0.95rem; box-shadow: none; }
.counter .coin.bill { width: 64px; height: 38px; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shop .btn { display: grid; gap: 4px; justify-items: center; min-height: 92px; }
.price { font-family: var(--f-display); color: var(--gold-ink); background: var(--gold); border-radius: 999px; padding: 2px 10px; }

/* Lists & stats */
.list { display: grid; gap: 8px; }
.card { background: #fff; border: 3px solid var(--board-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.card.active { border-color: var(--grass); }
.card h3 { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.85rem; background: var(--board-2); color: var(--muted); }
.pill.go { background: var(--grass); color: #fff; }
.tablewrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 1rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--board-line); font-variant-numeric: tabular-nums; }
th { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
textarea { width: 100%; min-height: 160px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 3px solid var(--board-line); border-radius: 12px; padding: 10px; background: #fff; color: var(--ink); user-select: text; -webkit-user-select: text; }
.sign { font-size: 1.5rem; font-family: var(--f-display); text-align: center; background: #d9b66a; border: 4px solid var(--wood-line); border-radius: 10px; padding: 14px; }
.sign .gap { display: inline-block; min-width: 2.4em; border-bottom: 4px solid var(--bad); color: var(--bad); }
.q { font-family: var(--f-display); font-size: 1.25rem; }
.q em { font-style: normal; color: var(--bad); text-decoration: underline; }
.meter { height: 12px; width: 80px; background: var(--board-2); border-radius: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--grass); }

/* Night & start overlays */
#night { position: absolute; inset: 0; z-index: 60; background: rgba(8, 12, 40, 0.55); display: grid; place-items: center; padding: 16px; }
#night[hidden] { display: none; }
#start { position: absolute; inset: 0; z-index: 70; background: linear-gradient(#5ab8ff, #8fd3ff 60%, #6fbf5e); display: grid; place-items: center; padding: 16px; text-align: center; }
#start[hidden] { display: none; }
#start h1 { font-size: clamp(2.4rem, 9vw, 4.5rem); color: #fff; text-shadow: 0 4px 0 #2b5a2e, 0 8px 16px rgba(0,0,0,0.3); }
#start canvas { image-rendering: pixelated; width: min(60vw, 220px); height: auto; }
.tip { font-size: 0.95rem; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app">
  <div id="c3d"></div>

  <div id="top">
    <div class="chip" id="sunchip" title="День">
      <svg id="sunarc" viewBox="0 0 96 40" aria-hidden="true">
        <path d="M6 36 A42 42 0 0 1 90 36" fill="none" stroke="#c9b27c" stroke-width="3" stroke-dasharray="4 5"/>
        <circle id="sundot" cx="6" cy="36" r="8" fill="#ffc83d" stroke="#b07a00" stroke-width="2"/>
      </svg>
      <div><b id="dayno">День 1</b><div class="lbl" id="daylbl">утро</div></div>
    </div>
    <div class="chip" title="Монеты">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#ffc83d" stroke="#a67c00" stroke-width="3"/><text x="16" y="21" text-anchor="middle" font-size="14" font-family="Russo One, sans-serif" fill="#3a2a00">₽</text></svg>
      <b id="coins">0</b>
    </div>
    <div class="ibtns">
      <button class="ibtn" id="b-rotl" aria-label="Повернуть влево">⟲</button>
      <button class="ibtn" id="b-rotr" aria-label="Повернуть вправо">⟳</button>
      <button class="ibtn" id="b-zin" aria-label="Приблизить">+</button>
      <button class="ibtn" id="b-zout" aria-label="Отдалить">−</button>
      <button class="ibtn" id="b-pause" aria-label="Пауза" aria-pressed="false">❚❚</button>
      <button class="ibtn" id="b-sound" aria-label="Звук" aria-pressed="true">♪</button>
      <button class="ibtn" id="b-gear" aria-label="Для взрослого (удерживать 2 секунды)">⚙</button>
    </div>
  </div>

  <div id="hint" class="off"></div>

  <div id="frameact" hidden></div>

  <div id="tools">
    <button data-tool="pick" aria-pressed="true"><svg viewBox="0 0 32 32"><path d="M6 26 L18 14" stroke="#6b4423" stroke-width="4" stroke-linecap="round"/><path d="M12 6 Q22 4 28 12 Q22 10 16 16 Q20 10 12 6Z" fill="#9aa4ab"/></svg>Кирка</button>
    <button data-tool="place"><svg viewBox="0 0 32 32"><path d="M6 12 L16 6 L26 12 L16 18Z" fill="#7bc96f"/><path d="M6 12 L16 18 L16 28 L6 22Z" fill="#8b5a2b"/><path d="M26 12 L16 18 L16 28 L26 22Z" fill="#6e4521"/></svg>Блок</button>
    <button data-tool="frame"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" fill="none" stroke="#2e9d5c" stroke-width="4" stroke-dasharray="6 4"/></svg>Рамка</button>
    <button data-tool="craft"><svg viewBox="0 0 32 32"><rect x="4" y="12" width="24" height="8" fill="#8a5a2e"/><rect x="6" y="20" width="5" height="8" fill="#6b4423"/><rect x="21" y="20" width="5" height="8" fill="#6b4423"/><rect x="12" y="6" width="8" height="6" fill="#9aa4ab"/></svg>Верстак</button>
    <button data-tool="bag"><svg viewBox="0 0 32 32"><rect x="6" y="10" width="20" height="18" rx="4" fill="#c58a3c"/><rect x="11" y="5" width="10" height="7" rx="3" fill="none" stroke="#6b4423" stroke-width="3"/><rect x="12" y="16" width="8" height="5" fill="#6b4423"/></svg>Рюкзак</button>
    <button data-tool="quests"><svg viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="2" fill="#fff6dc" stroke="#6b4423" stroke-width="3"/><path d="M11 11h10M11 16h10M11 21h6" stroke="#2f80ed" stroke-width="3" stroke-linecap="round"/></svg>Задания<span class="badge" id="qbadge" hidden>0</span></button>
  </div>

  <div id="modal" hidden><div class="board" id="board"></div></div>

  <div id="night" hidden>
    <div class="board" style="width:min(100%,520px)">
      <h2>Ночь в Блокограде</h2>
      <p class="bubble" id="nighttext">Солнце село. Жители идут спать, и строить уже темно.</p>
      <div class="row end">
        <button class="btn" id="b-more">Ещё чуть-чуть</button>
        <button class="btn primary big" id="b-sleep">Сохранить и закончить день</button>
      </div>
    </div>
  </div>

  <div id="start">
    <div style="display:grid;gap:18px;justify-items:center;max-width:520px">
      <canvas id="startart" width="96" height="64"></canvas>
      <h1>Блокоград</h1>
      <p style="color:#fff;font-size:1.2rem;text-shadow:0 2px 0 rgba(0,0,0,.3)">Остров, где ты копаешь, строишь, крафтишь и торгуешь.</p>
      <button class="btn primary big" id="b-play">Играть</button>
      <p class="tip" style="color:#eafbe6">Планшет: касайся пальцем или пером. Ноутбук: мышь.</p>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.158.0/three.min.js"></script>
